plugins { id 'com.android.application' }

android {
    namespace 'ru.family.glucodiary'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.family.glucodiary'
        minSdk 26
        targetSdk 35
        versionCode 27
        versionName '0.26.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DGGML_OPENMP=OFF', '-DGGML_NATIVE=OFF', '-DGGML_LLAMAFILE=OFF', '-DLLAMA_CURL=OFF', '-DLLAMA_OPENSSL=OFF'
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.test' }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
