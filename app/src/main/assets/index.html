(function(global){'use strict';

function persist(){if(!native)try{localStorage.setItem('glucofamily-v01',JSON.stringify({events:app.events,readings:app.readings,ill:app.ill,illSince:app.illSince,customFoods:app.foods.filter(f=>f.source==='Мой продукт'),profile:app.profile,mealDraft:app.mealDraft,mealDraftTime:app.mealDraftTime}))}catch(ignore){app.localStorageBlocked=true}}
async function init(){try{if(native){const data=JSON.parse(window.GlucoBridge.getData());Object.assign(app,data)}else{app.foods=SEED_FOODS.map((x,i)=>({...x,id:i+1}));let raw='{}';try{raw=localStorage.getItem('glucofamily-v01')||'{}'}catch(ignore){}const s=JSON.parse(raw);app.events=s.events||[];app.readings=s.readings||[];app.ill=!!s.ill;app.illSince=s.illSince||0;app.foods.push(...(s.customFoods||[]));app.profile=s.profile||{};app.mealDraft=s.mealDraft||[];app.mealDraftTime=s.mealDraftTime||''}app.profile=app.profile||{};app.mealDraft=app.mealDraft||[];render()}catch(e){document.querySelector('#view').innerHTML='<div class="banner danger">Ошибка запуска: '+esc(e.message)+'</div>'}}
function navigate(to){app.tab=to;app.foodQuery='';app.foodCategory='Все';render();window.scrollTo(0,0)}
function topHead(t,sub=''){return '<div class="h1">'+t+'</div>'+(sub?'<div class="muted" style="margin:-6px 0 15px">'+sub+'</div>':'')}
function toggleIll(){app.ill=!app.ill;app.illSince=app.ill?Date.now():0;if(native)window.GlucoBridge.setIll(app.ill);else persist();render()}
function getLast(){return app.readings.length?[...app.readings].sort((a,b)=>b.ts-a.ts)[0]:null}

function graph(){const rows=[...app.readings].filter(r=>Date.now()-r.ts<12*3600000).sort((a,b)=>a.ts-b.ts);if(rows.length<2)return '<div class="chart"><div class="muted" style="text-align:center">Здесь появится график глюкозы<br>после подключения xDrip+</div></div>';const minX=rows[0].ts,maxX=rows[rows.length-1].ts;const W=330,H=150;const yy=v=>H-20-Math.max(0,Math.min(1,(v-2)/14))*(H-35);const xx=t=>14+(t-minX)/(maxX-minX||1)*(W-28);const pts=rows.map(r=>xx(r.ts).toFixed(1)+','+yy(r.mmol).toFixed(1)).join(' ');return '<div class="chart"><svg viewBox="0 0 330 150" role="img" aria-label="График глюкозы за 12 часов"><path d="M0,43 H330 M0,90 H330 M0,132 H330" stroke="#e4eeee" fill="none" stroke-dasharray="4 4"/><polyline points="'+pts+'" fill="none" stroke="#148e88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="7" y="13" font-size="10" fill="#9daeb0">ммоль/л</text></svg></div>'}

function renderDiary(){const now=new Date();now.setDate(now.getDate()+app.dayOffset);const d=now.toDateString();const es=[...app.events].filter(e=>new Date(e.ts).toDateString()===d).sort((a,b)=>b.ts-a.ts);let html=topHead('Дневник','Питание, фактические инъекции, заметки')+'<div class="card"><div class="row"><button class="btn ghost" data-action="prev">‹</button><div class="strong">'+now.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+'</div><button class="btn ghost" data-action="next">›</button></div></div><div class="grid2" style="margin-bottom:12px"><button class="btn secondary" data-action="gofoods">+ Еда</button><button class="btn secondary" data-action="insulin">+ Инсулин</button></div><button class="btn ghost full" style="margin-bottom:13px" data-action="note">+ Добавить заметку / симптомы</button><div class="card"><div class="h2" style="margin-bottom:8px">События</div>';
if(!es.length)html+='<div class="empty">Пока нет записей за выбранный день.<br>Добавь питание или фактическую инъекцию.</div>';for(let x of es){const icon=x.type==='meal'?'🍲':x.type==='insulin'?'💉':'📝';let desc=x.type==='meal'?fmt(x.grams,0)+' г · У '+fmt(x.carbs)+' г · Б '+fmt(x.protein)+' г · Ж '+fmt(x.fat)+' г':x.type==='insulin'?fmt(x.units,2)+' ЕД · '+esc(x.insulinName||'Название не указано'):esc(x.note||'');html+='<div class="event"><div class="circle">'+icon+'</div><div class="meta"><div class="row"><b>'+esc(x.name||'Событие')+'</b><span class="muted">'+when(x.ts)+'</span></div><div class="muted">'+desc+'</div></div><button class="del" aria-label="Удалить запись" data-action="delete" data-id="'+x.id+'">×</button></div>'}return html+'</div>'+safetyNote()}
function foodCategories(){return ['Все',...new Set(app.foods.map(f=>f.category))]}
function filterFoods(){const q=app.foodQuery.trim().toLowerCase();return app.foods.filter(f=>(app.foodCategory==='Все'||f.category===app.foodCategory)&&f.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ru')).slice(0,120)}
function foodResults(){const f=filterFoods();return '<div class="muted" style="margin-bottom:9px">Показано '+f.length+' из '+app.foods.length+' продуктов · БЖУ на 100 г</div>'+f.map(x=>'<button class="foodrow" data-action="food" data-id="'+x.id+'"><div><b>'+esc(x.name)+'</b><span>У '+fmt(x.carbs)+' · Б '+fmt(x.protein)+' · Ж '+fmt(x.fat)+' · '+fmt(x.kcal,0)+' ккал</span></div><span class="arr">›</span></button>').join('')+(f.length===0?'<div class="empty">Ничего не найдено. Можно добавить свой продукт.</div>':'')}
function renderFoods(){return topHead('Продукты и блюда','Каталог для Беларуси · БЖУ на 100 г')+'<div class="search">⌕ <input id="foodSearch" placeholder="Поиск: гречка, хлеб, молоко…" value="'+esc(app.foodQuery)+'" autocomplete="off" inputmode="search"/></div><div class="categories">'+foodCategories().map(c=>'<button data-action="category" data-cat="'+esc(c)+'" class="cat '+(app.foodCategory===c?'active':'')+'">'+esc(c)+'</button>').join('')+'</div><div class="row" style="margin-bottom:10px"><div class="h2">Каталог</div><button class="linkbtn" data-action="custom">+ Свой продукт</button></div><div id="foodResults">'+foodResults()+'</div><div class="banner warning">Начальные '+app.foods.length+' записей включают ориентировочные справочные значения. Проверяй БЖУ по упаковке/рецепту. Для расширения каталога до 2000 записей открой «Ещё» → «Загрузить каталог».</div>'+safetyNote()}

// Исследовательский профиль — эти значения никогда не участвуют в вычислении лечебных доз.
const DAY_PARTS=[['morning','Утро · 05–11'],['day','День · 11–17'],['evening','Вечер · 17–24']];
const COEF_METRICS=[['icr','Углеводный коэффициент','г углеводов на 1 ЕД'],['isf','ФЧИ / коэффициент коррекции','ммоль/л на 1 ЕД']];
function coefVal(key,part){return app.profile?.coefficients?.[key]?.[part] ?? null}
function formatCoef(key,part){const x=coefVal(key,part);return x===null||x===''?'Не задано':fmt(x,2)+(key==='icr'?' г/ЕД':' ммоль/л/ЕД')}
function persistProfile(){if(native){if(!window.GlucoBridge.setProfile(JSON.stringify(app.profile))){notify('Не удалось сохранить профиль');return false}}else persist();return true}
function saveProfileBasics(){const age=document.getElementById('profileAge').value,weight=document.getElementById('profileWeight').value,height=document.getElementById('profileHeight').value;const clean=(s,max)=>{if(!s.trim())return null;const n=Number(s.replace(',','.'));return Number.isFinite(n)&&n>0&&n<max?n:NaN};const vals={age:clean(age,22),weight:clean(weight,250),height:clean(height,230)};if(Object.values(vals).some(x=>Number.isNaN(x))){notify('Проверьте возраст, рост и вес');return}const allergies=document.getElementById('profileAllergy').value.slice(0,400).trim(),step=document.getElementById('profileStep').value;app.profile={...app.profile,...vals,allergies,step:Number(step)||.5};if(!persistProfile())return;closeModal();notify('Данные ребёнка сохранены');render()}
function profileModal(){const p=app.profile||{};modal('<div class="row"><h2>Профиль ребёнка</h2><button class="close" data-action="close">×</button></div><div class="banner">Эти данные используются в дневнике. Возраст и вес сами по себе не задают безопасную дозу инсулина.</div>'+[['profileAge','Возраст, полных лет',p.age,'1'],['profileWeight','Вес, кг',p.weight,'0.1'],['profileHeight','Рост, см',p.height,'0.1']].map(x=>'<div class="field"><label>'+x[1]+'</label><input class="input" id="'+x[0]+'" type="number" min="0" step="'+x[3]+'" value="'+esc(x[2]??'')+'" placeholder="Не указано"></div>').join('')+'<div class="field"><label>Аллергии / непереносимость (через запятую)</label><textarea class="input" id="profileAllergy" rows="2" placeholder="Например, арахис, белок молока">'+esc(p.allergies||'')+'</textarea></div><div class="field"><label>Шаг шприц-ручки (для записи факта, ЕД)</label><select class="input" id="profileStep"><option value="0.5" '+(p.step!==1?'selected':'')+'>0,5 ЕД</option><option value="1" '+(p.step===1?'selected':'')+'>1 ЕД</option></select></div><button class="btn full" data-action="saveProfileBasics">Сохранить профиль</button>')}
function coefModal(){const rows=COEF_METRICS.map(([key,label,unit])=>'<div class="h2" style="margin:18px 0 6px">'+label+'</div><div class="muted">'+unit+' · оставьте пустым, если неизвестно</div>'+DAY_PARTS.map(([part,name])=>'<div class="field"><label>'+name+'</label><input class="input coefInput" id="coef_'+key+'_'+part+'" inputmode="decimal" type="number" min="0.01" max="250" step="0.01" value="'+esc(coefVal(key,part)??'')+'" placeholder="Не задано"></div>').join('')).join('');modal('<div class="row"><h2>Редактировать коэффициенты</h2><button class="close" data-action="close">×</button></div><div class="banner warning">Ручные значения — только справочные. Они не применяются к рекомендациям об инъекции. Для лечебного использования нужен согласованный план и проверенный расчётный модуль.</div>'+rows+'<div class="field"><label>Причина изменения</label><input class="input" id="coefReason" placeholder="Например, перенос значений из дневника" maxlength="200"></div><button class="btn full" data-action="saveCoef">Сохранить с историей изменений</button>')}
function saveCoef(){const updated={};for(const [key] of COEF_METRICS){updated[key]={};for(const [part] of DAY_PARTS){const raw=document.getElementById('coef_'+key+'_'+part).value.trim().replace(',','.');if(!raw){updated[key][part]=null;continue}const v=Number(raw);if(!Number.isFinite(v)||v<=0||v>250){notify('Проверьте значения коэффициентов');return}updated[key][part]=v}}const old=JSON.parse(JSON.stringify(app.profile.coefficients||{}));const why=document.getElementById('coefReason').value.trim().slice(0,200);app.profile.coefficients=updated;app.profile.coefficientHistory=[{at:Date.now(),source:'Ручной ввод',reason:why||'Ручная корректировка',previous:old,current:updated},...(app.profile.coefficientHistory||[])].slice(0,50);if(!persistProfile())return;closeModal();notify('Сохранено. Профиль не применяется к дозированию');render()}
function glucoseClosest(ts,maxGap){let best=null,dist=maxGap+1;for(const r of app.readings){const d=Math.abs(Number(r.ts)-ts);if(d<dist&&Number.isFinite(Number(r.mmol))){dist=d;best=r}}return best}
function observationsByPart(){const now=Date.now();return DAY_PARTS.map(([key,label],i)=>{const mealRows=app.events.filter(e=>e.type==='meal'&&(e.status!=='planned'&&e.status!=='started')&&e.ts>=now-14*86400000&&e.ts<=now&&((new Date(e.ts).getHours()>=([5,11,17][i]))&&(new Date(e.ts).getHours()<([11,17,24][i]))));let deltas=[];for(const m of mealRows){const before=glucoseClosest(m.ts-5*60000,15*60000),after=glucoseClosest(m.ts+120*60000,25*60000);if(before&&after&&after.ts>before.ts){deltas.push(after.mmol-before.mmol)}}const mean=deltas.length?deltas.reduce((a,b)=>a+b,0)/deltas.length:null;return {key,label,meals:mealRows.length,samples:deltas.length,mean}})}
function renderCoefBlock(){const p=app.profile||{};const cards=COEF_METRICS.map(([key,label,unit])=>'<div class="card"><div class="h2">'+label+'</div><div class="muted">'+unit+'</div>'+DAY_PARTS.map(([part,period])=>'<div class="readout"><div><b>'+period+'</b><div class="muted">Ручной профиль / исследование</div></div><div class="strong">'+formatCoef(key,part)+'</div></div>').join('')+'</div>').join('');const history=(p.coefficientHistory||[]).slice(0,3).map(h=>'<div class="readout"><span>'+fullWhen(h.at)+'</span><span class="muted">'+esc(h.reason||h.source)+'</span></div>').join('');const summaries=observationsByPart().map(x=>'<div class="readout"><div><b>'+x.label+'</b><div class="muted">За 14 дней: '+x.meals+' приёмов пищи; '+x.samples+' пар CGM</div></div><span class="minipill">'+(x.samples>=3?'Есть наблюдения':'Недостаточно данных')+'</span></div>'+(x.samples>=3?'<div class="muted" style="margin-bottom:8px">Среднее изменение через ≈2 часа: '+(x.mean>0?'+':'')+fmt(x.mean)+' ммоль/л. Это не ФЧИ и не расчёт дозы.</div>':'')).join('');return '<div class="card"><div class="row"><div><div class="h2">Коэффициенты и чувствительность</div><div class="muted">Без вымышленных стартовых значений</div></div><button class="btn secondary" data-action="editCoef">Изменить</button></div><div class="banner">Данные в ммоль/л из xDrip+. Углеводный коэффициент измеряется в г/ЕД, а ФЧИ — в ммоль/л на 1 ЕД. Они не равнозначны.</div></div>'+cards+'<div class="card"><div class="h2">Автоматический анализ наблюдений</div>'+summaries+'<div class="banner warning">ИИ не заполняет числовые лечебные коэффициенты на основании нескольких дней CGM: корреляция с едой ещё не устанавливает действие отдельной дозы. Автоматическая клиническая оценка и её проверка — отдельный этап.</div></div><div class="card"><div class="h2">Дополнительные параметры</div>'+[['Шаг введения',((p.step??.5)+' ЕД')],['Время действия инсулина / IOB','Не задано — потребуется тип препарата и валидированная модель'],['Базальный инсулин','Фактические введения фиксируются в дневнике'],['Целевой диапазон','По индивидуальному медицинскому плану'],['Болезнь',app.ill?'Активно — анализ отдельно':'Нет отметки болезни']].map(r=>'<div class="readout"><span class="muted">'+r[0]+'</span><b style="text-align:right;max-width:58%;font-size:12px">'+esc(r[1])+'</b></div>').join('')+'</div><div class="card"><div class="h2">История корректировок</div>'+(history||'<div class="muted" style="margin-top:8px">Изменений пока нет</div>')+'</div>'}

function renderStats(){const week=Date.now()-7*86400000;const es=app.events.filter(x=>x.ts>=week);const meals=es.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),ins=es.filter(x=>x.type==='insulin');const rs=app.readings.filter(x=>x.ts>=week);const avg=rs.length?fmt(rs.reduce((a,x)=>a+x.mmol,0)/rs.length):'—';const countDays=new Set(meals.map(m=>new Date(m.ts).toDateString())).size;let blocks=['Утро','День','Вечер'].map((t,i)=>{const a=i===0?5:i===1?11:17,b=i===0?11:i===1?17:24,groups=meals.filter(e=>{const h=new Date(e.ts).getHours();return h>=a&&h<b});return '<div class="readout"><div><b>'+t+'</b><div class="muted">'+groups.length+' приёмов пищи за 7 дней</div></div><span class="minipill">'+(groups.length>=5?'Есть история':'Мало данных')+'</span></div>'}).join('');return topHead('Анализ истории','Исследовательская аналитика без рекомендаций доз')+'<div class="card"><div class="h2" style="margin-bottom:13px">Последние 7 дней</div><div class="metrics"><div class="metric"><b>'+rs.length+'</b><span>Измерений CGM</span></div><div class="metric"><b>'+meals.length+'</b><span>Приёмов пищи</span></div><div class="metric"><b>'+ins.length+'</b><span>Инъекций</span></div></div><div class="readout"><span class="muted">Средняя глюкоза по доступным показаниям</span><b>'+avg+' ммоль/л</b></div><div class="readout"><span class="muted">Дней с записью еды</span><b>'+countDays+' из 7</b></div></div>'+
renderCoefBlock()+
'<div class="card"><div class="h2">Наблюдения</div><div class="event"><div class="circle">🔎</div><div class="meta"><b>'+(!rs.length?'Нет данных CGM':'Данные CGM сохранены')+'</b><div class="muted">'+(!rs.length?'Подключите xDrip+ в настройках для построения статистики.':'Статистика строится только по полученным показаниям; пропуски не заполняются выдуманными значениями.')+'</div></div></div><div class="event"><div class="circle">📝</div><div class="meta"><b>Дневник '+(meals.length&&ins.length?'заполняется':'пока неполный')+'</b><div class="muted">Для анализа обязательно фиксировать время еды, фактическую граммовку, время и количество инсулина.</div></div></div></div>'+safetyNote()}
function renderSettingsOld(){return topHead('Настройки и экспорт','Профиль ребёнка, подключение xDrip+ и экспорт')+'<div class="card"><div class="row"><div><div class="h2">👤 Профиль ребёнка</div><div class="muted">Возраст: '+esc(app.profile?.age??'не указан')+' · Вес: '+esc(app.profile?.weight??'—')+' кг · Рост: '+esc(app.profile?.height??'—')+' см</div><div class="muted">Аллергии: '+esc(app.profile?.allergies||'не указаны')+'</div></div><button class="btn secondary" data-action="editProfile">Изменить</button></div><div class="banner warning">При аллергии необходимо исключать аллерген по медицинскому плану и проверять состав; уменьшение порции не гарантирует безопасности.</div></div>'+'<div class="card"><div class="h2">📡 xDrip+ Follower</div><p class="muted">На этом же телефоне в xDrip+ открой: Settings → Inter-app settings → Web Service → Enable Web Service. Наше приложение читает только 127.0.0.1:17580/sgv.json. «Open Web Service» включать НЕ нужно.</p><button class="btn secondary full" data-action="refresh">Проверить соединение</button><div class="banner">'+(app.glucoseInfo?esc(app.glucoseInfo):'Если показаний нет, проверьте, что xDrip+ получает данные ребёнка и локальный Web Service запущен.')+'</div></div>'+
'<div class="card"><div class="h2">📚 Каталог продуктов</div><p class="muted">Сейчас '+app.foods.length+' записей. Можно дополнить каталог открытой базой Open Food Facts (цель — до 2000 заполненных записей). Нужен интернет, некоторые позиции Беларуси могут отсутствовать.</p><button class="btn secondary full" data-action="import">Загрузить каталог до 2000 продуктов</button><div class="muted" style="margin-top:9px">'+esc(app.importMessage||'Продукты из Open Food Facts имеют источник и должны проверяться по этикетке.')+'</div></div>'+
'<div class="card"><div class="h2">📄 Отчёт врачу</div><p class="muted">Записи о пище, инъекциях, болезни и краткая сводка CGM за семь дней. Экспорт PDF на устройстве.</p><button class="btn secondary full" data-action="export">Экспортировать PDF</button></div>'+
'<div class="card"><div class="h2">🔐 Приватность</div><p class="muted">Записи хранятся локально в памяти приложения. Передачи медицинских данных на внешний ИИ-сервер нет. Использование Open Food Facts выполняет сетевые запросы только для каталога продуктов.</p></div>'+safetyNote()}
function render(){document.querySelector('#view').innerHTML=app.tab==='home'?renderHome():app.tab==='diary'?renderDiary():app.tab==='foods'?renderFoods():app.tab==='stats'?renderStats():renderSettings();document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===app.tab));const s=document.getElementById('foodSearch');if(s)s.oninput=e=>{app.foodQuery=e.target.value;document.getElementById('foodResults').innerHTML=foodResults()}}
function modal(body){document.querySelector('#modalRoot').innerHTML='<div class="modalCover"><div class="modal">'+body+'</div></div>'}
function closeModal(){document.querySelector('#modalRoot').innerHTML=''}
function productModal(id){const f=app.foods.find(f=>String(f.id)===String(id));if(!f)return;app.selectedFood=f;modal('<div class="row"><div><h2>'+esc(f.name)+'</h2><div class="muted">'+esc(f.category)+' · на 100 г</div></div><button class="close" data-action="close">×</button></div><div class="field"><label>Масса съеденной порции, г</label><input class="input" id="grams" type="number" min="1" max="5000" step="1" value="100"/></div><div class="card" style="background:#f4f8f8;box-shadow:none" id="portionFacts"></div><div class="muted">Источник: '+esc(f.source)+'</div><div class="spacer"></div><button class="btn full" data-action="saveMeal">Записать приём пищи</button>');document.getElementById('grams').oninput=drawPortion;drawPortion()}
function drawPortion(){const f=app.selectedFood,v=Math.max(0,Number(document.getElementById('grams').value)||0)/100;document.getElementById('portionFacts').innerHTML='<div class="h2">'+fmt(f.carbs*v)+' г углеводов</div><div class="row" style="margin-top:7px"><span class="muted">Белки '+fmt(f.protein*v)+' г</span><span class="muted">Жиры '+fmt(f.fat*v)+' г</span><b>'+fmt(f.kcal*v,0)+' ккал</b></div>'}
function addEvent(e){e.ts=Number(e.ts||Date.now());if(native){const val=window.GlucoBridge.addEvent(JSON.stringify(e));if(!val || Number(val)<=0){notify('Не удалось сохранить');return false}e.id=Number(val)}else{e.id=Date.now()+Math.floor(Math.random()*1000);app.events.push(e);persist()}if(native){app.events.push(e)}closeModal();notify('Запись сохранена');navigate('diary');return true}
function saveMeal(){const f=app.selectedFood;const grams=Number(document.getElementById('grams').value);if(!Number.isFinite(grams)||grams<=0||grams>5000){notify('Проверьте граммовку');return}const v=grams/100;addEvent({type:'meal',name:f.name,grams,carbs:f.carbs*v,protein:f.protein*v,fat:f.fat*v,kcal:f.kcal*v})}
function insulinModal(){modal('<div class="row"><h2>Записать введённый инсулин</h2><button class="close" data-action="close">×</button></div><div class="banner warning">Здесь фиксируется только уже введённый инсулин. Приложение не рассчитывает дозу.</div><div class="field"><label>Название / тип инсулина</label><input class="input" id="insName" placeholder="Например, название на упаковке"/></div><div class="field"><label>Фактически введённая доза, ЕД</label><input class="input" id="insUnits" type="number" min="0.1" max="100" step="0.1" placeholder="0,0"/></div><div class="field"><label>Время введения</label><input class="input" id="insTime" type="datetime-local" /></div><button class="btn full" data-action="saveIns">Сохранить в дневник</button>');document.querySelector('#insTime').value=localIso(new Date())}
function localIso(dt){return new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}

const rnum=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:NaN};

const sumMeal=items=>items.reduce((a,x)=>{for(const k of ['grams','carbs','protein','fat','kcal'])a[k]+=Number(x[k]||0);return a},{grams:0,carbs:0,protein:0,fat:0,kcal:0});
const allTags=f=>{
  const text=(f.name+' '+(f.ingredients||'')+' '+(f.allergens||'')).toLowerCase();
  let x=[];
  if(/пшенич|рож|ячмен|булгур|макарон|батон|хлеб|крупа манн|глютен|пшениц|булоч|бородинск|овсян/.test(text))x.push('глютен');
  if(/молок|творог|сыр|сливк|кефир|йогурт|сметан|масло сливоч/.test(text))x.push('молоко');
  if(/яйц|яич|майонез/.test(text))x.push('яйца');
  if(/арахис/.test(text))x.push('арахис');
  if(/орех|фундук|миндал|грецк/.test(text))x.push('орехи');
  if(/рыб|треск|лосос|селед/.test(text))x.push('рыба');
  return [...new Set([...(Array.isArray(f.allergens)?f.allergens:[]),...x])];
};
const normalizedAllergies=()=>String(app.profile?.allergies||'').toLowerCase().split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
function allergyFlags(items){let hits=[];const cfg=normalizedAllergies();for(const it of items){const food=app.foods.find(x=>String(x.id)===String(it.id))||it;const possible=allTags(food);for(const a of cfg){const alias=/пшениц|глютен|целиак/.test(a)?'глютен':/лактоз|молок/.test(a)?'молоко':/орех/.test(a)?'орехи':/яйц/.test(a)?'яйца':a; if(possible.some(x=>x===alias||x.includes(alias)||alias.includes(x)))hits.push(food.name+' — '+a)}}return [...new Set(hits)]}
const flagMsg=items=>{const hits=allergyFlags(items);return hits.length?'<div class="banner danger"><b>⚠ Возможный аллерген!</b><div>'+hits.map(esc).join('; ')+'</div><div>Не уменьшайте порцию для «безопасности». Исключите подозрительный продукт и проверьте этикетку/рецепт. Автоматическое обнаружение аллергенов неполное.</div></div>':normalizedAllergies().length?'<div class="banner warning">Аллергены проверяются предварительно по названию и составу, если он известен. Обязательно проверяйте этикетки.</div>':''};

function adjustDraft(i,g){let item=app.mealDraft[i];if(!item)return;const grams=rnum(g);if(!Number.isFinite(grams)||grams<1||grams>3000){notify('Вес порции: от 1 до 3000 г');return}const f=app.foods.find(x=>String(x.id)===String(item.id));if(!f){notify('Исходный продукт не найден');return}Object.assign(item,{grams,carbs:f.carbs*grams/100,protein:f.protein*grams/100,fat:f.fat*grams/100,kcal:f.kcal*grams/100,fiber:Number.isFinite(Number(f.fiber))&&f.fiber!==null?Number(f.fiber)*grams/100:null});persist();render()}

function renderDiary(){const now=new Date();now.setDate(now.getDate()+app.dayOffset);const d=now.toDateString();const es=[...app.events].filter(e=>new Date(e.ts).toDateString()===d).sort((a,b)=>a.ts-b.ts);const eaten=es.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),ins=es.filter(x=>x.type==='insulin');const sum=sumMeal(eaten);let html=topHead('Дневник','Время, еда, инъекции, глюкоза и реакция')+'<div class="card"><div class="row"><button class="btn ghost" data-action="prev">‹</button><div class="strong">'+now.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+'</div><button class="btn ghost" data-action="next">›</button></div></div>'+

function storeMeal(status){if(!app.mealDraft.length){notify('Сначала добавь продукты');return}const input=document.getElementById('mealDateTime');const iso=input?.value||app.mealDraftTime;const ts=new Date(iso).getTime();if(!Number.isFinite(ts)||ts<946684800000||ts>Date.now()+7*86400000){notify('Укажите корректное время приёма пищи');return}const flags=allergyFlags(app.mealDraft);if(flags.length){notify('Сначала исключите продукты с возможным аллергеном');return}if(status==='eaten'&&ts>Date.now()+120000){notify('Для фактически съеденного укажите прошедшее время');return}const x=sumMeal(app.mealDraft);const items=app.mealDraft.map(it=>({...it}));app.mealDraftTime=iso;const e={type:'meal',name:items.map(x=>x.name).join(', ').slice(0,180),ts,items,itemsJson:JSON.stringify(items),status,grams:x.grams,carbs:x.carbs,protein:x.protein,fat:x.fat,kcal:x.kcal,carbType:app.mealCarbType||'mixed',activityLevel:app.mealActivity||'Не отмечено',note:gf011PlanNote(),fiber:gf011FiberTotal(items).unknown?null:gf011FiberTotal(items).value};if(addEvent(e)===false)return;app.mealDraft=[];app.mealDraftDemo=false;app.mealDraftTime=localIso(new Date());persist();render()}
function analyzeMeal(){if(!app.mealDraft.length){notify('Сначала добавь продукты');return}const x=sumMeal(app.mealDraft),last=getLast(),f=fresh(last);const goal=app.profile?.nutrition||{};const flags=allergyFlags(app.mealDraft);const msgs=[['Углеводы',x.carbs,' г'],['Белки',x.protein,' г'],['Жиры',x.fat,' г'],['Энергия',x.kcal,' ккал']].map(([n,v,u])=>'<div class="readout"><span>'+n+'</span><b>'+fmt(v,n==='Энергия'?0:1)+u+'</b></div>').join('');let targetText='<div class="banner warning">Дневные ориентиры питания пока не заданы. Нельзя достоверно сказать, сколько ребёнку следует съесть, только по возрасту и весу.</div>';if(Object.values(goal).some(x=>Number(x)>0)){const eatenToday=app.events.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')&&new Date(x.ts).toDateString()===new Date().toDateString()),sum=sumMeal(eatenToday);targetText='<div class="h2" style="margin-top:14px">Сравнение с заданным планом на день</div>'+[['carbs','Углеводы','г'],['protein','Белки','г'],['fat','Жиры','г'],['kcal','Энергия','ккал']].filter(x=>Number(goal[x[0]])>0).map(([k,label,unit])=>'<div class="readout"><span>'+label+' (с этим приёмом)</span><b>'+fmt(sum[k]+x[k],k==='kcal'?0:1)+' / '+fmt(goal[k],0)+' '+unit+'</b></div>').join('')+'<div class="muted">Ориентиры вручную заданы в профиле; сравнение не является индивидуальным назначением.</div>'}

function insulinModal(){const p=app.profile||{};const step=penStepFor('short');modal('<div class="row"><h2>💉 Факт инъекции</h2><button class="close" data-action="close">×</button></div><div class="banner warning">Записывай только реально введённый инсулин. Программа не назначает и не изменяет дозу.</div><div class="field"><label>Тип</label><select class="input" id="insType"><option value="short">Короткий / ультракороткий</option><option value="long">Длительного действия</option></select></div><div class="field"><label>Препарат</label><input class="input" id="insName" value="'+esc(p.shortInsulin||'')+'" placeholder="Название с упаковки"></div><div class="field"><label>Фактическая доза, ЕД (шаг '+fmt(step)+' ЕД)</label><input class="input" id="insUnits" type="number" min="'+step+'" max="100" step="'+step+'" placeholder="0,0"></div><div class="field"><label>Время фактической инъекции</label><input class="input" id="insTime" type="datetime-local" value="'+localIso(new Date())+'" /></div><button class="btn full" data-action="saveIns">✓ Сохранить факт укола</button>');document.getElementById('insType').onchange=e=>{document.getElementById('insName').value=e.target.value==='short'?(p.shortInsulin||''):(p.longInsulin||'')}}
function saveIns(){const units=rnum(document.getElementById('insUnits').value),type=document.getElementById('insType').value,insulinName=document.getElementById('insName').value.trim(),ts=new Date(document.getElementById('insTime').value).getTime(),step=penStepFor(type);if(!Number.isFinite(units)||units<=0||units>100||Math.abs(units/step-Math.round(units/step))>0.0001||!insulinName||!Number.isFinite(ts)||ts>Date.now()+120000){notify('Проверь препарат, шаг, дозу и время');return}addEvent({type:'insulin',name:'Инъекция',units,insulinName,insulinType:type,ts})}

[['profileAge','Возраст, лет',p.age,'1'],['profileWeight','Вес, кг',p.weight,'0.1'],['profileHeight','Рост, см',p.height,'0.1']].map(x=>'<div class="field"><label>'+x[1]+'</label><input class="input" id="'+x[0]+'" type="number" min="0" step="'+x[3]+'" value="'+esc(x[2]??'')+'"></div>').join('')+

function reportTotals(rows){const meals=rows.filter(e=>e.type==='meal'&&(e.status!=='planned'&&e.status!=='started')),m=sumMeal(meals),ins=rows.filter(e=>e.type==='insulin'),quick=ins.filter(x=>x.insulinType==='short').reduce((a,x)=>a+Number(x.units||0),0),long=ins.filter(x=>x.insulinType==='long').reduce((a,x)=>a+Number(x.units||0),0);return '<div class="readout"><span>Инсулин короткий / длинный</span><b>'+fmt(quick,2)+' / '+fmt(long,2)+' ЕД</b></div><div class="readout"><span>Белки / Жиры / Углеводы</span><b>'+fmt(m.protein)+' / '+fmt(m.fat)+' / '+fmt(m.carbs)+' г</b></div><div class="readout"><span>Энергия</span><b>'+fmt(m.kcal,0)+' ккал</b></div><div class="muted">Неизвестный тип инсулина не включён в суммы короткого и длинного; данные зависят от полноты дневника.</div>'}

function reportInsights(rows,period){const eaten=rows.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started'));const ins=rows.filter(x=>x.type==='insulin');const gaps=rows.filter(x=>x.type==='meal').filter(x=>!glucoseClosest(x.ts,12*60000)).length;const goals=app.profile?.nutrition||{};const sums=sumMeal(eaten);const daysWithFood=Math.max(1,new Set(eaten.map(x=>new Date(x.ts).toDateString())).size);const comps=[['carbs','углеводов','г'],['protein','белков','г'],['fat','жиров','г'],['kcal','энергии','ккал']].filter(([k])=>Number(goals[k])>0).map(([k,label,unit])=>label+' '+fmt(period==='month'?sums[k]/daysWithFood:sums[k],k==='kcal'?0:1)+' из '+fmt(goals[k],0)+' '+unit);return '<div class="banner" style="margin-top:14px"><b>Автоматическая сводка:</b> приёмов пищи '+eaten.length+', инъекций '+ins.length+', событий еды без близкого CGM '+gaps+'. '+(app.ill?'Отмечен режим болезни. ':'')+(comps.length?(period==='month'?'Среднее в дни с записями, а не за весь календарный месяц: ':'Сравнение с введённым ориентиром: ')+comps.map(esc).join('; ')+'. ': 'Ориентиры питания не заданы. ')+'Оценка достаточности питания зависит от полноты записей и индивидуального плана. По этим данным нельзя определять изменение дозы.</div>'}

/* v0.4 — коррекции с аудитом и детальные отчёты. Прототип, не калькулятор инсулина. */
const v04OldDiary=renderDiary;
renderDiary=function(){
  let h=v04OldDiary();
  h=h.replace(/<button class="del" aria-label="Удалить запись" data-action="delete" data-id="([^"]+)">✕<\/button>/g,
    '<div class="action-inline"><button class="event-edit" data-action="editEvent" data-id="$1">Изменить</button><button class="del" aria-label="Удалить запись" data-action="delete" data-id="$1">✕</button></div>');
  h=h.replace(/(<button class="event-edit" data-action="editEvent" data-id="([^"]+)">Изменить<\/button>)/g,(all,button,id)=>{
    const count=editsOf(eventById(id)||{}).length;
    return button+(count?'<button class="event-edit" data-action="historyEvent" data-id="'+id+'">История ('+count+')</button>':'');
  });
  const today=new Date();today.setDate(today.getDate()+app.dayOffset);
  const thisDay=today.toDateString(),ev=app.events.filter(e=>new Date(e.ts).toDateString()===thisDay);
  const text=dailyObservation(ev);
  return h.replace('<button class="btn secondary full" data-action="report">',text+'<button class="btn secondary full" data-action="report">');
};
function displayGlucoseNear(ts){
  const g=glucoseClosest(ts,12*60000);
  return g?fmt(g.mmol)+' '+esc(trendIcon(g.direction))+' <small>('+Math.round(Math.abs(g.ts-ts)/60000)+' мин от события)</small>':'нет близкого CGM';
}
function dailyObservation(rows){
  const taken=rows.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),shots=rows.filter(x=>x.type==='insulin'),planned=rows.filter(x=>x.type==='meal'&&x.status==='planned');
  const data=[...taken,...shots];let paired=0,post=0;
  for(const m of taken){const a=glucoseClosest(m.ts-5*60000,15*60000),b=glucoseClosest(m.ts+120*60000,25*60000);if(a&&b&&b.ts>a.ts){paired++;post+=(b.mmol-a.mmol)}}
  const sums=sumMeal(taken),goals=app.profile?.nutrition||{};
  const lines=[];
  lines.push('Записано приёмов пищи: '+taken.length+', фактических инъекций: '+shots.length+', планов без подтверждения: '+planned.length+'.');
  lines.push('БЖУ: '+fmt(sums.protein)+' / '+fmt(sums.fat)+' / '+fmt(sums.carbs)+' г; '+fmt(sums.kcal,0)+' ккал.');
  if(Number(goals.kcal)>0) lines.push('Энергия: '+fmt(sums.kcal,0)+' из заданных '+fmt(goals.kcal,0)+' ккал, только по записям.');
  if(paired>=2)lines.push('В '+paired+' приёмах пищи есть пары CGM примерно до и через 2 часа; среднее изменение '+(post>=0?'+':'')+fmt(post/paired)+' ммоль/л. Причину изменения по этим парам установить нельзя.');
  else lines.push('Недостаточно пар CGM до и через 2 часа для сравнения реакции на еду.');
  if(data.filter(x=>!glucoseClosest(x.ts,12*60000)).length)lines.push('Для части событий нет близкого по времени показания CGM.');
  if(app.ill)lines.push('Сейчас включён режим болезни. Для исторического анализа нужен отдельный учёт начала и окончания эпизода.');

function saveEditedEvent(){
  const current=eventById(app.editingEventId);if(!current)return;
  const reason=document.getElementById('editReason')?.value.trim()||'';
  if(!reason){notify('Укажи причину изменения');return}
  const ts=new Date(document.getElementById('editTime').value).getTime();
  if(!Number.isFinite(ts)||ts<946684800000){notify('Проверь дату и время');return}
  const updated={...current,ts};
  if(current.type==='insulin'){
    const units=rnum(document.getElementById('editUnits').value),step=penStepFor(document.getElementById('editInsType')?.value||current.insulinType||'short');
    const name=document.getElementById('editInsName').value.trim(),kind=document.getElementById('editInsType').value;
    if(!Number.isFinite(units)||units<=0||units>100||Math.abs(units/step-Math.round(units/step))>0.00001||!name||name.length>100){notify('Неверная доза, шаг или препарат');return}
    updated.units=units;updated.insulinName=name;updated.insulinType=kind;
  }else if(current.type==='meal'){
    updated.status=document.getElementById('editMealStatus').value;
    let its=parseItems(current.itemsJson||current.items);
    if(its.length){
      its=its.map((it,i)=>{const raw=rnum(document.querySelector('.edited-meal-grams[data-index="'+i+'"]')?.value);if(!Number.isFinite(raw)||raw<1||raw>3000)return null;
        const factor=Number(it.grams)>0?raw/Number(it.grams):NaN;if(!Number.isFinite(factor))return null;
        return {...it,grams:raw,carbs:Number(it.carbs||0)*factor,protein:Number(it.protein||0)*factor,fat:Number(it.fat||0)*factor,kcal:Number(it.kcal||0)*factor};});
      if(its.some(x=>!x)){notify('Проверь граммовки');return}
      const hits=allergyFlags(its);if(hits.length){notify('Убери продукты с возможным аллергеном');return}
      const x=sumMeal(its);
      Object.assign(updated,{items:its,itemsJson:JSON.stringify(its),grams:x.grams,carbs:x.carbs,protein:x.protein,fat:x.fat,kcal:x.kcal,name:its.map(it=>it.name).join(', ').slice(0,180)});
    }else{
      const grams=rnum(document.getElementById('editSingleGrams').value);if(!Number.isFinite(grams)||grams<=0||grams>5000||Number(current.grams)<=0){notify('Проверь граммовку');return}
      const factor=grams/Number(current.grams);updated.grams=grams;
      for(const k of ['carbs','protein','fat','kcal'])updated[k]=Number(current[k]||0)*factor;
    }
  }else{
    updated.note=document.getElementById('editNote').value.trim().slice(0,1000);
  }
  if(ts>Date.now()+(updated.type==='meal'&&updated.status==='planned'?7*86400000:600000)){
    notify('Для фактического события укажите прошедшее время');return;
  }
  const old={...current};delete old.editHistory;delete old.items;
  const log=editsOf(current);
  log.push({at:Date.now(),reason,previous:old});
  updated.editHistory=JSON.stringify(log.slice(-20));
  if(native){
    try{if(!window.GlucoBridge.updateEvent(String(current.id),JSON.stringify(updated))){notify('Не удалось обновить запись на Android');return}}
    catch(_){notify('Android-модуль редактирования недоступен');return}
  }
  const i=app.events.findIndex(x=>String(x.id)===String(current.id));
  app.events[i]=updated;
  persist();closeModal();render();notify('Исправление сохранено с историей');
}

function rescueItemsFromText(value){
  const items=[];
  for(const row of value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
    const [name,unit,raw,...extra]=row.split('|').map(s=>s.trim());
    const n=rnum(raw);
    if(extra.length||!name||name.length>80||!['г','мл'].includes(unit)||!Number.isFinite(n)||n<0||n>100||items.length>=20)throw new Error('Формат: название | г или мл | углеводы на 100 г/мл (не более 20 строк)');

  }
  return items;

  const e=eventById(id);if(!e||e.type!=='meal'||e.status!=='planned')return;
  modal('<div class="row"><h2>Начало еды</h2><button class="close" data-action="close">×</button></div><div class="banner">'+esc(e.name)+' · план '+fmt(e.grams,0)+' г. Вы подтвердите <b>начало</b>, но не то, что вся еда съедена.</div><div class="field"><label>Когда ребёнок начал есть</label><input id="actualMealTime" class="input" type="datetime-local" value="'+localIso(new Date())+'"></div><button class="btn full" data-action="confirmStartMeal" data-id="'+esc(id)+'">✓ Подтвердить начало еды</button>');
}
function saveMealUpdate(old,change,reason){
  const prev={...old};delete prev.editHistory;delete prev.items;
  const h=editsOf(old);h.push({at:Date.now(),reason,previous:prev});
  const update={...old,...change,editHistory:JSON.stringify(h.slice(-20))};
  if(native){try{if(!window.GlucoBridge.updateEvent(String(old.id),JSON.stringify(update)))return notify('Не удалось обновить запись на Android');}catch(err){return notify('Обновление записи недоступно: '+err.message)}}
  const index=app.events.findIndex(x=>String(x.id)===String(old.id));if(index<0)return;
  app.events[index]=update;persist();closeModal();render();notify('Изменение записано в историю');return true;
}
function confirmStartMeal(id){
  const old=eventById(id);if(!old||old.status!=='planned')return;
  const ts=new Date(document.getElementById('actualMealTime')?.value).getTime();
  if(!Number.isFinite(ts)||ts<946684800000||ts>Date.now()+120000)return notify('Укажите фактическое время');
  saveMealUpdate(old,{ts,status:'started'},'Подтверждено начало еды; масса пока предварительная');
}
function finishEntireMeal(id){
  const old=eventById(id);if(!old||old.status!=='started')return;
  if(!confirm('Ребёнок действительно съел всю запланированную порцию?'))return;
  saveMealUpdate(old,{status:'eaten'},'Подтверждено, что вся порция съедена');
}
function partialMeal(id){
  const meal=eventById(id);if(!meal||meal.type!=='meal'||!['started','eaten'].includes(meal.status))return;
  const items=parseItems(meal.itemsJson||meal.items),shot=linkedShotsForMeal(id).length;
  const itemRows=items.map((it,i)=>'<label class="edit-row"><span class="muted">'+esc(it.name)+'</span><input class="input v05-actual" data-index="'+i+'" type="number" min="0" max="3000" step="1" value="'+fmt(it.grams,0).replace(/\s/g,'')+'"> г</label>').join('');
  const opts=app.foods.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('');
  modal('<div class="row"><h2>Сколько съел по факту?</h2><button class="close" data-action="close">×</button></div>'+
    (shot?'<div class="banner danger">Инсулин уже введён. Если еды было меньше ожидаемого, возможна гипогликемия. Контролируйте глюкозу и действуйте по индивидуальному плану; приложение не назначает дополнительные действия.</div>':'')+
    '<div class="muted">Укажите фактическую массу каждого продукта. Можно добавить ещё один продукт, если он действительно был съеден.</div>'+itemRows+
    '<div class="h2" style="margin-top:15px">Дополнительный продукт (необязательно)</div><div class="field"><label>Выберите продукт</label><select id="extraFoodId" class="input"><option value="">Не добавлять</option>'+opts+'</select></div><div class="field"><label>Съедено дополнительно, г</label><input id="extraFoodGrams" class="input" type="number" min="1" max="3000" placeholder="0"></div>'+
    '<div class="field"><label>Комментарий</label><textarea id="actualMealComment" class="input" rows="2" placeholder="Например, оставил половину банана"></textarea></div>'+
    '<button class="btn full" data-action="saveActualMeal" data-id="'+esc(id)+'">Сохранить фактически съеденное</button>');
}
function saveActualMeal(id){
  const old=eventById(id);if(!old)return;
  const its=parseItems(old.itemsJson||old.items),updated=[];
  for(let i=0;i<its.length;i++){
    const grams=rnum(document.querySelector('.v05-actual[data-index="'+i+'"]')?.value);
    if(!Number.isFinite(grams)||grams<0||grams>3000)return notify('Проверьте фактические граммовки');
    if(grams===0)continue;
    const it=its[i],ratio=grams/Number(it.grams||0);if(!Number.isFinite(ratio))return notify('Ошибка исходной граммовки');
    updated.push({...it,grams,carbs:Number(it.carbs||0)*ratio,protein:Number(it.protein||0)*ratio,fat:Number(it.fat||0)*ratio,kcal:Number(it.kcal||0)*ratio,fiber:it.fiber!=null?Number(it.fiber)*ratio:null});
  }
  const extraId=document.getElementById('extraFoodId')?.value;
  if(extraId){const food=app.foods.find(x=>String(x.id)===extraId),grams=rnum(document.getElementById('extraFoodGrams').value);
    if(!food||!Number.isFinite(grams)||grams<=0||grams>3000)return notify('Укажите вес дополнительного продукта');
    updated.push({id:food.id,name:food.name,grams,carbs:food.carbs*grams/100,protein:food.protein*grams/100,fat:food.fat*grams/100,kcal:food.kcal*grams/100,fiber:food.fiber!=null?food.fiber*grams/100:null,source:food.source,allergens:allTags(food)});
  }
  if(allergyFlags(updated).length)return notify('Обнаружен возможный аллерген: проверьте и уберите продукт');
  const sum=sumMeal(updated),note=(document.getElementById('actualMealComment')?.value||'').trim().slice(0,500);
  if(!updated.length)return notify('Если ребёнок ничего не съел, нужна отдельная отметка о пропущенном приёме пищи. Не сохраняйте нулевую порцию как съеденную.');
  if(updated.length>40||sum.grams>5000)return notify('Слишком много продуктов/граммов');
  const planned=Number(old.grams)||0;
  if(saveMealUpdate(old,{items:updated,itemsJson:JSON.stringify(updated),name:updated.map(x=>x.name).join(', ').slice(0,180),...sum,fiber:gf011FiberTotal(updated).unknown?null:gf011FiberTotal(updated).value,status:'eaten',note:note?'Фактическая еда: '+note:(old.note||'')},'Уточнены фактически съеденные граммы и состав')&&linkedShotsForMeal(id).length&&sum.carbs<Number(old.carbs||0))alert('Записано меньше углеводов, чем планировалось, после укола. Следуйте согласованному с врачом плану на такой случай и внимательно контролируйте глюкозу.');
}
document.addEventListener('click',event=>{
  const b=event.target.closest('[data-action]');if(!b)return;
  const id=b.dataset.id;
  switch(b.dataset.action){
    case 'approvePlanMeal':approvePlanMeal();break;

    case 'finishEntireMeal':finishEntireMeal(id);break;
    case 'partialMeal':partialMeal(id);break;

  }
});

function belarusAgeRange(age,sex){

 for(const k of ['energy','protein','fat','carbs'])out[k]=[Math.min(...all.map(r=>r[k][0])),Math.max(...all.map(r=>r[k][1]))];

 if(!Number.isFinite(h)||h<=0||!['male','female'].includes(sex)||!['sedentary','low','active','very'].includes(activity))return null;

const gfEnginePrefs=()=>Object.assign({rules:true,localML:false,cloud:false},app.profile?.enginePrefs||{});
function gfSetEngine(key,on){if(!['rules','localML','cloud'].includes(key))return;
 app.profile={...app.profile,enginePrefs:{...gfEnginePrefs(),[key]:on}};
 if(!persistProfile())return;
 notify(on?'Режим включён':'Режим выключен');render();
}
function gfLatestObs(){const s=GFMedical.summary({readings:app.readings,events:app.events});return s}
function gfObservations(){const prefs=gfEnginePrefs(),s=gfLatestObs(),q=s.quality;
 const observed=(k,t)=>'<div class="readout"><span class="muted">'+k+'</span><b style="text-align:right;max-width:59%;font-size:12px">'+t+'</b></div>';
 let h='<div class="card"><div class="h2">🔬 Медицинский модуль · исследование</div><div class="muted">Сведения из дневника, не лечебный калькулятор. Коэффициенты и дозы не изменяются.</div>';
 h+=observed('Свежесть CGM',q.latest?(q.dataFresh?'Актуально':'Данные устарели'):'Нет показаний');
 h+=observed('Наблюдений по еде',s.mealEpisodes);
 h+=observed('Ночей с CGM',s.basal.nights);
 if(prefs.rules){
   h+=s.overlap.hasRecentMultiple?'<div class="banner warning">'+esc(s.overlap.explanation)+'</div>':'<div class="muted">По текущему журналу повторных коротких инъекций за 4 часа не обнаружено. Это не доказывает, что инсулин не действует.</div>';
   h+='<div class="banner">'+esc(s.basal.message)+(s.basal.unconfounded>=3?'<br>Медиана ночного изменения: '+fmt(s.basal.medianChange)+' ммоль/л; ночей: '+s.basal.unconfounded+'.':'')+'</div>';
   if(q.missing.length)h+='<div class="banner warning">Ограничения анализа: '+esc(q.missing.join('; '))+'</div>';
 }
 if(prefs.localML){
   const eaten=(app.events||[]).filter(e=>e.type==='meal'&&e.status==='eaten').sort((a,b)=>b.ts-a.ts)[0];
   if(!eaten)h+='<div class="banner">Локальный ML: пока нет подтверждённых приёмов пищи для поиска похожих эпизодов.</div>';
   else {const m=GFMedical.similarMeals({readings:app.readings,events:app.events},{carbs:eaten.carbs,fat:eaten.fat,hour:new Date(eaten.ts).getHours()});
     h+='<div class="banner"><b>Локальный ML (kNN): </b>'+esc(m.message)+(m.status==='observed'?'<br>Похожие эпизоды: '+m.similar+'; медиана изменения '+fmt(m.medianDelta)+' ммоль/л (диапазон '+fmt(m.low)+'…'+fmt(m.high)+').':'')+'</div>';
   }
 }
 if(prefs.cloud)h+='<div class="banner">Облачный Groq Cloud: доступен только тест соединения на вымышленных данных. Лечебные и детские медицинские данные наружу не передаются.</div>';
 return h+'</div>';
}

 const rows=gf010TodaysRows(),meals=rows.filter(e=>e.type==='meal');
 const eaten=meals.filter(e=>!['planned','started'].includes(e.status));
 const shots=rows.filter(e=>e.type==='insulin');
 return {eaten,started:meals.filter(e=>e.status==='started'),planned:meals.filter(e=>e.status==='planned'),
  short:shots.filter(e=>e.insulinType==='short'),long:shots.filter(e=>e.insulinType==='long'),totals:sumMeal(eaten)};

function gf011ValidMonth(month){return /^\d{4}-(0[1-9]|1[0-2])$/.test(month);}
function gf011MonthRange(month){
 if(!gf011ValidMonth(month))month=dayKey(Date.now()).slice(0,7);
 const [year,m]=month.split('-').map(Number);
 return {begin:new Date(year,m-1,1).getTime(),end:new Date(year,m,1).getTime(),days:new Date(year,m,0).getDate()};
}
function gf011EventFacts(rows){
 const eaten=rows.filter(x=>x.type==='meal'&&!['planned','started'].includes(x.status));
 const injections=rows.filter(x=>x.type==='insulin');
 return {eaten,injections,food:sumMeal(eaten),short:gf010Units(injections.filter(x=>x.insulinType==='short')),long:gf010Units(injections.filter(x=>x.insulinType==='long'))};
}
function gf011FiberTotal(items){
 let value=0,known=0,unknown=0;
 for(const item of items){
  const n=item?.fiber;
  if(n!==null&&n!==undefined&&n!==''&&Number.isFinite(Number(n))&&Number(n)>=0){value+=Number(n);known++;}
  else {unknown++;}
 }
 return {value,known,unknown};
}
function gf011FiberOfMeal(e){
 if(e.fiber!==undefined&&e.fiber!==null&&e.fiber!==''&&Number.isFinite(Number(e.fiber))){return {value:Number(e.fiber),known:1,unknown:0};}
 const parts=parseItems(e.itemsJson||e.items);
 if(parts.length){
  const resolved=parts.map(i=>{
    if(i.fiber!==null&&i.fiber!==undefined&&Number.isFinite(Number(i.fiber)))return i;
    const f=app.foods.find(f=>String(f.id)===String(i.id))||app.foods.find(f=>f.name===i.name);
    return {...i,fiber:f?.fiber!=null?Number(f.fiber)*Number(i.grams||0)/100:null};
  });
  return gf011FiberTotal(resolved);
 }
 return {value:0,known:0,unknown:1};
}
function gf011FiberSummary(meals){
 return meals.reduce((a,e)=>{let x=gf011FiberOfMeal(e);a.value+=x.value;a.known+=x.known;a.unknown+=x.unknown;return a;},{value:0,known:0,unknown:0});
}
function gf011NormRow(k){const p=app.profile||{},r=nutritionReference(),v=Number(p.nutrition?.[k]);if(Number.isFinite(v)&&v>0)return {lo:v,hi:v,label:'Указано родителем'};
 const a=r.norm?.[k];if(a&&Number.isFinite(a[0])&&Number.isFinite(a[1]))return {lo:a[0],hi:a[1],label:'Возрастной норматив (справочный)'};
 const estimated=r.amdr?.[k];if(estimated)return {lo:estimated[0],hi:estimated[1],label:'DRI (расчётный)'};
 return null;
}
function gf011FiberNorm(){
 // General dietary fiber reference: 14 g per 1000 kcal; not an individual medical target.
 const e=nutritionReference();const kcal=e.energy?.kcal||(e.norm?.energy?((e.norm.energy[0]+e.norm.energy[1])/2):null);
 return kcal?{lo:kcal/1000*14,hi:kcal/1000*14,label:'Справочно: 14 г / 1000 ккал'}:null;
}
function gf011DailySummary(rows,multiple=1){
 const s=gf011EventFacts(rows),f=gf011FiberSummary(s.eaten);
 const metrics=[['carbs','Углеводы','г'],['protein','Белки','г'],['fat','Жиры','г'],['kcal','Энергия','ккал']];
 let html='<div class="report-scroll"><table class="table-mini" style="min-width:300px"><thead><tr><th>Показатель</th><th>Фактически</th><th>Ориентир'+(multiple>1?' за период':'/сут')+'</th></tr></thead><tbody>';
 for(const [key,label,unit] of metrics){
  const n=gf011NormRow(key),exp=n&&multiple>0?(n.lo*multiple===n.hi*multiple?fmt(n.lo*multiple,key==='kcal'?0:1):fmt(n.lo*multiple,key==='kcal'?0:1)+'–'+fmt(n.hi*multiple,key==='kcal'?0:1))+' '+unit:'—';
  html+='<tr><td>'+label+'</td><td>'+fmt(s.food[key],key==='kcal'?0:1)+' '+unit+'</td><td>'+exp+'</td></tr>';
 }
 const fl=gf011FiberNorm(),fib=f.known?fmt(f.value,1)+' г'+(f.unknown?'*':''):'н/д';
 html+='<tr><td>Клетчатка</td><td>'+fib+'</td><td>'+(fl&&multiple>0?fmt(fl.lo*multiple,0)+' г':'—')+'</td></tr>';
 html+='</tbody></table></div>';
 if(f.unknown)html+='<div class="muted">* Клетчатка указана не для всех продуктов ('+f.unknown+' неполных позиций). Сумма может быть занижена.</div>';
 html+='<div class="readout"><span>НовоРапид / короткий, факт</span><b>'+fmt(s.short,2)+' ЕД</b></div><div class="readout"><span>Левемир / длинный, факт</span><b>'+fmt(s.long,2)+' ЕД</b></div>';
 return html;
}

 h+='<p><b>СДИ:</b> '+gf024Num(r.tddUnitsPerDay)+' ЕД/сут · <b>IOB:</b> '+gf024Num(r.iobUnits)+' ЕД (модельный)</p>';
 for(const f of r.comparison.fields)h+='<p><b>'+gf024Escape(f.label)+':</b> '+gf024Num(f.starter)+' по формуле; '+gf024Num(f.observed)+' по дневнику ('+gf024Escape(f.quality)+')</p>';
 if(r.warnings.length)h+='<details><summary>Источники неопределённости · '+r.warnings.length+'</summary><ul>'+r.warnings.map(w=>'<li>'+gf024Escape(w)+'</li>').join('')+'</ul></details>';
 h+='<div class="banner">Автоматические числовые назначения ребёнку по неподтверждённым коэффициентам не формируются. Тестовый калькулятор ниже демонстрирует все числа на полностью вымышленных данных.</div>';
 h+='<p><a href="care_workflow_demo_v025.html">Открыть глобальную симуляцию с числовыми примерами</a></p><button onclick="closeModal()">Закрыть</button>';modal(h);
}
</script>

<script>
/* v0.26 - keep the two medical buttons only under the graph, not buried below in tiles. */
const gf026OldHome=renderHome;
renderHome=function(){
 const wrap=document.createElement('div');wrap.innerHTML=gf026OldHome();
 const primary=wrap.querySelector('.gf012-top-actions');
 if(primary){
   primary.querySelector('[data-action=lowAction]').textContent='↓ Низкий сахар';
   primary.querySelector('[data-action=highAction]').textContent='↑ Высокий сахар';
   wrap.querySelectorAll('[data-action="lowAction"],[data-action="highAction"]').forEach(b=>{
     if(b.closest('.gf012-top-actions'))return;
     const p=b.parentElement;
     if(p?.classList.contains('grid2')&&Array.from(p.children).every(x=>x.matches('[data-action="lowAction"],[data-action="highAction"]')))p.remove();
     else b.remove();
   });
 }
 return wrap.innerHTML;
};
function gf026AuditSummary(){
 if(typeof GFCare25==='undefined')return '<div class="banner warning">Аудит дневника недоступен: модуль 0.25 не загружен.</div>';
 try {
   const r=GFCare25.assess({profile:{...(app.profile||{})},events:app.events||[],readings:app.readings||[]},Date.now());
   const f=r.comparison?.fields||[];
   const factor=f.find(x=>/ФЧИ/.test(x.label||''));
   const n=x=>Number.isFinite(Number(x))?Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2}):'—';
   return '<div class="card"><div class="h2">📋 Автоанализ из дневника · 0.26</div>'+
     '<div class="readout"><span>СДИ (записанные инъекции)</span><b>'+n(r.tddUnitsPerDay)+' ЕД/сут</b></div>'+
     '<div class="readout"><span>ФЧИ (стартовая / наблюдаемая)</span><b>'+n(factor?.starter)+' / '+n(factor?.observed)+'</b></div>'+
     '<div class="muted">Это оценки истории, а не индивидуально проверенная дозировка. При неполном дневнике вывод может быть недоступен.</div>'+
     (r.warnings?.length?'<details><summary>Ограничения данных ('+r.warnings.length+')</summary><ul>'+r.warnings.slice(0,5).map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>':'')+'</div>';
 }catch(e){return '<div class="banner warning">Автоанализ не удалось выполнить: '+esc(e.message)+'</div>'}
}
let gf026LocalLast='';let gf026ProbeStatus='';let gf026ProbeBusy=false;
function gf026LocalDiag(){
 const root=document.getElementById('gf026Diagnostics');if(!root)return;
 if(!native||!window.GlucoBridge?.localAiDiagnostics){root.textContent='Проверка движка доступна в Android APK. В браузере настоящая Qwen не запускается.';return}
 try{
   const d=JSON.parse(window.GlucoBridge.localAiDiagnostics());
   const rows=[['Нативная библиотека llama.cpp',d.nativeLoaded?'Загружена':'НЕТ: '+(d.nativeError||'ошибка')],
      ['Архитектура',d.supportedAbi||'неизвестно'],['Файл модели',d.modelPresent?String(d.modelSizeMb)+' МБ':'не найден'],
      ['Заголовок GGUF',d.ggufHeader?'Верный':'не определён'],
      ['Можно запустить самотест',d.readyForProbe?'Да':'Нет'],
      ['Реальный ответ Qwen проверен',d.inferenceVerified?'Да':'Нет']];
   root.textContent=rows.map(([a,b])=>a+': '+b).join('\n')+'\nПроверка файла ≠ успешная генерация. Используй кнопку самотеста.';
 }catch(e){root.textContent='Ошибка диагностики: '+e.message}
}
function gf026RunSelfTest(){
 const root=document.getElementById('gf026ProbeResult');if(!root)return;
 if(gf026ProbeBusy){root.textContent='Самотест уже выполняется, повторный запуск не требуется.';return}
 if(!native||!window.GlucoBridge?.runLocalSelfTest){root.textContent='Нужен APK с нативным llama.cpp и импортированная GGUF.';return}
 gf026ProbeBusy=true;gf026ProbeStatus='Проверка запуска модели…';root.textContent=gf026ProbeStatus;
 try{window.GlucoBridge.runLocalSelfTest()}catch(e){gf026ProbeBusy=false;gf026ProbeStatus='Ошибка вызова: '+e.message;root.textContent=gf026ProbeStatus}
}
window.gf026SelfTestResult=function(message){gf026ProbeBusy=false;gf026ProbeStatus=String(message).slice(0,800);const el=document.getElementById('gf026ProbeResult');if(el)el.textContent=gf026ProbeStatus;gf026LocalDiag()};
function gf026LocalPanel(){
 return '<div class="gf026-local-check"><div class="h2">Диагностика локальной Qwen · 0.26</div><div class="muted">Проверяем движок, GGUF и настоящий ответ без медицинских данных.</div>'+
 '<button class="btn ghost full" data-action="gf026Diag">Проверить движок и модель</button>'+
 '<div class="gf026-result muted" id="gf026Diagnostics">Нажми «Проверить движок и модель».</div>'+
 '<button class="btn secondary full" data-action="gf026Probe">Запустить реальный самотест Qwen</button>'+
 '<div class="gf026-result muted" id="gf026ProbeResult">'+esc(gf026ProbeStatus||'Ожидание')+'</div>'+
 '<div class="gf026-result muted">Последний ответ Qwen: '+esc(gf026LocalLast||'Пока не получен')+'</div></div>';
}
// Attach diagnostic controls to existing settings, without replacing settings data handling.
const gf026OldLocalSettings=gfLocalAiSettings;
gfLocalAiSettings=function(){return gf026OldLocalSettings()+gf026LocalPanel()};
// Persist the result when the modal is closed/reopened; original callbacks remain intact.
const gf026PreviousLocalResult=window.gfLocalAiResult;
window.gfLocalAiResult=function(message){gf026LocalLast=String(message).slice(0,7500);gf026PreviousLocalResult?.(message)};
document.addEventListener('click',e=>{const a=e.target.closest?.('[data-action]')?.dataset.action;if(a==='gf026Diag')gf026LocalDiag();if(a==='gf026Probe')gf026RunSelfTest();});
// No fixed buttons are allowed over the bottom navigation.
const gf026OldSettings=renderSettings;
renderSettings=function(){return gf026OldSettings()+'<div class="card"><div class="h2">🧪 Проверка модулей</div>'+
 '<button class="btn ghost full" type="button" onclick="gf024ShowAuto()" style="margin-top:9px">Автоанализ · 5 дней</button>'+
 '<button class="btn ghost full" type="button" onclick="gf025Show()" style="margin-top:9px">Аудит коэффициентов · 0.25</button>'+
 '<a class="linkbtn" style="display:block;margin-top:13px" href="plan_calculator_demo_v023.html">Калькулятор · тестовые данные</a></div>';};
// Refresh initial home after addon scripts and the last renderHome wrapper load.
setTimeout(()=>{if(typeof render==='function'&&app?.tab)render()},0);
</script>
