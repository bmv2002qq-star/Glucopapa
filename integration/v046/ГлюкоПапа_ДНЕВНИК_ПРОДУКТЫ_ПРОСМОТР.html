gin-bottom:15px}\n.hero-head .logo{margin:0}\n.hero-head .sub{margin:4px 0 0}\n.small-status{font-size:11px;color:#177b70;font-weight:760;padding:7px 10px;border-radius:30px;background:#e8f7f3}\n.v5-main-title{font-size:17px;font-weight:830;margin:0}\n.v5-reading-line{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:8px}\n.v5-reading-value{font-weight:870;letter-spacing:-2.2px;font-size:54px;line-height:1;color:#153a48}\n.v5-reading-unit{font-size:13px;color:#748b91;margin-left:4px;font-weight:650}\n.v5-reading-trend{color:#b17a38;font-weight:800;font-size:19px;margin-left:4px}\n.v5-reading-sub{color:#66858c;font-size:12px;margin-top:8px}\n.v5-chart{display:block;width:100%;height:auto;background:#fbfdfc;border:1px solid #edf2f2;border-radius:14px;margin-top:14px}\n.v5-chart-actions{margin-top:14px}\n.v5-chart-controls{display:flex;gap:6px;margin:9px 0 0;align-items:center;justify-content:space-between}\n.v5-range-btn{background:transparent;border:1px solid #d5e6e6;padding:5px 10px;border-radius:9px;font-weight:700;color:#54777c;font-size:11px}\n.v5-range-btn.active{background:#dcf3ee;border-color:#8ed4c6;color:#0a766c}\n.v5-chart-key{display:flex;flex-wrap:wrap;gap:6px 13px;color:#7b939a;font-size:10px;margin-top:9px}\n.v5-chart-key span::before{content:'•';margin-right:4px;color:#15968f}\n.v5-chart-key .ill::before{color:#e5a461}\n.basal-quick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:13px 15px;background:#e4f4f0;color:#0b766d;border:1px solid #b7dfd7;border-radius:13px;text-align:left;cursor:pointer}\n.basal-quick strong{font-size:14px}.basal-quick small{display:block;color:#67948d;font-size:11px;font-weight:550}\n.illness-card{border:1px solid #f5cfae;background:#fff6ef;position:relative}\n.illness-card .topline{align-items:center}\n.illness-card .ill-desc{color:#8c694d;font-size:11px;margin-top:2px}\n.illness-card input:not([type=checkbox]){padding:10px;border-radius:11px;border:1px solid #edcead;background:white;color:#233d46;width:100%;font-weight:700;font-size:15px}\n.v5-switch{position:relative;display:inline-block;width:50px;height:29px;cursor:pointer}\n.v5-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}\n.v5-switch .track{display:block;background:#cdd6d8;height:28px;border-radius:20px;transition:.2s}\n.v5-switch .track:after{content:'';display:block;position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}\n.v5-switch input:checked+.track{background:#12958d}.v5-switch input:checked+.track:after{left:25px}\n.ill-active-info{background:#fff; border:1px solid #f7e1cb;border-radius:12px;padding:11px;color:#895d36;font-size:11px;margin:12px 0}\n.ill-active-info strong{font-size:12px;color:#745032}\n.ill-editor{display:grid;grid-template-columns:1fr auto;align-items:end;gap:9px;margin-top:13px}\n.ill-editor label{display:block;color:#956b4f;font-size:11px;font-weight:740;margin-bottom:5px}\n.v5-button{border:0;border-radius:11px;background:#0f8880;color:white;min-height:40px;padding:9px 14px;font-size:12px;font-weight:770}\n.v5-button.outline{color:#986030;background:#fff;border:1px solid #e9c5a3}\n.v5-button.secondary{background:#e7f4f1;color:#116e68}\n.v5-ill-btns{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}\n.ill-health{font-size:11px;color:#95785e;line-height:1.5;margin-top:10px}\n.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}\n.today-grid div{border:1px solid #e0eaea;background:#fbfdfd;padding:11px;border-radius:12px}\n.today-grid b{font-size:16px;display:block}.today-grid small{font-size:10px;color:#778e93}\n.v5-cardtitle{font-size:15px;font-weight:780;color:#213d48}\n.v5-diary-controls{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}\n.v5-day-filter{border:1px solid #dae6e6;background:#fff;padding:8px 11px;font-weight:740;color:#66858a;border-radius:10px;font-size:11px}\n.v5-day-filter.active{background:#d8f0e9;color:#0d7770;border-color:#b6e2d7}\n.v5-diaries-date{font-size:13px;font-weight:800;margin:13px 0 6px;display:flex;justify-content:space-between}\n.v5-diaries-date span{font-size:10px;color:#779093;font-weight:650}\n.v5-event{padding:10px 10px;border:1px solid #e1ebeb;border-radius:12px;margin:6px 0;background:#fff}\n.v5-event.active-ill{border-left:4px solid #e1a15a;background:#fff5e9}\n.v5-event.planned{border-style:dashed;background:#f8fbfb}\n.v5-event-title{display:flex;gap:7px;align-items:flex-start;justify-content:space-between;color:#173e49;font-size:12px;font-weight:740}\n.v5-event-title time{font-size:11px;color:#7b9298;white-space:nowrap}\n.v5-event-note{color:#7e9397;font-size:10px;margin-top:4px;line-height:1.55}\n.v5-event-tag{display:inline-block;background:#fae8d4;color:#9b683b;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:740}\n.v5-prototype-note{margin:12px 0;color:#7d9197;font-size:10px;line-height:1.5}\n.v5-notice{background:#f0f7f6;color:#577e82;font-size:11px;border-radius:11px;padding:10px 12px;margin:12px 0;line-height:1.5}\n.v5-notice.warn{background:#fff5e7;color:#88643f}\n.v5-basal-card{padding:13px 12px;border:1px solid #dbe8e7;background:#f9fdfc;border-radius:14px;margin:12px 0}\n.v5-basal-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}\n.v5-basal-top strong{font-size:15px}\n.v5-basal-badge{font-size:10px;background:#e5f4f1;color:#177b71;padding:4px 7px;border-radius:9px}\n.v5-formline{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.v5-formline label{display:block;color:#668189;font-size:11px;margin-bottom:4px;font-weight:730}\n.v5-formline input{padding:9px 11px;min-width:0;width:100%;border:1px solid #cfdfe0;background:white;border-radius:9px;font-size:15px}\n.v5-basal-buttons{display:grid;gap:8px;margin-top:12px}\n.v5-full{width:100%}\n.v5-override{border-top:1px solid #dae7e6;margin-top:11px;padding-top:10px}\n.v5-override-toggle{background:none;border:0;color:#177b74;font-size:12px;font-weight:760;padding:3px 0;cursor:pointer}\n.v5-basal-schedule-note{font-size:10px;color:#788e94;margin-top:8px;line-height:1.55}\n.v5-ill-k{font-weight:760;color:#a25d30}\n#basalPane{min-height:10px}\n.v5-legend{padding:11px;border-radius:12px;background:#f5faf9;font-size:11px;color:#667f85;line-height:1.6;margin-top:8px}\n@media(max-width:370px){.v5-reading-value{font-size:46px}.v5-chart-controls{gap:3px}.v5-range-btn{padding:5px 7px}}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<div class=\"demo-top\">ГЛЮКОПАПА · ВЕРСИЯ 5 · ДЕМОНСТРАЦИЯ, НЕ ЛЕЧЕБНЫЙ КАЛЬКУЛЯТОР</div>\n<main class=\"page\" id=\"page\">\n<div id=\"homeView\">\n<div class=\"hero-head\"><div><div class=\"logo\">Глюко<span>папа</span></div><p class=\"sub\">Семейный дневник диабета · демонстрация</p></div><span class=\"small-status\">● Локально</span></div>\n<div class=\"card\">\n<div class=\"topline\"><h2 class=\"v5-main-title\">Глюкоза сейчас</h2><span class=\"pill\">● CGM · вымышлено</span></div>\n<div class=\"v5-reading-line\"><div><span class=\"v5-reading-value\">7,1</span><span class=\"v5-reading-unit\">ммоль/л</span><span class=\"v5-reading-trend\">↗</span></div><span class=\"tag\">+0,02 ммоль/л/мин</span></div>\n<div class=\"v5-reading-sub\">Пример xDrip+ Follower · <span id=\"v5CurrentClock\">текущие дата и время</span> · последнее значение 1 мин назад</div>\n<div id=\"v5ChartWrap\"><svg aria-label=\"Трёхдневный демонстрационный график CGM\" class=\"v5-chart\" id=\"v5CgmChart\" role=\"img\" viewbox=\"0 0 760 242\"></svg></div>\n<div class=\"v5-chart-controls\" id=\"chartDays\"><button class=\"v5-range-btn\" data-range=\"0\">9 ноя</button><button class=\"v5-range-btn\" data-range=\"1\">10 ноя</button><button class=\"v5-range-btn\" data-range=\"2\">11 ноя</button><button class=\"v5-range-btn active\" data-range=\"all\">3 суток</button></div>\n<div class=\"v5-chart-key\"><span>Глюкоза · 15 мин</span><span>Завтрак / обед / ужин</span><span class=\"ill\">Период болезни</span></div>\n<div class=\"action-grid v5-chart-actions\"><button class=\"action\" id=\"openLow\">↓ Низкий сахар</button><button class=\"action high\" id=\"openHigh\">↑ Высокий сахар</button></div>\n<button class=\"basal-quick\" id=\"openBasal\"><div><strong>💉 Ввести длинный инсулин</strong><small>Утро 08:00 · вечер 20:00 · время подставляется из расписания</small></div><strong>Открыть ›</strong></button>\n<p class=\"v5-prototype-note\">Плановые инъекции не считаются введёнными без нажатия «Сделал укол».</p>\n</div>\n<div class=\"card illness-card\" id=\"illnessCard\">\n<div class=\"topline\"><div><strong>🤒 Болеет</strong><div class=\"ill-desc\">Отметить начало, поправочный коэффициент и завершение</div></div><label aria-label=\"Режим болезни\" class=\"v5-switch\"><input checked=\"\" id=\"illToggle\" type=\"checkbox\"/><span class=\"track\"></span></label></div>\n<div id=\"illContent\"></div>\n</div>\n<div class=\"card\"><div class=\"topline\"><b class=\"v5-cardtitle\">🍽 Питание и инъекции · 3 дня</b><button class=\"tiny-button\" id=\"goDiary\">Дневник ›</button></div><div class=\"v5-reading-sub\">Завтраки, обеды, ужины, подколки и длинный инсулин — тестовая история 9–11 ноября</div><div class=\"today-grid\"><div><small>Записано приёмов пищи</small><b>9</b></div><div><small>Коротких инъекций</small><b>10</b></div><div><small>Длинных инъекций</small><b>6</b></div><div><small>Период болезни</small><b id=\"illMiniStat\">с 10 ноября</b></div></div><div class=\"v5-notice\">График и дневник синтетические. Изменения в этом макете не переходят в установленное приложение.</div><button class=\"tiny-button\" id=\"openLegend\">Легенда и обозначения</button></div>\n</div>\n<div hidden=\"\" id=\"diaryView\">\n<div class=\"secondary-header\"><div><div class=\"logo\">Дневник<span style=\"color:var(--teal)\"> · 3 дня</span></div><p class=\"sub\">Вымышленные значения, события и расчёты</p></div><button class=\"tiny-button\" id=\"clearDiary\">Сбросить тестовые записи</button></div>\n<div class=\"card\"><div class=\"v5-diary-controls\" id=\"diaryFilters\"><button class=\"v5-day-filter active\" data-day=\"all\">Все дни</button><button class=\"v5-day-filter\" data-day=\"9\">9 ноя</button><button class=\"v5-day-filter\" data-day=\"10\">10 ноя</button><button class=\"v5-day-filter\" data-day=\"11\">11 ноя</button><button class=\"v5-day-filter\" data-day=\"today\">Сегодня</button></div><div id=\"eventList\"></div></div>\n<div class=\"v5-legend\">🟠 Светлая оранжевая полоса обозначает период болезни; пунктирная карточка — запланированная инъекция, ещё не подтверждённая фактически.</div>\n<div class=\"printnote\">Всё сохраняется только до закрытия/перезагрузки этой демонстрации. Не используется для лечения.</div>\n</div>\n</main>\n<nav aria-label=\"Навигация макета\" class=\"nav\"><button class=\"active\" id=\"navHome\"><span>⌂</span>Главная</button><button id=\"navDiary\"><span>▤</span>Дневник <small id=\"diaryCount\"></small></button><button id=\"navLow\"><span>↓</span>Низкий</button><button id=\"navHigh\"><span>↑</span>Высокий</button><button id=\"navLegend\"><span>ⓘ</span>Легенда</button></nav>\n</div>\n<div class=\"overlay\" id=\"overlay\"><section aria-labelledby=\"sheetTitle\" aria-modal=\"true\" class=\"sheet\" id=\"sheet\" role=\"dialog\">\n<div class=\"handle\"></div><div class=\"sheet-title\"><h1 id=\"sheetTitle\"></h1><button aria-label=\"Закрыть\" class=\"close\" id=\"close\">×</button></div>\n<div class=\"banner\"><strong>ДЕМОНСТРАЦИЯ.</strong> Все значения CGM, коэффициенты, дозы и прогнозы вымышлены. Это тест взаимодействия с интерфейсом, не инструкция по лечению ребёнка.</div>\n<div hidden=\"\" id=\"lowPane\">\n<div class=\"summary\"><div class=\"data-label\">Данные в настоящий момент · демонстрация</div><div class=\"metrics\"><div><div class=\"big\">3,5<span class=\"arrow\"> ↓</span></div><div class=\"unit\">ммоль/л · снижается</div></div><div class=\"goal\"><small>Цель по плану, ммоль/л</small><input aria-label=\"Цель при низком сахаре\" id=\"lowTarget\" max=\"10\" min=\"4\" step=\"0.1\" type=\"number\" value=\"5.5\"/></div></div><div class=\"tags\"><span class=\"tag warn\">−0,05 ммоль/л/мин</span><span class=\"tag\">CGM · 1 мин назад</span></div></div>\n<div aria-label=\"Оценка действующего инсулина: демонстрация\" class=\"iob-card\">\n<div class=\"iob-top\"><strong>💉 Активный инсулин · IOB</strong><span class=\"iob-num\" id=\"lowIob\">≈ 0,3 ЕД</span></div>\n<div class=\"iob-descr\" id=\"lowIobMeta\">НовоРапид · 1,0 ЕД · 3 ч 30 мин назад</div>\n<div class=\"iob-descr\" id=\"lowIobTime\">Условное оставшееся окно действия: ≈ 1 ч 30 мин</div>\n<details><summary>Изменить предыдущую инъекцию для теста</summary><div class=\"iob-fields\">\n<div><label for=\"lowPrevDose\">Введено ранее, ЕД</label><input id=\"lowPrevDose\" inputmode=\"decimal\" max=\"10\" min=\"0\" step=\"0.5\" type=\"number\" value=\"1\"/></div>\n<div><label for=\"lowPrevAge\">Прошло минут</label><input id=\"lowPrevAge\" inputmode=\"numeric\" max=\"480\" min=\"0\" step=\"15\" type=\"number\" value=\"210\"/></div>\n</div></details>\n<div class=\"iob-foot\">IOB — ориентировочный остаток действия введённого инсулина, <b>не измерение его концентрации в крови</b>. Здесь используется специально упрощённая тестовая кривая.</div>\n</div><div class=\"field\" style=\"margin-top:12px\"><label>Активность ребёнка за последние 30 минут</label><select class=\"input gf-approved-activity\"><option value=\"none\">Не указана</option><option value=\"low\">Низкая</option><option value=\"medium\">Средняя</option><option value=\"high\">Высокая</option></select><div class=\"smallhint\">Активность отмечается в дневнике и учитывается при оценке неопределённости. Её влияние нельзя надёжно перевести в ммоль/л без проверенной индивидуальной модели.</div></div>\n<div class=\"field\"><label for=\"product\">Какой продукт хотите дать?</label><select id=\"product\"><option value=\"marshmallow\">Зефир</option><option selected=\"\" value=\"juice\">Сок</option><option value=\"crisp\">Хлебец</option><option value=\"candy\">Конфета</option><option value=\"apple\">Яблоко</option><option value=\"pear\">Груша</option></select><p class=\"smallhint\" id=\"foodLabel\">Яблочный сок · условный состав: 10 г углеводов на 100 мл</p></div>\n<button class=\"primary\" id=\"calcFood\">Рассчитать количество</button>\n<div class=\"field\"><label for=\"foodAmount\">Количество, которое хочу дать</label><div class=\"input-grid\"><input class=\"input\" id=\"foodAmount\" inputmode=\"decimal\" max=\"500\" min=\"1\" placeholder=\"Напр. 120\" step=\"1\" type=\"number\"/><select aria-label=\"Единица измерения\" id=\"foodUnit\"><option value=\"ml\">мл</option></select></div><p class=\"smallhint\">Можно заменить количество вручную — демонстрационный прогноз обновится автоматически.</p></div>\n<div aria-live=\"polite\" class=\"result\" id=\"lowResult\"><div class=\"result-kicker\">УСЛОВНЫЙ РАСЧЁТ · НЕ ПРОГНОЗ ДЛЯ РЕБЁНКА</div><div class=\"result-number\" id=\"lowExpected\">—</div><div class=\"result-note\" id=\"lowRange\"></div><div class=\"result-row\"><span>Выбранный продукт</span><strong id=\"lowProductResult\">—</strong></div><div class=\"result-row\"><span>Углеводы по примеру этикетки</span><strong id=\"lowCarbs\">—</strong></div><div class=\"recommend\"><b>Краткое пояснение</b><span id=\"lowAdvice\">—</span></div><button class=\"outline\" id=\"foodGiven\">✓ Дал еду · записать в дневник</button><div class=\"stamp\" id=\"lowSaved\" role=\"status\"></div></div>\n<div class=\"formula-box\" id=\"lowFormula\"><b>Как считается · демонстрация</b>\n<div class=\"f-row\"><b>Данные:</b> CGM 3,5 ↓, выбранный продукт, углеводы на 100 г/мл, история инъекции. Цель показана для сравнения, но в искусственном расчёте порции не используется.</div>\n<div class=\"f-row\"><b>Преобразование:</b> углеводы (г) = количество × углеводы на 100 / 100; демонстрационная порция рассчитана от условных 12 г углеводов.</div>\n<div class=\"f-row\"><b>IOB в макете:</b> прошлая доза × max(0; 1 − прошедшие минуты / 300). Это искусственная линейная кривая, не медицинский IOB.</div>\n<div class=\"f-row\"><b>Показ результата:</b> <code id=\"lowFormulaLive\">тестовая модель = 3,5 + вклад еды − влияние IOB</code>. Это не проверенный способ прогнозировать лечение.</div>\n</div>\n<div class=\"mini\" style=\"margin-top:13px\">При подтверждённой гипогликемии нельзя задерживать первую помощь ради расчёта. При нарушении сознания или глотания ничего не давать через рот — действовать по экстренному плану.</div>\n</div>\n<div hidden=\"\" id=\"highPane\">\n<div class=\"summary high\"><div class=\"data-label\">Данные в настоящий момент · демонстрация</div><div class=\"metrics\"><div><div class=\"big\">14,2<span class=\"arrow up\"> ↑</span></div><div class=\"unit\">ммоль/л · растёт</div></div><div class=\"goal\"><small>Планируемая цель, ммоль/л</small><input aria-label=\"Цель при высоком сахаре\" id=\"highTarget\" max=\"13\" min=\"4\" step=\"0.1\" type=\"number\" value=\"7.0\"/></div></div><div class=\"tags\"><span class=\"tag up\">+0,07 ммоль/л/мин</span><span class=\"tag\">CGM · 1 мин назад</span></div></div>\n<div aria-label=\"Оценка действующего инсулина: демонстрация\" class=\"iob-card\">\n<div class=\"iob-top\"><strong>💉 Активный инсулин · IOB</strong><span class=\"iob-num\" id=\"highIob\">≈ 0,3 ЕД</span></div>\n<div class=\"iob-descr\" id=\"highIobMeta\">НовоРапид · 1,0 ЕД · 3 ч 30 мин назад</div>\n<div class=\"iob-descr\" id=\"highIobTime\">Условное оставшееся окно действия: ≈ 1 ч 30 мин</div>\n<details><summary>Изменить предыдущую инъекцию для теста</summary><div class=\"iob-fields\">\n<div><label for=\"highPrevDose\">Введено ранее, ЕД</label><input id=\"highPrevDose\" inputmode=\"decimal\" max=\"10\" min=\"0\" step=\"0.5\" type=\"number\" value=\"1\"/></div>\n<div><label for=\"highPrevAge\">Прошло минут</label><input id=\"highPrevAge\" inputmode=\"numeric\" max=\"480\" min=\"0\" step=\"15\" type=\"number\" value=\"210\"/></div>\n</div></details>\n<div class=\"iob-foot\">IOB — ориентировочный остаток действия введённого инсулина, <b>не измерение его концентрации в крови</b>. Здесь используется специально упрощённая тестовая кривая.</div>\n</div><div class=\"field\" style=\"margin-top:12px\"><label>Активность ребёнка за последние 30 минут</label><select class=\"input gf-approved-activity\"><option value=\"none\">Не указана</option><option value=\"low\">Низкая</option><option value=\"medium\">Средняя</option><option value=\"high\">Высокая</option></select><div class=\"smallhint\">Активность отмечается в дневнике и учитывается при оценке неопределённости. Её влияние нельзя надёжно перевести в ммоль/л без проверенной индивидуальной модели.</div></div>\n<div class=\"v5-notice warn\" id=\"sickFactorHigh\"></div><div class=\"field\"><label>Расчёт дозы по планируемой цели</label><p class=\"smallhint\" style=\"margin-top:0\">Вымышленный пример: ФЧИ 4,0 ммоль/л/ЕД; текущий IOB берётся из блока выше; шаг 0,5 ЕД.</p></div>\n<button class=\"primary amber\" id=\"calcDose\">Рассчитать условную дозу</button>\n<div aria-live=\"polite\" class=\"result orange\" id=\"highSuggested\"><div class=\"result-kicker\">ПРИМЕР АРИФМЕТИКИ, НЕ НАЗНАЧЕНИЕ</div><div class=\"result-number\" id=\"suggestedDose\">—</div><div class=\"result-note\" id=\"highExplain\">—</div></div>\n<div class=\"field\"><label for=\"doseAmount\">Или введи свою дозу</label><div class=\"input-grid\"><input class=\"input\" id=\"doseAmount\" inputmode=\"decimal\" max=\"20\" min=\"0\" placeholder=\"Напр. 1,5\" step=\"0.5\" type=\"number\"/><select aria-label=\"Единицы инсулина\" id=\"doseUnit\"><option>ЕД</option></select></div><p class=\"smallhint\">Измени дозу — пример результата обновится <b>автоматически</b>. Запись в дневник сохраняет именно введённую дозу.</p></div>\n<div aria-live=\"polite\" class=\"result orange\" id=\"highResult\"><div class=\"result-kicker\">МОЯ ДОЗА · АВТОПЕРЕСЧЁТ · ИСКУССТВЕННЫЕ ДАННЫЕ</div><div class=\"result-number\" id=\"highExpected\">—</div><div class=\"result-note\" id=\"highRange\"></div><div class=\"result-row\"><span>Планируемый ввод</span><strong id=\"highAmountResult\">—</strong></div><div class=\"inline-note\">Предполагаемая глюкоза показана только для тестирования интерфейса. В настоящем приложении точный результат не может быть гарантирован.</div><div class=\"field\" style=\"margin-top:13px\"><label>Место фактического укола</label><select class=\"input\" id=\"gfApprovedSite\"><option>Живот</option><option>Плечо</option><option>Бедро</option><option>Ягодица</option></select></div><button class=\"outline amber\" id=\"shotGiven\">✓ Сделал укол · записать в дневник</button><div class=\"stamp\" id=\"highSaved\" role=\"status\"></div></div>\n<div class=\"formula-box\" id=\"highFormula\"><b>Как считается · демонстрация</b>\n<div class=\"f-row\"><b>Данные:</b> CGM 14,2 ↑, цель, тестовая ФЧИ 4,0 ммоль/л/ЕД, активный инсулин (IOB), введённая доза и шаг 0,5 ЕД.</div>\n<div class=\"f-row\"><b>IOB в макете:</b> прошлая доза × max(0; 1 − прошедшие минуты / 300). Это искусственная линейная кривая, не медицинский IOB.</div>\n<div class=\"f-row\"><b>Условная коррекция:</b> <code>(CGM − цель) ÷ ФЧИ − IOB</code> с округлением вниз по шагу — только проверка вида интерфейса.</div>\n<div class=\"f-row\"><b>Условный прогноз:</b> <code id=\"highFormulaLive\">CGM − (своя доза + IOB) × ФЧИ</code>. Не учитывает время действия, питание и изменение чувствительности.</div>\n</div>\n<div class=\"mini\" style=\"margin-top:13px\">При болезни, кетонах, недавнем болюсе или признаках кетоацидоза требуется действующий индивидуальный план. Макет не предназначен для выбора реальной дозы.</div>\n</div>\n<div hidden=\"\" id=\"basalPane\">\n<div class=\"v5-notice\">Временное расписание автоматически подставляется в план. <b>Запись «Сделал укол»</b> подтверждает фактическое введение. Данные вымышленные.</div>\n<div class=\"topline\"><strong>Сейчас в демонстрации</strong><span class=\"pill\" id=\"basalTodayClock\">Сегодня · текущее время</span></div>\n<div id=\"basalRows\"></div>\n<div class=\"v5-legend\">При «Изменить время на сегодня» меняется сегодняшнее плановое время и заменяется старая плановая запись. Постоянное расписание не меняется. Факт инъекции появится только после подтверждения и будет записан с указанным фактическим временем.</div>\n</div>\n<div hidden=\"\" id=\"legendPane\"><div class=\"card\"><h3>Легенда и сценарии проверки</h3><div class=\"legend-grid\"><strong>↓ / ↑</strong><span>Направление условного тренда CGM</span><strong>Цель</strong><span>Выбранное значение глюкозы для отображения</span><strong>Расчёт</strong><span>Условный пример из вымышленной модели, не медицинский результат</span><strong>Своя доза</strong><span>Измени ЕД и увидишь новый условный результат без дополнительной кнопки</span><strong>✓ Записать</strong><span>Добавляет тестовую запись только в дневник этого HTML</span><strong>IOB</strong><span>Остаточная активность от предыдущей инъекции (не концентрация инсулина в крови). В макете — синтетическое число.</span><strong>Формулы</strong><span>Под результатом: какие данные использованы и упрощённая демонстрационная арифметика.</span><strong>Диапазон</strong><span>Иллюстрация неопределённости; не клинически валидированный интервал</span></div></div><div class=\"card\"><h3>Порядок тестирования</h3><p class=\"little\">1. Открой «Низкий», выбери яблоко, рассчитай количество и затем измени граммы. Посмотри пояснение о медленном действии. Нажми «Дал еду».</p><p class=\"little\">2. Открой «Высокий», нажми «Рассчитать условную дозу», затем введи своё количество и проверь автоматическое изменение тестового результата; можно изменить прошлую дозу и время для демонстрации IOB. Нажми «Сделал укол».</p><p class=\"little\">3. Открой «Дневник»: обе записи должны находиться там с фактическим временем.</p></div><div class=\"mini\">Все параметры этого макета вымышлены. Он не получает данные xDrip+, не запускает Qwen и не изменяет основное приложение.</div></div>\n<details class=\"extra\"><summary>Дополнительная информация о демонстрации</summary><p>Для согласования интерфейса используется специально упрощённая математическая имитация. Она не учитывает индивидуальную фармакодинамику, реальный IOB, скорость усвоения, проверку сенсора, кетоны и множество других факторов. Ни дозы, ни расчёт конечной глюкозы не должны переноситься в лечение.</p></details>\n</section></div>\n<script>\n(()=>{'use strict';\nconst $=id=>document.getElementById(id),fmt=(n,d=1)=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst foods={\n marshmallow:{name:'Зефир',carbs:78,unit:'г',factor:0.72,info:'Зефир · условный состав: 78 г углеводов на 100 г',advice:'Состав и скорость действия зефира различаются. При срочной помощи приоритет имеют быстрые углеводы по индивидуальному плану.'},\n juice:{name:'Яблочный сок',carbs:10,unit:'мл',factor:1,info:'Яблочный сок · условный состав: 10 г углеводов на 100 мл',advice:'Сок без мякоти обычно действует быстрее цельного яблока. В реальности важно содержание быстрых углеводов на упаковке.'},\n crisp:{name:'Хлебец',carbs:68,unit:'г',factor:0.36,info:'Хлебец · условный состав: 68 г углеводов на 100 г',advice:'Хлебец может действовать медленнее быстрых углеводов и не является основным вариантом срочного устранения гипогликемии.'},\n candy:{name:'Конфета',carbs:75,unit:'г',factor:0.77,info:'Конфета · условный состав: 75 г углеводов на 100 г',advice:'Конфеты бывают разными: шоколадные и жирные варианты могут действовать медленнее. Состав нужно уточнять.'},\n apple:{name:'Яблоко',carbs:11,unit:'г',factor:0.34,info:'Яблоко · условный состав: 11 г углеводов на 100 г',advice:'Цельное яблоко с клетчаткой может повышать сахар медленно. Для быстрой помощи предпочтительнее источник быстрых углеводов из утверждённого плана, например сок с известным составом.'},\n pear:{name:'Груша',carbs:10,unit:'г',factor:0.30,info:'Груша · условный состав: 10 г углеводов на 100 г',advice:'Цельная груша обычно не подходит для быстрого устранения гипогликемии. Скорость подъёма глюкозы предсказать нельзя.'}\n};\nlet events=seedEvents(),screen='home',currentSheet='',lastFocus=null, lastLowSave='',lastHighSave='';\nconst mockIob={units:1,ageMinutes:210,durationMinutes:300}; // DEMO ONLY: simplistic linear decay. Not clinical IOB.\nfunction demoIob(){return Math.max(0, mockIob.units)*(Math.max(0,1-mockIob.ageMinutes/mockIob.durationMinutes))}\nfunction syncIob(){const remain=Math.max(0,mockIob.durationMinutes-mockIob.ageMinutes);const howLong=remain?`${Math.floor(remain/60)} ч ${remain%60} мин`:'завершено';for(const side of ['low','high']){ $(side+'Iob').textContent='≈ '+fmt(demoIob())+' ЕД';$(side+'IobMeta').textContent='НовоРапид · '+fmt(mockIob.units)+' ЕД · '+Math.floor(mockIob.ageMinutes/60)+' ч '+mockIob.ageMinutes%60+' мин назад';$(side+'IobTime').textContent='Условное окно действия: '+howLong;$(side+'PrevDose').value=String(mockIob.units);$(side+'PrevAge').value=String(mockIob.ageMinutes)}}\nfunction updateIobFrom(side){const u=Number($(side+'PrevDose').value),minutes=Number($(side+'PrevAge').value);if(!valid(u,0,10)||!valid(minutes,0,480))return;mockIob.units=u;mockIob.ageMinutes=minutes;syncIob();lowPreview();highPreview();refreshSuggested()}\nfunction setView(name){screen=name;$('homeView').hidden=name!=='home';$('diaryView').hidden=name!=='diary';$('navHome').classList.toggle('active',name==='home');$('navDiary').classList.toggle('active',name==='diary');if(name==='diary')renderDiary();$('page').scrollTop=0;}\nfunction openSheet(kind){lastFocus=document.activeElement;currentSheet=kind;const names={low:'↓ Действия при низком сахаре',high:'↑ Действия при высоком сахаре',legend:'ⓘ Легенда макета',basal:'💉 Длинный инсулин · расписание'};$('sheetTitle').textContent=names[kind];for(const p of ['low','high','legend','basal'])$(p+'Pane').hidden=p!==kind;$('overlay').classList.add('open');$('sheet').scrollTop=0;document.body.style.overflow='hidden';$('close').focus();}\nfunction closeSheet(){$('overlay').classList.remove('open');currentSheet='';document.body.style.overflow='';lastFocus?.focus?.()}\nfunction resetStamp(id){$(id).classList.remove('show');if(id==='lowSaved')$('foodGiven').disabled=false;if(id==='highSaved')$('shotGiven').disabled=false}\nfunction valid(n,min,max){return Number.isFinite(n)&&n>=min&&n<=max}\nfunction showInvalid(id,message){$(id).textContent=message;$(id).classList.add('show')}\nfunction setFoodLabel(){const p=foods[$('product').value];$('foodLabel').textContent=p.info;$('foodUnit').innerHTML='<option>'+p.unit+'</option>';resetStamp('lowSaved');$('lowResult').classList.remove('visible');$('foodAmount').value=''}\nfunction lowPreview(){const p=foods[$('product').value],a=Number($('foodAmount').value),target=Number($('lowTarget').value);resetStamp('lowSaved');if(!valid(target,4,10)||!valid(a,1,500)){ $('lowResult').classList.remove('visible');return false}\n const carbs=a*p.carbs/100;\n // PURELY FICTIONAL: a visual formula for input-response interaction testing.\n const predicted=3.5+0.15*carbs*p.factor-0.4*demoIob();\n const floor=Math.max(2.9,predicted-1.1),ceil=predicted+1.4;\n $('lowExpected').textContent='≈ '+fmt(predicted)+' ммоль/л';\n $('lowRange').textContent='Синтетический сценарий через 30 мин · условный диапазон '+fmt(floor)+'–'+fmt(ceil)+' ммоль/л · цель '+fmt(target);\n $('lowProductResult').textContent=fmt(a,a%1?1:0)+' '+p.unit+' · '+p.name;\n $('lowCarbs').textContent=fmt(carbs)+' г';$('lowAdvice').textContent=p.advice;\n $('lowFormulaLive').textContent='3,5 + 0,15 × '+fmt(carbs)+' г × условный фактор '+fmt(p.factor,2)+' − 0,4 × '+fmt(demoIob())+' ЕД IOB = '+fmt(predicted)+' ммоль/л';\n $('lowResult').classList.add('visible');return true;\n}\nfunction calcFood(){const target=Number($('lowTarget').value);if(!valid(target,4,10)){showInvalid('lowSaved','Укажи цель от 4 до 10 ммоль/л для демонстрации.');return}const p=foods[$('product').value];const testCarbs=12;let amount=testCarbs*100/p.carbs;amount=Math.round(amount*10)/10;$('foodAmount').value=Number.isInteger(amount)?String(amount):amount.toFixed(1);lowPreview();$('lowResult').scrollIntoView({behavior:'smooth',block:'nearest'})}\nfunction highPreview(){const target=Number($('highTarget').value),dose=Number($('doseAmount').value);resetStamp('highSaved');if(!valid(target,4,13)||$('doseAmount').value.trim()===''||!valid(dose,0,20)){$('highResult').classList.remove('visible');showInvalid('highSaved','Укажи дозу от 0 до 20 ЕД и цель от 4 до 13 ммоль/л для проверки макета.');return false}\n // PURELY FICTIONAL: a visual formula for UI testing, not a treatment model.\n const projected=14.2-(dose+demoIob())*(4.0/illnessFactor());\n const low=Math.max(1.5,projected-1.8),upper=Math.min(35,projected+2.1);\n $('highExpected').textContent='≈ '+fmt(Math.max(1.5,projected))+' ммоль/л';\n $('highRange').textContent='Вымышленный результат без указания времени · условный диапазон '+fmt(low)+'–'+fmt(Math.max(low+0.2,upper))+' ммоль/л · цель '+fmt(target);\n $('highAmountResult').textContent=fmt(dose)+' ЕД (условно)';$('highFormulaLive').textContent='14,2 − ('+fmt(dose)+' ЕД + IOB '+fmt(demoIob())+' ЕД) × (4,0 / K '+fmt(illnessFactor(),2)+') = '+fmt(projected)+' ммоль/л';$('highResult').classList.add('visible');return true;\n}\nfunction calcDose(){const target=Number($('highTarget').value);if(!valid(target,4,13)){showInvalid('highSaved','Укажи цель от 4 до 13 ммоль/л для демонстрации.');return}const isf=4/illnessFactor(),iob=demoIob();const raw=Math.max(0,(14.2-target)/isf-iob);const dose=Math.floor((raw+1e-9)*2)/2;$('suggestedDose').textContent=fmt(dose)+' ЕД';$('highExplain').textContent='Искусственный пример: (14,2 − '+fmt(target)+') ÷ 4,0 − IOB '+fmt(iob)+'; округление вниз до шага 0,5 ЕД.';$('highSuggested').classList.add('visible');$('doseAmount').value=fmt(dose).replace(',','.');highPreview();$('highSuggested').scrollIntoView({behavior:'smooth',block:'nearest'})}\nfunction invalidateHigh(){$('highResult').classList.remove('visible');resetStamp('highSaved');}\nfunction refreshSuggested(){if($('highSuggested').classList.contains('visible'))calcDosePreviewOnly()}\nfunction calcDosePreviewOnly(){const target=Number($('highTarget').value);if(!valid(target,4,13))return;const iob=demoIob(),raw=Math.max(0,(14.2-target)/(4/illnessFactor())-iob),rounded=Math.floor((raw+1e-9)*2)/2;$('suggestedDose').textContent=fmt(rounded)+' ЕД';$('highExplain').textContent='Вымышленный пример: (14,2 − '+fmt(target)+') ÷ 4 − IOB '+fmt(iob)+'; округление вниз до 0,5 ЕД.';}\n function addEvent(kind){const when=new Date(DEMO_NOW);if(kind==='meal'){if(!lowPreview())return;const p=foods[$('product').value],amount=Number($('foodAmount').value);const signature=JSON.stringify([p.name,amount,$('lowTarget').value]);if(signature===lastLowSave){showInvalid('lowSaved','Эта запись уже добавлена. Чтобы создать новую, сначала измени количество.');$('foodGiven').disabled=true;return}lastLowSave=signature;events.unshift({type:'meal',title:'🍎 Дал еду',when,desc:p.name+' · '+fmt(amount,amount%1?1:0)+' '+p.unit+' · по условной этикетке '+fmt(amount*p.carbs/100)+' г углеводов; цель '+fmt(Number($('lowTarget').value))+' ммоль/л'});$('lowSaved').textContent='✓ Тестовая запись добавлена в дневник';$('lowSaved').classList.add('show');$('foodGiven').disabled=true}\n else {const amount=Number($('doseAmount').value),target=Number($('highTarget').value);if(amount<=0){showInvalid('highSaved','Для проверки записи введи положительную дозу.');return}if(!$('highResult').classList.contains('visible')){showInvalid('highSaved','Сначала введи корректную дозу; пример результата появится автоматически.');return}const signature=JSON.stringify([amount,$('highTarget').value]);if(signature===lastHighSave){showInvalid('highSaved','Эта запись уже добавлена. Чтобы создать новую, сначала измени дозу.');$('shotGiven').disabled=true;return}lastHighSave=signature;events.unshift({type:'insulin',title:'💉 Сделал укол',when,desc:'НовоРапид · '+fmt(amount)+' ЕД · исходная глюкоза 14,2 ммоль/л · цель '+fmt(Number($('highTarget').value))+' ммоль/л'});$('highSaved').textContent='✓ Тестовая запись добавлена в дневник';$('highSaved').classList.add('show');$('shotGiven').disabled=true}\n $('diaryCount').textContent=events.length?String(events.length):'';\n}\nfunction renderDiary(){return renderV5Diary()}\n$('openLow').onclick=()=>openSheet('low');$('openHigh').onclick=()=>openSheet('high');$('navLow').onclick=()=>openSheet('low');$('navHigh').onclick=()=>openSheet('high');$('navLegend').onclick=()=>openSheet('legend');$('openLegend').onclick=()=>openSheet('legend');$('navHome').onclick=()=>{closeSheet();setView('home')};$('navDiary').onclick=()=>{closeSheet();setView('diary')};$('close').onclick=closeSheet;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentSheet)closeSheet()});\n$('product').onchange=setFoodLabel;$('calcFood').onclick=calcFood;$('foodAmount').oninput=lowPreview;$('lowTarget').oninput=lowPreview;$('foodGiven').onclick=()=>addEvent('meal');$('calcDose').onclick=calcDose;$('doseAmount').oninput=highPreview;$('highTarget').oninput=()=>{refreshSuggested();highPreview()};$('shotGiven').onclick=()=>addEvent('insulin');$('clearDiary').onclick=()=>{events=[];lastLowSave='';lastHighSave='';$('foodGiven').disabled=false;$('shotGiven').disabled=false;$('diaryCount').textContent='';renderDiary()};\nfor(const side of ['low','high']){for(const field of ['PrevDose','PrevAge'])$(side+field).oninput=()=>updateIobFrom(side)}syncIob();$('doseAmount').value='1.5';\n\n// ---------- Version 5: Synthetic 3-day example and illness + basal planner -----------\nconst DEMO_NOW=new Date();\nconst DEMO_TODAY=DEMO_NOW.toLocaleDateString('sv-SE');\nconst DEMO_CLOCK=DEMO_NOW.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false});\nconst demoDates=['2026-11-09','2026-11-10','2026-11-11'];\nfunction d5(d,t){return new Date(d+'T'+t+':00')}\nfunction evt5(type,date,time,title,detail,extra={}){return {type,title,when:d5(date,time),desc:detail,...extra}}\nfunction seedEvents(){\n const e=[];\n for(const [i,date] of ['2026-11-09','2026-11-10','2026-11-11'].entries()){\n  const sick=i===2;\n  e.push(evt5('basal',date,'08:0'+(i+1),'💉 Левемир · утро','6,0 ЕД · фактически введён · тестовая запись',{slot:'morning',units:6}));\n  e.push(evt5('rapid',date,'08:18','💉 НовоРапид · на завтрак',(sick?'4,0':'3,5')+' ЕД · тестовая запись',{units:sick?4:3.5}));\n  e.push(evt5('meal',date,'08:30','🍽 Завтрак','Овсянка, йогурт · '+(38+i*2)+' г углеводов · тестовая запись',{carbs:38+i*2}));\n  e.push(evt5('rapid',date,'13:12','💉 НовоРапид · на обед',(sick?'5,5':'5,0')+' ЕД · тестовая запись',{units:sick?5.5:5}));\n  e.push(evt5('meal',date,'13:25','🍽 Обед','Суп, картофель, курица · '+(53+i*2)+' г углеводов · тестовая запись',{carbs:53+i*2}));\n  e.push(evt5('rapid',date,'18:48','💉 НовоРапид · на ужин',(sick?'6,0':'5,5')+' ЕД · тестовая запись',{units:sick?6:5.5}));\n  e.push(evt5('meal',date,'19:04','🍽 Ужин','Рис с овощами · '+(60+i*2)+' г углеводов · тестовая запись',{carbs:60+i*2}));\n  e.push(evt5('basal',date,'20:0'+(i+2),'💉 Левемир · вечер','5,0 ЕД · фактически введён · тестовая запись',{slot:'evening',units:5}));\n }\n e.push(evt5('rapid','2026-11-10','17:20','💉 НовоРапид · подколка','0,5 ЕД · коррекция · демонстрационная запись',{units:0.5}));\n e.push(evt5('illness','2026-11-10','13:40','🤒 Начало болезни','Поправочный коэффициент K=1,15, введён вручную',{factor:1.15}));\n return e.sort((a,b)=>b.when-a.when);\n}\nlet v5Ill={toggle:true,active:true,start:d5('2026-11-10','13:40'),end:null,factor:1.15};\nlet v5IllHistory=[{start:d5('2026-11-10','13:40'),end:null}];\nlet v5BasalSchedule={morning:{time:'08:00',units:6},evening:{time:'20:00',units:5}};\nlet v5TodayOverride={morning:null,evening:null};\nlet v5TodayGiven={morning:false,evening:false};\nlet v5Day='all',v5Range='all';\nfunction i function openApproved(kind){
 approvedKind=kind==='high'?'high':'low';
 frame.style.display='block';document.body.style.overflow='hidden';
 if(frame.contentWindow)frame.contentWindow.postMessage({gf28:'open',kind:approvedKind,activity:lastActivity},'*');
 setTimeout(gf30SendSync,90);
}
function closeApproved(){frame.style.display='none';document.body.style.overflow='';}
window.GF28={openApproved,closeApproved,get approvedKind(){return approvedKind}};
window.addEventListener('message',e=>{
 if(e.source!==frame.contentWindow||!e.data||!e.data.gf28)return;
 if(e.data.gf28==='close'){closeApproved();return;}
 if(e.data.gf28==='activity'){lastActivity=e.data.level;return;}
 if(e.data.gf28!=='entry')return;
 const d=e.data;
 if(!window.GF27?.demoActive){closeApproved();notify('Это учебный калькулятор v5. Результаты демонстрации не записываются в настоящий медицинский дневник.');return;}
 // In the approved preview the formula is FICTIONAL; do not save the model result as a clinical prediction.
 const common={ts:Date.now(),demo:!!window.GF27?.demoActive,source:'approved-v5-demo',activity30min:d.activity,note:'Сценарий v5 · проверка интерфейса; прогноз был искусственным и не является назначением'};
 if(d.kind==='meal'){
   const foodUnit=d.unit==='мл'?'мл':'г';
   const x={...common,type:'meal',status:'eaten',name:d.name,grams:d.grams,carbs:d.carbs,protein:0,fat:0,kcal:0,nutritionIncomplete:true,carbType:'fast',mealAction:'Дал еду',items:[{name:d.name,grams:d.grams,unit:foodUnit,carbs:d.carbs}],itemsJson:JSON.stringify([{name:d.name,grams:d.grams,unit:foodUnit,carbs:d.carbs}])};
   addEvent(x);
 }else if(d.kind==='insulin'){
   const x={...common,type:'insulin',insulinType:'short',insulinName:app.profile?.shortInsulin||'НовоРапид',name:'Сделал укол · высокий сахар',units:d.units,site:d.site,doseReason:'correction',targetGlucose:d.target};
   addEvent(x);
 }
 closeApproved();

// A capture listener bypasses legacy high/low screens. The version 5 approval is not replaced by 0.26 quick actions.
document.addEventListener('click',e=>{
 const b=e.target.closest?.('[data-action]');
 if(!b)return;
 const a=b.dataset.action;
 if(a==='lowAction'||a==='highAction'){
  e.preventDefault();e.stopImmediatePropagation();openApproved(a==='lowAction'?'low':'high');return;
 }
 if(a==='gf28OpenBasal'){
  e.preventDefault();e.stopImmediatePropagation();showBasalDialog();return;
 }
 if(a==='jumpMeal'){
  e.preventDefault();e.stopImmediatePropagation();composerOpen=true;app.tab='diary';render();
  setTimeout(()=>$28('composer')?.scrollIntoView({block:'start',behavior:'smooth'}),35);return;
 }
 if(a==='gf28CloseComposer'){
  e.preventDefault();e.stopImmediatePropagation();composerOpen=false;render();return;
 }
 if(a==='gf28CopyFood'){
  e.preventDefault();e.stopImmediatePropagation();copyMealContext();return;
 }
},true);

   const parent=head.parentElement;

     const next=head.nextElementSibling;

 }
 const glucoseCard=[...node.querySelectorAll('.card')].find(x=>(x.querySelector('.h2')?.textContent||'').includes('Глюкоза сейчас'));

 }

 const plots=[];

 return '<div class="card gf30-timeline"><div class="h2">🧪 CGM и события · единый график 5 дней</div><div class="muted" style="margin:0 0 8px">Глюкоза создана математическим симулятором из той же истории еды, уколов и активности. Точки снизу — события из той же синтетической истории; коснись точки, чтобы увидеть запись.</div><div style="overflow-x:auto"><svg role="img" aria-label="CGM пять дней с отметками еды и уколов" viewBox="0 0 780 330" style="width:100%;min-width:370px;background:#f9fbfb;border-radius:12px">'+
 lines.join('')+days.join('')+'<path d="'+path+'" fill="none" stroke="#098f8b" stroke-width="2.4" stroke-linecap="round"/>'+plots.join('')+labels.join('')+'<text x="36" y="322" font-size="10" fill="#6b8790">Источник: полностью синтетическая событийная модель. Это НЕ медицинский прогноз и НЕ реальные показания ребёнка.</text></svg></div><div class="muted" style="font-size:10px">CGM: '+pts.length+' точек; еда: '+ev.filter(x=>x.type==='meal').length+'; инъекции: '+ev.filter(x=>x.type==='insulin').length+'; активность/болезнь: '+ev.filter(x=>['activity','illness'].includes(x.type)).length+'.</div></div>';
}

/* GFJournalTable v0.1.0: presentation-only adapters for legacy and V5 diaries.

(function(){
 'use strict';
 const escapeText=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const F=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toLocaleString('ru-RU',{maximumFractionDigits:d}):'—';
 const clock=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 const sign=d=>({Flat:'→',FortyFiveUp:'↗',SingleUp:'↑',DoubleUp:'⇈',FortyFiveDown:'↘',SingleDown:'↓',DoubleDown:'⇊'})[d]||'—';
 const begin='<div class="gfjt-scroll"><table class="gfjt-table"><colgroup><col class="gfjt-col-time"><col class="gfjt-col-glucose"><col></colgroup><thead><tr><th>Время</th><th>Сахар / тренд</th><th>Данные</th></tr></thead><tbody>';
 const end='</tbody></table></div>';
 const nutrient=(v,t,c='')=>'<span class="gfjt-stat '+c+'">'+t+' '+(v==null?'—':F(v,t==='Ккал'?0:1))+'</span>';

 const glucoseCell=(reading,delta)=>{
  if(!reading || !Number.isFinite(Number(reading.mmol)))return '<div class="gfjt-blank">Нет CGM</div><div class="gfjt-cgm-note">Рядом со временем записи данных нет</div>';
  const d=reading.direction||'';
  return '<div class="gfjt-glucose">'+F(reading.mmol,1)+' <span class="gfjt-arrow">'+escapeText(sign(d))+'</span></div><div class="gfjt-unit">ммоль/л</div>'+(delta!=null?'<div class="gfjt-cgm-note">Ближайшая точка · '+Math.round(delta/60000)+' мин</div>':'')+(d?'':'<div class="gfjt-cgm-note">Тренд неизвестен</div>');
 };
 function legacyBody(x){

  if(x.type==='meal'){
   let items=Array.isArray(x.items)?x.items:[];
   if(!items.length && x.itemsJson){try {const p=JSON.parse(x.itemsJson);items=Array.isArray(p)?p:[]}catch(_){}}
   body='<div class="gfjt-type">🍽 Еда</div>';
   if(items.length)body+=items.map(it=>'<div class="gfjt-foodrow"><div class="gfjt-foodname">'+escapeText(it.name||'Продукт')+' · '+F(it.grams,0)+' г</div>'+
       ((it.carbs!=null||it.protein!=null||it.fat!=null||it.kcal!=null)?'<div class="gfjt-foodmacros">У '+(it.carbs==null?'—':F(it.carbs))+' · Б '+(it.protein==null?'—':F(it.protein))+' · Ж '+(it.fat==null?'—':F(it.fat))+' г · '+(it.kcal==null?'—':F(it.kcal,0))+' ккал</div>':'')+'</div>').join('');
   else body+='<div class="gfjt-foodname">'+escapeText(x.name||'Приём пищи')+(x.grams!=null?' · '+F(x.grams,0)+' г':'')+'</div>';
   body+='<div class="gfjt-cgm-note">Итого за приём пищи:</div>'+totals(x);
   if(status==='planned')body+='<div class="gfjt-pill">Запланировано · ещё не съедено</div>';
   if(status==='started')body+='<div class="gfjt-pill">Еда начата · факт не уточнён</div>';
   if(x.activityLevel && x.activityLevel!=='Не отмечено')body+='<div class="gfjt-extra">Активность: '+escapeText(x.activityLevel)+'</div>';
  } else if(x.type==='insulin'){
   body='<div class="gfjt-type">💉 Инъекция'+(x.status==='planned'?' · план':' · факт')+'</div><div class="gfjt-ins">'+escapeText(x.insulinName||x.name||'Инсулин')+' · '+F(x.units,2)+' ЕД</div>';
   if(x.insulinType)body+='<div class="gfjt-extra">Тип: '+escapeText(x.insulinType==='long'?'длинный':x.insulinType==='short'?'короткий':x.insulinType)+'</div>';
   body+='<div class="gfjt-site">Место укола: '+(x.site?'<b>'+escapeText(x.site)+'</b>':'<span class="gfjt-blank">не указано</span>')+'</div>';
   if(x.zone)body+='<div class="gfjt-site">Зона: '+escapeText(x.zone)+'</div>';
  }else{
   body='<div class="gfjt-type">'+(x.type==='illness'?'🤒 Болезнь':x.type==='activity'?'🏃 Активность':'📝 Событие')+'</div><div>'+escapeText(x.name||x.note||'Запись')+'</div>';
  }
  if(x.note&&x.type!=='note')body+='<div class="gfjt-extra">'+escapeText(x.note)+'</div>';
  return body;
 }
 function legacyRow(x,sourceEl){
  const t=Number(x.ts),r=(typeof glucoseClosest==='function')?glucoseClosest(t,12*60000):null;
  const delta=r?Math.abs(Number(r.ts)-t):null;
  let actions='';
  if(sourceEl){
   const btns=[...sourceEl.querySelectorAll('button[data-action]')];
   const used=new Set();
   actions=btns.filter(b=>{const key=b.dataset.action+'|'+(b.dataset.id||'')+'|'+(b.dataset.index||'');if(used.has(key))return false;used.add(key);return true}).map(b=>b.outerHTML).join('');
  }
  if(actions)actions='<div class="gfjt-actions">'+actions+'</div>';
  let illness=x.type==='illness'||(typeof app!=='undefined' && (app.profile?.gf27IllnessEpisodes||[]).some(p=>t>=p.start&&(!p.end||t<=p.end)));
  return '<tr class="'+(illness?'gfjt-sick ':'')+(x.status==='planned'?'gfjt-planned':x.status==='started'?'gfjt-started':'')+'"><td><div class="gfjt-time">'+clock(t)+'</div></td><td>'+glucoseCell(r,delta)+'</td><td>'+legacyBody(x)+actions+'</td></tr>';
 }
 // Add table into the original diary view, retain all original buttons, controls, summaries and reports.
 if(typeof renderDiary==='function'){
  const previousDiary=renderDiary;
  renderDiary=function(){
   const h=previousDiary();const root=document.createElement('div');root.innerHTML=h;
   let card=[...root.querySelectorAll('.card')].find(c=>[...c.querySelectorAll('.h2')].some(t=>/События дня|События/.test(t.textContent))&&c.querySelector('.event'));
   if(!card)return h;
   const elements=[...card.querySelectorAll('.event')].filter(el=>el.closest('.card')===card);
   if(!elements.length)return h;
   const rows=[];
   for(const el of elements){
     const id=el.querySelector('button[data-action="delete"]')?.dataset.id;
     const item=id!=null?app.events.find(e=>String(e.id)===String(id)):null;
     if(item)rows.push(legacyRow(item,el));
     else {
       // Keep any virtual planned rows if source record is not in app.events.
       const time=el.querySelector('time')?.textContent||el.textContent.match(/(?:[01]\d|2[0-3]):[0-5]\d/)?.[0]||'—';
       const meta=el.querySelector('.meta')?.innerHTML||el.innerHTML;
       rows.push('<tr class="gfjt-planned"><td><div class="gfjt-time">'+escapeText(time)+'</div></td><td><span class="gfjt-blank">—</span></td><td>'+meta+'</td></tr>');
     }
   }
   const table=document.createElement('div');table.innerHTML=begin+rows.join('')+end+'<div class="gfjt-headnote">CGM берётся из истории за время записи; если близкой точки нет, значение не подставляется.</div>';
   elements[0].replaceWith(table);for(const el of elements.slice(1))el.remove();
   return root.innerHTML;
  };
 }
 function v5Reading(time){
  // Only display values on the three synthetic chart dates. Future/today records have no graph readings.
  const date=time.toLocaleDateString('sv-SE');
  const d=['2026-11-09','2026-11-10','2026-11-11'].indexOf(date);
  if(d<0 || typeof mockGlucose5!=='function')return null;
  const hour=time.getHours()+time.getMinutes()/60;
  const v=Number(mockGlucose5(d,hour));
  const prev=Number(mockGlucose5(d,Math.max(0,hour-0.25)));
  if(!Number.isFinite(v)||!Number.isFinite(prev))return null;
  const slope=v-prev;
  return {mmol:v,direction:slope>0.40?'SingleUp':slope>0.12?'FortyFiveUp':slope<-.40?'SingleDown':slope<-.12?'FortyFiveDown':'Flat'};
 }
 function v5Row(r){
  const t=r.when,g=v5Reading(t);
  const sick=r.type==='illness'||v5IllHistory.some(p=>t>=p.start&&(p.end===null||t<=p.end));
  let data='<div class="gfjt-type">'+escapeText(r.type==='meal'?'🍽 Еда':['rapid','basal','planned','insulin'].includes(r.type)?'💉 Инъекция':r.type==='illness'?'🤒 Болезнь':'📝 Запись')+'</div>';
  const title=String(r.title||'').replace(/^[^\p{L}\p{N}]+/u,'');
  if(r.type==='meal'){
   data+='<div class="gfjt-foodname">'+escapeText(title)+'</div><div class="gfjt-extra">'+escapeText(r.desc||'')+'</div>';
   // V5 seed only provides carbs; do not invent protein, fat or kcal.
   data+=totals({carbs:r.carbs,protein:null,fat:null,kcal:null});
  }else if(['rapid','basal','planned','insulin'].includes(r.type)){
   data+='<div class="gfjt-ins">'+escapeText(title)+'</div><div class="gfjt-extra">'+escapeText(r.desc||'')+'</div>';
   data+='<div class="gfjt-site">Место укола: '+(r.site?'<b>'+escapeText(r.site)+'</b>':'<span class="gfjt-blank">не указано</span>')+'</div>';
   if(r.type==='planned')data+='<span class="gfjt-pill">По плану · факт не подтверждён</span>';
  }else{data+='<div>'+escapeText(title)+'</div><div class="gfjt-extra">'+escapeText(r.desc||'')+'</div>'}
  return '<tr class="'+(sick?'gfjt-sick ':'')+(r.type==='planned'?'gfjt-planned':'')+'"><td><div class="gfjt-time">'+clock(t)+'</div></td><td>'+glucoseCell(g,null)+'</td><td>'+data+'</td></tr>';

 // V5 approved shell: replace only the event list, no changes to low/high sugar dialogs.
 if(typeof renderV5Diary==='function'){
  renderV5Diary=function(){

  };
