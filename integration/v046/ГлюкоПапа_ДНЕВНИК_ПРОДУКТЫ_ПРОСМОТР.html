<div id="modalRoot"></div><script>/* GlucoFamily 0.13 medical OBSERVATION engine.

 }

  const rows=(input.events||[]).filter(e=>e.type==='insulin'&&e.insulinType==='short'&&valid(e.ts)&&Number(e.ts)<=now&&now-Number(e.ts)<=4*60*MINUTE).sort((a,b)=>b.ts-a.ts);
  return {count:rows.length,hasRecentMultiple:rows.length>=2,mostRecentAt:rows[0]?.ts||null,explanation:'В журнале есть несколько коротких инъекций в пределах четырёх часов. Их действие может перекрываться. Это не расчёт остаточного инсулина (IOB) и не инструкция по дозированию.'};

'<div class="card"><div class="row"><div class="h2">Глюкоза сейчас</div><div class="chip" style="background:'+(ok?'#e8f5f0':'#fff2e2')+';color:'+(ok?'#248678':'#9b7137')+'">'+(ok?'● Актуально':'● Нет свежих данных')+'</div></div><div class="value">'+(r?fmt(r.mmol):'—')+' <small>ммоль/л</small> '+(ok?'<span style="font-size:25px;color:#148e88">'+esc(trendIcon(r.direction))+'</span>':'')+'</div><div class="muted">'+(r?'Измерение: '+fullWhen(r.ts)+(ok?'':' · показание устарело'):'Ожидаем данные с xDrip+ Follower')+'</div>'+graph()+'<div class="row" style="margin-top:10px"><span class="muted">Источник: xDrip+ на этом телефоне</span><button class="linkbtn" data-action="refresh">Обновить ↻</button></div></div>'+
'<div class="card ill '+(app.ill?'active':'')+'"><div class="row"><div><div class="h2">🤒 Болеет</div><div class="muted">Учитывать болезнь в дневнике и анализе</div></div><button class="toggle '+(app.ill?'on':'')+'" aria-label="Переключить режим болезни" aria-pressed="'+app.ill+'" data-action="ill"></button></div>'+(app.ill?'<div class="banner warning" style="margin-bottom:0">Режим болезни включён'+(app.illSince?' с '+fullWhen(app.illSince):'')+'. Следуйте индивидуальному плану врача, контролируйте кетоны по его рекомендациям. Приложение не изменяет дозы.</div>':'')+'</div>'+
'<div class="metrics"><div class="metric"><b>'+fmt(carbs,0)+' г</b><span>Углеводы сегодня</span></div><div class="metric"><b>'+fmt(insulin,2)+' ЕД</b><span>Инсулин записан</span></div><div class="metric"><b>'+diaryToday.length+'</b><span>Записей сегодня</span></div></div>'+

function renderDiary(){const now=new Date();now.setDate(now.getDate()+app.dayOffset);const d=now.toDateString();const es=[...app.events].filter(e=>new Date(e.ts).toDateString()===d).sort((a,b)=>b.ts-a.ts);let html=topHead('Дневник','Питание, фактические инъекции, заметки')+'<div class="card"><div class="row"><button class="btn ghost" data-action="prev">‹</button><div class="strong">'+now.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+'</div><button class="btn ghost" data-action="next">›</button></div></div><div class="grid2" style="margin-bottom:12px"><button class="btn secondary" data-action="gofoods">+ Еда</button><button class="btn secondary" data-action="insulin">+ Инсулин</button></div><button class="btn ghost full" style="margin-bottom:13px" data-action="note">+ Добавить заметку / симптомы</button><div class="card"><div class="h2" style="margin-bottom:8px">События</div>';
if(!es.length)html+='<div class="empty">Пока нет записей за выбранный день.<br>Добавь питание или фактическую инъекцию.</div>';for(let x of es){const icon=x.type==='meal'?'🍲':x.type==='insulin'?'💉':'📝';let desc=x.type==='meal'?fmt(x.grams,0)+' г · У '+fmt(x.carbs)+' г · Б '+fmt(x.protein)+' г · Ж '+fmt(x.fat)+' г':x.type==='insulin'?fmt(x.units,2)+' ЕД · '+esc(x.insulinName||'Название не указано'):esc(x.note||'');html+='<div class="event"><div class="circle">'+icon+'</div><div class="meta"><div class="row"><b>'+esc(x.name||'Событие')+'</b><span class="muted">'+when(x.ts)+'</span></div><div class="muted">'+desc+'</div></div><button class="del" aria-label="Удалить запись" data-action="delete" data-id="'+x.id+'">×</button></div>'}return html+'</div>'+safetyNote()}
function foodCategories(){return ['Все',...new Set(app.foods.map(f=>f.category))]}
function filterFoods(){const q=app.foodQuery.trim().toLowerCase();return app.foods.filter(f=>(app.foodCategory==='Все'||f.category===app.foodCategory)&&f.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ru')).slice(0,120)}

function renderFoods(){return topHead('Продукты и блюда','Каталог для Беларуси · БЖУ на 100 г')+'<div class="search">⌕ <input id="foodSearch" placeholder="Поиск: гречка, хлеб, молоко…" value="'+esc(app.foodQuery)+'" autocomplete="off" inputmode="search"/></div><div class="categories">'+foodCategories().map(c=>'<button data-action="category" data-cat="'+esc(c)+'" class="cat '+(app.foodCategory===c?'active':'')+'">'+esc(c)+'</button>').join('')+'</div><div class="row" style="margin-bottom:10px"><div class="h2">Каталог</div><button class="linkbtn" data-action="custom">+ Свой продукт</button></div><div id="foodResults">'+foodResults()+'</div><div class="banner warning">Начальные '+app.foods.length+' записей включают ориентировочные справочные значения. Проверяй БЖУ по упаковке/рецепту. Для расширения каталога до 2000 записей открой «Ещё» → «Загрузить каталог».</div>'+safetyNote()}

// Исследовательский профиль — эти значения никогда не участвуют в вычислении лечебных доз.
const DAY_PARTS=[['morning','Утро · 05–11'],['day','День · 11–17'],['evening','Вечер · 17–24']];
const COEF_METRICS=[['icr','Углеводный коэффициент','г углеводов на 1 ЕД'],['isf','ФЧИ / коэффициент коррекции','ммоль/л на 1 ЕД']];
function coefVal(key,part){return app.profile?.coefficients?.[key]?.[part] ?? null}
function formatCoef(key,part){const x=coefVal(key,part);return x===null||x===''?'Не задано':fmt(x,2)+(key==='icr'?' г/ЕД':' ммоль/л/ЕД')}
function persistProfile(){if(native){if(!window.GlucoBridge.setProfile(JSON.stringify(app.profile))){notify('Не удалось сохранить профиль');return false}}else persist();return true}
function saveProfileBasics(){const age=document.getElementById('profileAge').value,weight=document.getElementById('profileWeight').value,height=document.getElementById('profileHeight').value;const clean=(s,max)=>{if(!s.trim())return null;const n=Number(s.replace(',','.'));return Number.isFinite(n)&&n>0&&n<max?n:NaN};const vals={age:clean(age,22),weight:clean(weight,250),height:clean(height,230)};if(Object.values(vals).some(x=>Number.isNaN(x))){notify('Проверьте возраст, рост и вес');return}const allergies=document.getElementById('profileAllergy').value.slice(0,400).trim(),step=document.getElementById('profileStep').value;app.profile={...app.profile,...vals,allergies,step:Number(step)||.5};if(!persistProfile())return;closeModal();notify('Данные ребёнка сохранены');render()}
function profileModal(){const p=app.profile||{};modal('<div class="row"><h2>Профиль ребёнка</h2><button class="close" data-action="close">×</button></div><div class="banner">Эти данные используются в дневнике. Возраст и вес сами по себе не задают безопасную дозу инсулина.</div>'+[['profileAge','Возраст, полных лет',p.age,'1'],['profileWeight','Вес, кг',p.weight,'0.1'],['profileHeight','Рост, см',p.height,'0.1']].map(x=>'<div class="field"><label>'+x[1]+'</label><input class="input" id="'+x[0]+'" type="number" min="0" step="'+x[3]+'" value="'+esc(x[2]??'')+'" placeholder="Не указано"></div>').join('')+'<div class="field"><label>Аллергии / непереносимость (через запятую)</label><textarea class="input" id="profileAllergy" rows="2" placeholder="Например, арахис, белок молока">'+esc(p.allergies||'')+'</textarea></div><div class="field"><label>Шаг шприц-ручки (для записи факта, ЕД)</label><select class="input" id="profileStep"><option value="0.5" '+(p.step!==1?'selected':'')+'>0,5 ЕД</option><option value="1" '+(p.step===1?'selected':'')+'>1 ЕД</option></select></div><button class="btn full" data-action="saveProfileBasics">Сохранить профиль</button>')}
function coefModal(){const rows=COEF_METRICS.map(([key,label,unit])=>'<div class="h2" style="margin:18px 0 6px">'+label+'</div><div class="muted">'+unit+' · оставьте пустым, если неизвестно</div>'+DAY_PARTS.map(([part,name])=>'<div class="field"><label>'+name+'</label><input class="input coefInput" id="coef_'+key+'_'+part+'" inputmode="decimal" type="number" min="0.01" max="250" step="0.01" value="'+esc(coefVal(key,part)??'')+'" placeholder="Не задано"></div>').join('')).join('');modal('<div class="row"><h2>Редактировать коэффициенты</h2><button class="close" data-action="close">×</button></div><div class="banner warning">Ручные значения — только справочные. Они не применяются к рекомендациям об инъекции. Для лечебного использования нужен согласованный план и проверенный расчётный модуль.</div>'+rows+'<div class="field"><label>Причина изменения</label><input class="input" id="coefReason" placeholder="Например, перенос значений из дневника" maxlength="200"></div><button class="btn full" data-action="saveCoef">Сохранить с историей изменений</button>')}
function saveCoef(){const updated={};for(const [key] of COEF_METRICS){updated[key]={};for(const [part] of DAY_PARTS){const raw=document.getElementById('coef_'+key+'_'+part).value.trim().replace(',','.');if(!raw){updated[key][part]=null;continue}const v=Number(raw);if(!Number.isFinite(v)||v<=0||v>250){notify('Проверьте значения коэффициентов');return}updated[key][part]=v}}const old=JSON.parse(JSON.stringify(app.profile.coefficients||{}));const why=document.getElementById('coefReason').value.trim().slice(0,200);app.profile.coefficients=updated;app.profile.coefficientHistory=[{at:Date.now(),source:'Ручной ввод',reason:why||'Ручная корректировка',previous:old,current:updated},...(app.profile.coefficientHistory||[])].slice(0,50);if(!persistProfile())return;closeModal();notify('Сохранено. Профиль не применяется к дозированию');render()}
function glucoseClosest(ts,maxGap){let best=null,dist=maxGap+1;for(const r of app.readings){const d=Math.abs(Number(r.ts)-ts);if(d<dist&&Number.isFinite(Number(r.mmol))){dist=d;best=r}}return best}
function observationsByPart(){const now=Date.now();return DAY_PARTS.map(([key,label],i)=>{const mealRows=app.events.filter(e=>e.type==='meal'&&(e.status!=='planned'&&e.status!=='started')&&e.ts>=now-14*86400000&&e.ts<=now&&((new Date(e.ts).getHours()>=([5,11,17][i]))&&(new Date(e.ts).getHours()<([11,17,24][i]))));let deltas=[];for(const m of mealRows){const before=glucoseClosest(m.ts-5*60000,15*60000),after=glucoseClosest(m.ts+120*60000,25*60000);if(before&&after&&after.ts>before.ts){deltas.push(after.mmol-before.mmol)}}const mean=deltas.length?deltas.reduce((a,b)=>a+b,0)/deltas.length:null;return {key,label,meals:mealRows.length,samples:deltas.length,mean}})}
function renderCoefBlock(){const p=app.profile||{};const cards=COEF_METRICS.map(([key,label,unit])=>'<div class="card"><div class="h2">'+label+'</div><div class="muted">'+unit+'</div>'+DAY_PARTS.map(([part,period])=>'<div class="readout"><div><b>'+period+'</b><div class="muted">Ручной профиль / исследование</div></div><div class="strong">'+formatCoef(key,part)+'</div></div>').join('')+'</div>').join('');const history=(p.coefficientHistory||[]).slice(0,3).map(h=>'<div class="readout"><span>'+fullWhen(h.at)+'</span><span class="muted">'+esc(h.reason||h.source)+'</span></div>').join('');const summaries=observationsByPart().map(x=>'<div class="readout"><div><b>'+x.label+'</b><div class="muted">За 14 дней: '+x.meals+' приёмов пищи; '+x.samples+' пар CGM</div></div><span class="minipill">'+(x.samples>=3?'Есть наблюдения':'Недостаточно данных')+'</span></div>'+(x.samples>=3?'<div class="muted" style="margin-bottom:8px">Среднее изменение через ≈2 часа: '+(x.mean>0?'+':'')+fmt(x.mean)+' ммоль/л. Это не ФЧИ и не расчёт дозы.</div>':'')).join('');return '<div class="card"><div class="row"><div><div class="h2">Коэффициенты и чувствительность</div><div class="muted">Без вымышленных стартовых значений</div></div><button class="btn secondary" data-action="editCoef">Изменить</button></div><div class="banner">Данные в ммоль/л из xDrip+. Углеводный коэффициент измеряется в г/ЕД, а ФЧИ — в ммоль/л на 1 ЕД. Они не равнозначны.</div></div>'+cards+'<div class="card"><div class="h2">Автоматический анализ наблюдений</div>'+summaries+'<div class="banner warning">ИИ не заполняет числовые лечебные коэффициенты на основании нескольких дней CGM: корреляция с едой ещё не устанавливает действие отдельной дозы. Автоматическая клиническая оценка и её проверка — отдельный этап.</div></div><div class="card"><div class="h2">Дополнительные параметры</div>'+[['Шаг введения',((p.step??.5)+' ЕД')],['Время действия инсулина / IOB','Не задано — потребуется тип препарата и валидированная модель'],['Базальный инсулин','Фактические введения фиксируются в дневнике'],['Целевой диапазон','По индивидуальному медицинскому плану'],['Болезнь',app.ill?'Активно — анализ отдельно':'Нет отметки болезни']].map(r=>'<div class="readout"><span class="muted">'+r[0]+'</span><b style="text-align:right;max-width:58%;font-size:12px">'+esc(r[1])+'</b></div>').join('')+'</div><div class="card"><div class="h2">История корректировок</div>'+(history||'<div class="muted" style="margin-top:8px">Изменений пока нет</div>')+'</div>'}

function renderStats(){const week=Date.now()-7*86400000;const es=app.events.filter(x=>x.ts>=week);const meals=es.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),ins=es.filter(x=>x.type==='insulin');const rs=app.readings.filter(x=>x.ts>=week);const avg=rs.length?fmt(rs.reduce((a,x)=>a+x.mmol,0)/rs.length):'—';const countDays=new Set(meals.map(m=>new Date(m.ts).toDateString())).size;let blocks=['Утро','День','Вечер'].map((t,i)=>{const a=i===0?5:i===1?11:17,b=i===0?11:i===1?17:24,groups=meals.filter(e=>{const h=new Date(e.ts).getHours();return h>=a&&h<b});return '<div class="readout"><div><b>'+t+'</b><div class="muted">'+groups.length+' приёмов пищи за 7 дней</div></div><span class="minipill">'+(groups.length>=5?'Есть история':'Мало данных')+'</span></div>'}).join('');return topHead('Анализ истории','Исследовательская аналитика без рекомендаций доз')+'<div class="card"><div class="h2" style="margin-bottom:13px">Последние 7 дней</div><div class="metrics"><div class="metric"><b>'+rs.length+'</b><span>Измерений CGM</span></div><div class="metric"><b>'+meals.length+'</b><span>Приёмов пищи</span></div><div class="metric"><b>'+ins.length+'</b><span>Инъекций</span></div></div><div class="readout"><span class="muted">Средняя глюкоза по доступным показаниям</span><b>'+avg+' ммоль/л</b></div><div class="readout"><span class="muted">Дней с записью еды</span><b>'+countDays+' из 7</b></div></div>'+
renderCoefBlock()+
'<div class="card"><div class="h2">Наблюдения</div><div class="event"><div class="circle">🔎</div><div class="meta"><b>'+(!rs.length?'Нет данных CGM':'Данные CGM сохранены')+'</b><div class="muted">'+(!rs.length?'Подключите xDrip+ в настройках для построения статистики.':'Статистика строится только по полученным показаниям; пропуски не заполняются выдуманными значениями.')+'</div></div></div><div class="event"><div class="circle">📝</div><div class="meta"><b>Дневник '+(meals.length&&ins.length?'заполняется':'пока неполный')+'</b><div class="muted">Для анализа обязательно фиксировать время еды, фактическую граммовку, время и количество инсулина.</div></div></div></div>'+safetyNote()}

const rnum=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:NaN};
const foodUnits=x=>({grams:x.grams||0,carbs:x.carbs||0,protein:x.protein||0,fat:x.fat||0,kcal:x.kcal||0});
const sumMeal=items=>items.reduce((a,x)=>{for(const k of ['grams','carbs','protein','fat','kcal'])a[k]+=Number(x[k]||0);return a},{grams:0,carbs:0,protein:0,fat:0,kcal:0});
const allTags=f=>{
  const text=(f.name+' '+(f.ingredients||'')+' '+(f.allergens||'')).toLowerCase();
  let x=[];
  if(/пшенич|рож|ячмен|булгур|макарон|батон|хлеб|крупа манн|глютен|пшениц|булоч|бородинск|овсян/.test(text))x.push('глютен');
  if(/молок|творог|сыр|сливк|кефир|йогурт|сметан|масло сливоч/.test(text))x.push('молоко');
  if(/яйц|яич|майонез/.test(text))x.push('яйца');
  if(/арахис/.test(text))x.push('арахис');
  if(/орех|фундук|миндал|грецк/.test(text))x.push('орехи');
  if(/рыб|треск|лосос|селед/.test(text))x.push('рыба');
  return [...new Set([...(Array.isArray(f.allergens)?f.allergens:[]),...x])];
};
const normalizedAllergies=()=>String(app.profile?.allergies||'').toLowerCase().split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
function allergyFlags(items){let hits=[];const cfg=normalizedAllergies();for(const it of items){const food=app.foods.find(x=>String(x.id)===String(it.id))||it;const possible=allTags(food);for(const a of cfg){const alias=/пшениц|глютен|целиак/.test(a)?'глютен':/лактоз|молок/.test(a)?'молоко':/орех/.test(a)?'орехи':/яйц/.test(a)?'яйца':a; if(possible.some(x=>x===alias||x.includes(alias)||alias.includes(x)))hits.push(food.name+' — '+a)}}return [...new Set(hits)]}
const flagMsg=items=>{const hits=allergyFlags(items);return hits.length?'<div class="banner danger"><b>⚠ Возможный аллерген!</b><div>'+hits.map(esc).join('; ')+'</div><div>Не уменьшайте порцию для «безопасности». Исключите подозрительный продукт и проверьте этикетку/рецепт. Автоматическое обнаружение аллергенов неполное.</div></div>':normalizedAllergies().length?'<div class="banner warning">Аллергены проверяются предварительно по названию и составу, если он известен. Обязательно проверяйте этикетки.</div>':''};

function adjustDraft(i,g){let item=app.mealDraft[i];if(!item)return;const grams=rnum(g);if(!Number.isFinite(grams)||grams<1||grams>3000){notify('Вес порции: от 1 до 3000 г');return}const f=app.foods.find(x=>String(x.id)===String(item.id));if(!f){notify('Исходный продукт не найден');return}Object.assign(item,{grams,carbs:f.carbs*grams/100,protein:f.protein*grams/100,fat:f.fat*grams/100,kcal:f.kcal*grams/100,fiber:Number.isFinite(Number(f.fiber))&&f.fiber!==null?Number(f.fiber)*grams/100:null});persist();render()}

function renderMealComposer(){const rows=app.mealDraft.map((x,i)=>'<div class="meal-item"><div style="flex:1"><b>'+esc(x.name)+'</b><div class="muted">У '+fmt(x.carbs)+' · Б '+fmt(x.protein)+' · Ж '+fmt(x.fat)+' г · '+fmt(x.kcal,0)+' ккал</div></div><label class="gram-field">г <input aria-label="Граммы '+esc(x.name)+'" type="number" inputmode="numeric" min="1" max="3000" step="1" class="input draft-grams" data-index="'+i+'" value="'+fmt(x.grams,0).replace(/\s/g,'')+'"></label><button class="del" data-action="removeDraft" data-index="'+i+'" aria-label="Убрать продукт">✕</button></div>').join('');return '<div class="card composer" id="composer"><div class="row"><div><div class="h2">🍽️ Составить приём пищи</div><div class="muted">Блюда сохраняются одной записью</div></div><span class="chip">'+app.mealDraft.length+' поз.</span></div>'+

(app.mealDraft.length?rows+previewNutrition(app.mealDraft)+flagMsg(app.mealDraft):'<div class="empty" style="padding:17px">Выбери блюда в каталоге и укажи вес.<br>Можно начать с примера.</div>')+

(app.mealDraft.length?'<div class="actionStack"><button class="btn secondary full" data-action="analyzeMeal">🔎 Анализ питания и глюкозы</button><button class="btn full" data-action="savePlannedMeal">Сохранить как запланированное</button><button class="btn ghost full" data-action="saveEatenMeal">✓ Подтвердить, что съедено</button></div>':'')+
'<div class="muted" style="margin-top:12px">Анализ не назначает единицы инсулина, время укола или разделение дозы. Для этого нужен клинически проверенный расчётный модуль.</div></div>'}
function renderDiary(){const now=new Date();now.setDate(now.getDate()+app.dayOffset);const d=now.toDateString();const es=[...app.events].filter(e=>new Date(e.ts).toDateString()===d).sort((a,b)=>a.ts-b.ts);const eaten=es.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),ins=es.filter(x=>x.type==='insulin');const sum=sumMeal(eaten);let html=topHead('Дневник','Время, еда, инъекции, глюкоза и реакция')+'<div class="card"><div class="row"><button class="btn ghost" data-action="prev">‹</button><div class="strong">'+now.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})+'</div><button class="btn ghost" data-action="next">›</button></div></div>'+
'<div class="grid2" style="margin-bottom:12px"><button class="btn secondary" data-action="jumpMeal">+ Еда</button><button class="btn secondary" data-action="insulin">+ Инсулин</button></div>'+
'<div class="grid2" style="margin-bottom:12px"><button class="btn ghost" data-action="highAction">↑ Высокий сахар</button><button class="btn ghost" data-action="lowAction">↓ Низкий сахар</button></div>'+renderMealComposer()+'<div class="card"><div class="row"><div class="h2">События дня</div><button class="linkbtn" data-action="note">+ Заметка</button></div>';
if(!es.length)html+='<div class="empty">Фактических записей пока нет. Добавь еду и уколы.</div>';
for(let x of es){const icon=x.type==='meal'?'🍲':x.type==='insulin'?'💉':'📝',g=glucoseClosest(x.ts,12*60000);const gt=g?fmt(g.mmol)+' ммоль/л '+esc(trendIcon(g.direction)):'CGM: нет записи рядом';let detail='';if(x.type==='meal'){const items=Array.isArray(x.items)?x.items:parseItems(x.itemsJson);detail=(items.length?items.map(it=>esc(it.name)+' '+fmt(it.grams,0)+' г').join(' · '):fmt(x.grams,0)+' г')+'<div>У '+fmt(x.carbs)+' · Б '+fmt(x.protein)+' · Ж '+fmt(x.fat)+' г · '+fmt(x.kcal,0)+' ккал</div>'}else if(x.type==='insulin')detail=esc(x.insulinName||'Инсулин')+' · '+fmt(x.units,2)+' ЕД'+(x.insulinType?' ('+esc(x.insulinType)+')':'');else detail=esc(x.note||'');html+='<div class="event"><div class="circle">'+icon+'</div><div class="meta"><div class="row"><b>'+esc(x.type==='meal'?'Приём пищи':x.type==='insulin'?'Инъекция':'Заметка')+'</b><span class="muted">'+when(x.ts)+'</span></div><div class="muted">'+(x.type==='meal'&&x.status==='planned'?'<span class="minipill">Запланировано · не съедено</span><div>':'')+detail+(x.type==='meal'&&x.status==='planned'?'</div>':'')+'</div><div class="muted" style="margin-top:5px">'+gt+'</div>'+(x.type==='meal'&&x.status==='planned'?'<button class="linkbtn" data-action="markEaten" data-id="'+x.id+'">Отметить как съеденное</button>':'')+'</div><button class="del" aria-label="Удалить запись" data-action="delete" data-id="'+x.id+'">✕</button></div>'}
html+='</div><div class="card"><div class="h2">Итоги за '+now.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'</div><div class="readout"><span>Б · Ж · У</span><b>'+fmt(sum.protein)+' / '+fmt(sum.fat)+' / '+fmt(sum.carbs)+' г</b></div><div class="readout"><span>Энергия</span><b>'+fmt(sum.kcal,0)+' ккал</b></div><div class="readout"><span>Быстрый / длинный</span><b>'+fmt(ins.filter(x=>x.insulinType==='short').reduce((a,b)=>a+Number(b.units||0),0))+' / '+fmt(ins.filter(x=>x.insulinType==='long').reduce((a,b)=>a+Number(b.units||0),0))+' ЕД</b></div></div><button class="btn secondary full" data-action="report">📄 Отчёт для врача</button>';return html+safetyNote()}

function storeMeal(status){if(!app.mealDraft.length){notify('Сначала добавь продукты');return}const input=document.getElementById('mealDateTime');const iso=input?.value||app.mealDraftTime;const ts=new Date(iso).getTime();if(!Number.isFinite(ts)||ts<946684800000||ts>Date.now()+7*86400000){notify('Укажите корректное время приёма пищи');return}const flags=allergyFlags(app.mealDraft);if(flags.length){notify('Сначала исключите продукты с возможным аллергеном');return}if(status==='eaten'&&ts>Date.now()+120000){notify('Для фактически съеденного укажите прошедшее время');return}const x=sumMeal(app.mealDraft);const items=app.mealDraft.map(it=>({...it}));app.mealDraftTime=iso;const e={type:'meal',name:items.map(x=>x.name).join(', ').slice(0,180),ts,items,itemsJson:JSON.stringify(items),status,grams:x.grams,carbs:x.carbs,protein:x.protein,fat:x.fat,kcal:x.kcal,carbType:app.mealCarbType||'mixed',activityLevel:app.mealActivity||'Не отмечено',note:gf011PlanNote(),fiber:gf011FiberTotal(items).unknown?null:gf011FiberTotal(items).value};if(addEvent(e)===false)return;app.mealDraft=[];app.mealDraftDemo=false;app.mealDraftTime=localIso(new Date());persist();render()}
function analyzeMeal(){if(!app.mealDraft.length){notify('Сначала добавь продукты');return}const x=sumMeal(app.mealDraft),last=getLast(),f=fresh(last);const goal=app.profile?.nutrition||{};const flags=allergyFlags(app.mealDraft);const msgs=[['Углеводы',x.carbs,' г'],['Белки',x.protein,' г'],['Жиры',x.fat,' г'],['Энергия',x.kcal,' ккал']].map(([n,v,u])=>'<div class="readout"><span>'+n+'</span><b>'+fmt(v,n==='Энергия'?0:1)+u+'</b></div>').join('');let targetText='<div class="banner warning">Дневные ориентиры питания пока не заданы. Нельзя достоверно сказать, сколько ребёнку следует съесть, только по возрасту и весу.</div>';if(Object.values(goal).some(x=>Number(x)>0)){const eatenToday=app.events.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')&&new Date(x.ts).toDateString()===new Date().toDateString()),sum=sumMeal(eatenToday);targetText='<div class="h2" style="margin-top:14px">Сравнение с заданным планом на день</div>'+[['carbs','Углеводы','г'],['protein','Белки','г'],['fat','Жиры','г'],['kcal','Энергия','ккал']].filter(x=>Number(goal[x[0]])>0).map(([k,label,unit])=>'<div class="readout"><span>'+label+' (с этим приёмом)</span><b>'+fmt(sum[k]+x[k],k==='kcal'?0:1)+' / '+fmt(goal[k],0)+' '+unit+'</b></div>').join('')+'<div class="muted">Ориентиры вручную заданы в профиле; сравнение не является индивидуальным назначением.</div>'}
modal('<div class="row"><h2>Анализ приёма пищи</h2><button class="close" data-action="close">×</button></div>'+msgs+flagMsg(app.mealDraft)+targetText+'<div class="readout"><span>Глюкоза xDrip+ сейчас</span><b>'+(last&&f?fmt(last.mmol)+' ммоль/л '+esc(trendIcon(last.direction)):'Нет свежих данных')+'</b></div><div class="banner">Можно изменить граммовки прямо в черновике и сравнить новые БЖУ. При аллергии аллерген необходимо исключить. Шаг шприц-ручки '+esc(app.profile?.step??0.5)+' ЕД не является основанием подгонять еду под непроверенную дозу.</div><div class="banner warning"><b>Доза и интервал:</b> не рассчитаны. Без индивидуальной схемы лечения и медицински проверенного алгоритма приложение не предлагает ребёнку конкретный укол, задержку перед едой или разделение дозы.</div><button class="btn secondary full" data-action="close">Вернуться и изменить порции</button>')}
function markEaten(id){const e=app.events.find(x=>String(x.id)===String(id));if(!e||e.type!=='meal'||(e.status!=='planned'&&e.status!=='started'))return;modal('<div class="row"><h2>Подтвердить приём пищи</h2><button class="close" data-action="close">×</button></div><div class="banner">Время планирования: '+fullWhen(e.ts)+'. Запиши реальное время, когда ребёнок начал есть.</div><div class="field"><label>Фактическое время</label><input type="datetime-local" class="input" id="actualMealTime" value="'+localIso(new Date())+'"></div><button class="btn full" data-action="confirmEaten" data-id="'+id+'">✓ Съедено</button>')}

function insulinModal(){const p=app.profile||{};const step=penStepFor('short');modal('<div class="row"><h2>💉 Факт инъекции</h2><button class="close" data-action="close">×</button></div><div class="banner warning">Записывай только реально введённый инсулин. Программа не назначает и не изменяет дозу.</div><div class="field"><label>Тип</label><select class="input" id="insType"><option value="short">Короткий / ультракороткий</option><option value="long">Длительного действия</option></select></div><div class="field"><label>Препарат</label><input class="input" id="insName" value="'+esc(p.shortInsulin||'')+'" placeholder="Название с упаковки"></div><div class="field"><label>Фактическая доза, ЕД (шаг '+fmt(step)+' ЕД)</label><input class="input" id="insUnits" type="number" min="'+step+'" max="100" step="'+step+'" placeholder="0,0"></div><div class="field"><label>Время фактической инъекции</label><input class="input" id="insTime" type="datetime-local" value="'+localIso(new Date())+'" /></div><button class="btn full" data-action="saveIns">✓ Сохранить факт укола</button>');document.getElementById('insType').onchange=e=>{document.getElementById('insName').value=e.target.value==='short'?(p.shortInsulin||''):(p.longInsulin||'')}}
function saveIns(){const units=rnum(document.getElementById('insUnits').value),type=document.getElementById('insType').value,insulinName=document.getElementById('insName').value.trim(),ts=new Date(document.getElementById('insTime').value).getTime(),step=penStepFor(type);if(!Number.isFinite(units)||units<=0||units>100||Math.abs(units/step-Math.round(units/step))>0.0001||!insulinName||!Number.isFinite(ts)||ts>Date.now()+120000){notify('Проверь препарат, шаг, дозу и время');return}addEvent({type:'insulin',name:'Инъекция',units,insulinName,insulinType:type,ts})}
function profileModal(){const p=app.profile||{},n=p.nutrition||{};modal('<div class="row"><h2>Профиль ребёнка</h2><button class="close" data-action="close">×</button></div><div class="banner">Профиль нужен для записей и оценки полноценности питания, но не вычисляет лечение по возрасту или весу.</div>'+
[['profileAge','Возраст, лет',p.age,'1'],['profileWeight','Вес, кг',p.weight,'0.1'],['profileHeight','Рост, см',p.height,'0.1']].map(x=>'<div class="field"><label>'+x[1]+'</label><input class="input" id="'+x[0]+'" type="number" min="0" step="'+x[3]+'" value="'+esc(x[2]??'')+'"></div>').join('')+
'<div class="field"><label>Аллергии (через запятую)</label><textarea class="input" id="profileAllergy" rows="2" placeholder="глютен, молоко, арахис…">'+esc(p.allergies||'')+'</textarea></div><div class="grid2"><div class="field"><label>Короткий инсулин</label><input class="input" id="shortInsulin" value="'+esc(p.shortInsulin||'')+'" placeholder="Название"></div><div class="field"><label>Длинный инсулин</label><input class="input" id="longInsulin" value="'+esc(p.longInsulin||'')+'" placeholder="Название"></div></div><div class="field"><label>Шаг ручки</label><select class="input" id="profileStep"><option value="0.5" '+(p.step!==1?'selected':'')+'>0,5 ЕД</option><option value="1" '+(p.step===1?'selected':'')+'>1 ЕД</option></select></div>'+
'<div class="h2" style="margin:18px 0 5px">Личный план питания на день</div><div class="muted">Заполняется по согласованным рекомендациям специалиста. Можно оставить пустым.</div><div class="grid2">'+[['carbs','Углеводы, г'],['protein','Белки, г'],['fat','Жиры, г'],['kcal','Энергия, ккал']].map(([k,label])=>'<div class="field"><label>'+label+'</label><input class="input nutrition-input" id="goal_'+k+'" type="number" min="0" max="10000" step="0.1" value="'+esc(n[k]??'')+'"></div>').join('')+'</div>'+
'<div class="h2" style="margin:18px 0 5px">Привычные продукты для помощи при низкой глюкозе</div><textarea class="input" id="rescueFoods" rows="2" placeholder="Например: сок 100 мл, глюкоза (таблетки)…">'+esc(p.rescueFoods||'')+'</textarea><div class="muted">Размер глотка не стандартизован; для подсчёта нужны граммы углеводов на измеренный объём.</div><button class="btn full" style="margin-top:14px" data-action="saveProfileBasics">Сохранить профиль</button>')}
function saveProfileBasics(){const optional=(id,max)=>{const s=document.getElementById(id).value.trim().replace(',','.');if(!s)return null;const n=Number(s);return Number.isFinite(n)&&n>0&&n<=max?n:NaN};const age=optional('profileAge',120),weight=optional('profileWeight',250),height=optional('profileHeight',250);const nutrition={};for(const [k] of [['carbs'],['protein'],['fat'],['kcal']])nutrition[k]=optional('goal_'+k,10000);if([age,weight,height,...Object.values(nutrition)].some(Number.isNaN)){notify('Проверь значения профиля и питания');return}app.profile={...app.profile,age,weight,height,nutrition,allergies:document.getElementById('profileAllergy').value.slice(0,500).trim(),shortInsulin:document.getElementById('shortInsulin').value.trim().slice(0,100),longInsulin:document.getElementById('longInsulin').value.trim().slice(0,100),rescueFoods:document.getElementById('rescueFoods').value.trim().slice(0,500),step:Number(document.getElementById('profileStep').value)||.5};if(!persistProfile())return;closeModal();notify('Профиль сохранён');render()}
function safetyAction(kind){const r=getLast(),ok=fresh(r),hi=kind==='high';modal('<div class="row"><h2>'+(hi?'↑ Высокий сахар':'↓ Низкий сахар')+'</h2><button class="close" data-action="close">×</button></div><div class="card"><div class="readout"><span>Последнее значение xDrip+</span><b>'+(ok?fmt(r.mmol)+' ммоль/л '+esc(trendIcon(r.direction)):'Нет свежего измерения')+'</b></div><div class="muted">Если симптомы не совпадают с CGM, проверьте глюкозу глюкометром по вашему плану.</div></div><div class="banner '+(hi?'warning':'danger')+'">'+(hi?'Для высокой глюкозы: следуйте индивидуальному плану коррекции, учитывайте ранее введённый инсулин и проверяйте кетоны согласно плану, особенно при болезни. При рвоте, боли в животе, учащённом дыхании или сонливости необходима срочная медицинская помощь.':'При низкой глюкозе: действуйте немедленно по индивидуальному плану гипогликемии. При потере сознания или невозможности безопасно глотать ничего не давайте через рот; используйте назначенный глюкагон и вызывайте экстренную помощь.')+'</div>'+(hi?'':'<div class="h2">Привычные продукты</div><div class="banner">'+esc(app.profile?.rescueFoods||'Не указаны. Можно добавить в профиле ребёнка.')+'</div><div class="muted">Программа не переводит «глотки» в углеводы: объём глотка неизвестен. Нужен измеренный объём и состав с упаковки.</div>')+'<div class="banner">Автоматическая индивидуальная доза и количество быстрых углеводов пока не рассчитываются — требуется одобренный медицинский протокол.</div><button class="btn secondary full" data-action="note">Записать событие и наблюдения</button>')}
function renderHome(){const html=renderHomeOld();return html.replace('<div class="sectionHead"><h2>Быстрые действия</h2></div>','<div class="sectionHead"><h2>Быстрые действия</h2></div><div class="grid2" style="margin-bottom:13px"><button class="btn ghost" data-action="lowAction">↓ Низкий сахар</button><button class="btn ghost" data-action="highAction">↑ Высокий сахар</button></div>').replace('Добавить еду</span>','Составить еду</span>')}

function reportGroups(){const days={};for(const e of app.events){const d=new Date(e.ts).toLocaleDateString('sv-SE');(days[d]||(days[d]=[])).push(e)}return days}
function reportData(period){const today=new Date();const str=document.getElementById('reportDate')?.value||today.toLocaleDateString('sv-SE');const month=document.getElementById('reportMonth')?.value||str.slice(0,7);const rows=[...app.events].filter(e=>{const d=new Date(e.ts).toLocaleDateString('sv-SE');return period==='month'?d.startsWith(month):d===str}).sort((a,b)=>a.ts-b.ts);return {rows,label:period==='month'?month:str}}
function reportRows(rows){return rows.map(e=>{const r=glucoseClosest(e.ts,12*60000);const g=r?fmt(r.mmol)+' '+esc(trendIcon(r.direction)):'—';const name=e.type==='meal'?'🍽 Еда '+(e.status==='planned'?'(план)':''):e.type==='insulin'?'💉 '+esc(e.insulinName)+' '+fmt(e.units,2)+' ЕД':'📝 Заметка';const items=e.type==='meal'?(parseItems(e.itemsJson||e.items).length?parseItems(e.itemsJson||e.items).map(it=>esc(it.name)+' '+fmt(it.grams,0)+' г').join('; '):esc(e.name)):'',macro=e.type==='meal'?'У '+fmt(e.carbs)+' · Б '+fmt(e.protein)+' · Ж '+fmt(e.fat)+' г · '+fmt(e.kcal,0)+' ккал':esc(e.note||'');return '<tr><td>'+fullWhen(e.ts)+'</td><td>'+name+'</td><td>'+g+'</td><td>'+items+'<div class="muted">'+macro+'</div></td></tr>'}).join('')}
function reportTotals(rows){const meals=rows.filter(e=>e.type==='meal'&&(e.status!=='planned'&&e.status!=='started')),m=sumMeal(meals),ins=rows.filter(e=>e.type==='insulin'),quick=ins.filter(x=>x.insulinType==='short').reduce((a,x)=>a+Number(x.units||0),0),long=ins.filter(x=>x.insulinType==='long').reduce((a,x)=>a+Number(x.units||0),0);return '<div class="readout"><span>Инсулин короткий / длинный</span><b>'+fmt(quick,2)+' / '+fmt(long,2)+' ЕД</b></div><div class="readout"><span>Белки / Жиры / Углеводы</span><b>'+fmt(m.protein)+' / '+fmt(m.fat)+' / '+fmt(m.carbs)+' г</b></div><div class="readout"><span>Энергия</span><b>'+fmt(m.kcal,0)+' ккал</b></div><div class="muted">Неизвестный тип инсулина не включён в суммы короткого и длинного; данные зависят от полноты дневника.</div>'}
function renderReport(){const period=app.reportPeriod||'day',date=app.reportDate||new Date().toLocaleDateString('sv-SE'),month=app.reportMonth||date.slice(0,7);const rows=[...app.events].filter(e=>{const d=new Date(e.ts).toLocaleDateString('sv-SE');return period==='day'?d===date:d.startsWith(month)}).sort((a,b)=>a.ts-b.ts);let html=topHead('Отчёт для врача','Хронология еды, инъекций, глюкозы и БЖУ')+'<div class="card no-print"><div class="grid2"><button class="btn '+(period==='day'?'':'ghost')+'" data-action="reportDay">За день</button><button class="btn '+(period==='month'?'':'ghost')+'" data-action="reportMonth">За месяц</button></div><div class="field"><label>Период</label><input class="input" id="reportPeriodValue" type="'+(period==='day'?'date':'month')+'" value="'+(period==='day'?date:month)+'"></div><button class="btn secondary full" data-action="updateReport">Показать</button></div><div id="printReport" class="card"><div class="h2">Глюкопапа · '+(period==='day'?'День '+date:'Месяц '+month)+'</div><div class="muted">Отчёт отражает внесённые записи, а не назначает лечение.</div><div class="report-scroll"><table class="report-table"><thead><tr><th>Время</th><th>Событие</th><th>CGM, ммоль/л</th><th>Еда и питание</th></tr></thead><tbody>'+(rows.length?reportRows(rows):'<tr><td colspan="4">Нет записей в выбранном периоде</td></tr>')+'</tbody></table></div><div class="h2" style="margin-top:18px">'+(period==='day'?'Итого за день':'Итого за месяц')+'</div>'+reportTotals(rows)+reportInsights(rows,period)+'</div><div class="grid2 no-print"><button class="btn secondary" data-action="printReport">Печать / PDF</button><button class="btn ghost" data-action="goDiary">К дневнику</button></div>'+safetyNote();return html}
function reportInsights(rows,period){const eaten=rows.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started'));const ins=rows.filter(x=>x.type==='insulin');const gaps=rows.filter(x=>x.type==='meal').filter(x=>!glucoseClosest(x.ts,12*60000)).length;const goals=app.profile?.nutrition||{};const sums=sumMeal(eaten);const daysWithFood=Math.max(1,new Set(eaten.map(x=>new Date(x.ts).toDateString())).size);const comps=[['carbs','углеводов','г'],['protein','белков','г'],['fat','жиров','г'],['kcal','энергии','ккал']].filter(([k])=>Number(goals[k])>0).map(([k,label,unit])=>label+' '+fmt(period==='month'?sums[k]/daysWithFood:sums[k],k==='kcal'?0:1)+' из '+fmt(goals[k],0)+' '+unit);return '<div class="banner" style="margin-top:14px"><b>Автоматическая сводка:</b> приёмов пищи '+eaten.length+', инъекций '+ins.length+', событий еды без близкого CGM '+gaps+'. '+(app.ill?'Отмечен режим болезни. ':'')+(comps.length?(period==='month'?'Среднее в дни с записями, а не за весь календарный месяц: ':'Сравнение с введённым ориентиром: ')+comps.map(esc).join('; ')+'. ': 'Ориентиры питания не заданы. ')+'Оценка достаточности питания зависит от полноты записей и индивидуального плана. По этим данным нельзя определять изменение дозы.</div>'}
function printReport(){if(native&&window.GlucoBridge?.exportPdfForPeriod){window.GlucoBridge.exportPdfForPeriod(app.reportPeriod==='month'?'month':'day',app.reportPeriod==='month'?app.reportMonth:app.reportDate);return}document.body.classList.add('printing-report');window.print();setTimeout(()=>document.body.classList.remove('printing-report'),1500)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-action]');if(!t)return;if(t.dataset.tab){navigate(t.dataset.tab);return}const a=t.dataset.action;switch(a){
case 'ill':toggleIll();break;case 'refresh':refresh();break;case 'gofoods':navigate('foods');break;case 'goDiary':navigate('diary');break;case 'goStats':navigate('stats');break;
case 'jumpMeal':navigate('diary');setTimeout(()=>document.getElementById('composer')?.scrollIntoView({behavior:'smooth'}),50);break;

function displayGlucoseNear(ts){
  const g=glucoseClosest(ts,12*60000);
  return g?fmt(g.mmol)+' '+esc(trendIcon(g.direction))+' <small>('+Math.round(Math.abs(g.ts-ts)/60000)+' мин от события)</small>':'нет близкого CGM';
}
function dailyObservation(rows){
  const taken=rows.filter(x=>x.type==='meal'&&(x.status!=='planned'&&x.status!=='started')),shots=rows.filter(x=>x.type==='insulin'),planned=rows.filter(x=>x.type==='meal'&&x.status==='planned');
  const data=[...taken,...shots];let paired=0,post=0;
  for(const m of taken){const a=glucoseClosest(m.ts-5*60000,15*60000),b=glucoseClosest(m.ts+120*60000,25*60000);if(a&&b&&b.ts>a.ts){paired++;post+=(b.mmol-a.mmol)}}
  const sums=sumMeal(taken),goals=app.profile?.nutrition||{};
  const lines=[];
  lines.push('Записано приёмов пищи: '+taken.length+', фактических инъекций: '+shots.length+', планов без подтверждения: '+planned.length+'.');
  lines.push('БЖУ: '+fmt(sums.protein)+' / '+fmt(sums.fat)+' / '+fmt(sums.carbs)+' г; '+fmt(sums.kcal,0)+' ккал.');
  if(Number(goals.kcal)>0) lines.push('Энергия: '+fmt(sums.kcal,0)+' из заданных '+fmt(goals.kcal,0)+' ккал, только по записям.');
  if(paired>=2)lines.push('В '+paired+' приёмах пищи есть пары CGM примерно до и через 2 часа; среднее изменение '+(post>=0?'+':'')+fmt(post/paired)+' ммоль/л. Причину изменения по этим парам установить нельзя.');
  else lines.push('Недостаточно пар CGM до и через 2 часа для сравнения реакции на еду.');
  if(data.filter(x=>!glucoseClosest(x.ts,12*60000)).length)lines.push('Для части событий нет близкого по времени показания CGM.');
  if(app.ill)lines.push('Сейчас включён режим болезни. Для исторического анализа нужен отдельный учёт начала и окончания эпизода.');
  return '<div class="card"><div class="h2">📋 Сводка дня</div><div class="muted">Автоматическое описание записей; не медицинское заключение и не ИИ-назначение.</div><div class="report-note">'+lines.map(esc).join('<br>')+'</div><div class="banner warning" style="margin-top:10px">Из дневника нельзя надёжно вывести, сколько инсулина следовало ввести. Не меняйте лечение по этой сводке.</div></div>';
}

function saveEditedEvent(){
  const current=eventById(app.editingEventId);if(!current)return;
  const reason=document.getElementById('editReason')?.value.trim()||'';
  if(!reason){notify('Укажи причину изменения');return}
  const ts=new Date(document.getElementById('editTime').value).getTime();
  if(!Number.isFinite(ts)||ts<946684800000){notify('Проверь дату и время');return}
  const updated={...current,ts};
  if(current.type==='insulin'){
    const units=rnum(document.getElementById('editUnits').value),step=penStepFor(document.getElementById('editInsType')?.value||current.insulinType||'short');
    const name=document.getElementById('editInsName').value.trim(),kind=document.getElementById('editInsType').value;
    if(!Number.isFinite(units)||units<=0||units>100||Math.abs(units/step-Math.round(units/step))>0.00001||!name||name.length>100){notify('Неверная доза, шаг или препарат');return}
    updated.units=units;updated.insulinName=name;updated.insulinType=kind;
  }else if(current.type==='meal'){
    updated.status=document.getElementById('editMealStatus').value;
    let its=parseItems(current.itemsJson||current.items);
    if(its.length){
      its=its.map((it,i)=>{const raw=rnum(document.querySelector('.edited-meal-grams[data-index="'+i+'"]')?.value);if(!Number.isFinite(raw)||raw<1||raw>3000)return null;
        const factor=Number(it.grams)>0?raw/Number(it.grams):NaN;if(!Number.isFinite(factor))return null;
        return {...it,grams:raw,carbs:Number(it.carbs||0)*factor,protein:Number(it.protein||0)*factor,fat:Number(it.fat||0)*factor,kcal:Number(it.kcal||0)*factor};});
      if(its.some(x=>!x)){notify('Проверь граммовки');return}
      const hits=allergyFlags(its);if(hits.length){notify('Убери продукты с возможным аллергеном');return}
      const x=sumMeal(its);
      Object.assign(updated,{items:its,itemsJson:JSON.stringify(its),grams:x.grams,carbs:x.carbs,protein:x.protein,fat:x.fat,kcal:x.kcal,name:its.map(it=>it.name).join(', ').slice(0,180)});
    }else{
      const grams=rnum(document.getElementById('editSingleGrams').value);if(!Number.isFinite(grams)||grams<=0||grams>5000||Number(current.grams)<=0){notify('Проверь граммовку');return}
      const factor=grams/Number(current.grams);updated.grams=grams;
      for(const k of ['carbs','protein','fat','kcal'])updated[k]=Number(current[k]||0)*factor;
    }
  }else{
    updated.note=document.getElementById('editNote').value.trim().slice(0,1000);
  }
  if(ts>Date.now()+(updated.type==='meal'&&updated.status==='planned'?7*86400000:600000)){
    notify('Для фактического события укажите прошедшее время');return;
  }
  const old={...current};delete old.editHistory;delete old.items;
  const log=editsOf(current);
  log.push({at:Date.now(),reason,previous:old});
  updated.editHistory=JSON.stringify(log.slice(-20));
  if(native){
    try{if(!window.GlucoBridge.updateEvent(String(current.id),JSON.stringify(updated))){notify('Не удалось обновить запись на Android');return}}
    catch(_){notify('Android-модуль редактирования недоступен');return}
  }
  const i=app.events.findIndex(x=>String(x.id)===String(current.id));
  app.events[i]=updated;
  persist();closeModal();render();notify('Исправление сохранено с историей');
}

function rescueItemsFromText(value){

    const n=rnum(raw);

function linkedShotsForMeal(id){return app.events.filter(x=>x.type==='insulin'&&String(x.note||'').includes('[meal:'+String(id)+']'));}
const v05OldDiary=renderDiary;
renderDiary=function(){
  const holder=document.createElement('div');holder.innerHTML=v05OldDiary();
  holder.querySelectorAll('.event').forEach(el=>{
    const id=el.querySelector('button[data-action="delete"]')?.dataset.id;
    const item=eventById(id);if(!item||item.type!=='meal')return;

        '<button class="btn ghost full" data-action="startMeal" data-id="'+esc(id)+'">🍽 Подтвердить начало еды</button>';
    }else if(status==='started'){
      const note=document.createElement('div');note.className='flow-pending';note.textContent='Еда начата · фактически съеденное ещё не уточнено';meta.appendChild(note);

const v05OldInsulinModal=insulinModal;

function shotForMeal(id){

const v05OldSaveIns=saveIns;
saveIns=function(){
  const id=app.activeMealShotId;
  if(!id){v05OldSaveIns();return}
  const original=eventById(id),p=app.profile||{},step=penStepFor(document.getElementById('insType')?.value||'short');
  const d=rnum(document.getElementById('insUnits')?.value),type=document.getElementById('insType')?.value,name=document.getElementById('insName')?.value.trim(),ts=new Date(document.getElementById('insTime')?.value).getTime();
  if(!original||linkedShotsForMeal(id).length)return notify('Проверьте, не записан ли укол уже');
  
  if(!Number.isFinite(d)||d<=0||d>100||Math.abs(d/step-Math.round(d/step))>0.00001||!['short','long'].includes(type)||!name||!Number.isFinite(ts)||ts>Date.now()+120000)return notify('Проверьте препарат, дозу, шаг ручки и время');
  app.activeMealShotId=null;
  addEvent({type:'insulin',name:'Инъекция',units:d,insulinType:type,insulinName:name,ts,note:'[meal:'+id+'] По плану еды '+original.name});
};
function startMeal(id){
  const e=eventById(id);if(!e||e.type!=='meal'||e.status!=='planned')return;
  modal('<div class="row"><h2>Начало еды</h2><button class="close" data-action="close">×</button></div><div class="banner">'+esc(e.name)+' · план '+fmt(e.grams,0)+' г. Вы подтвердите <b>начало</b>, но не то, что вся еда съедена.</div><div class="field"><label>Когда ребёнок начал есть</label><input id="actualMealTime" class="input" type="datetime-local" value="'+localIso(new Date())+'"></div><button class="btn full" data-action="confirmStartMeal" data-id="'+esc(id)+'">✓ Подтвердить начало еды</button>');
}
function saveMealUpdate(old,change,reason){
  const prev={...old};delete prev.editHistory;delete prev.items;
  const h=editsOf(old);h.push({at:Date.now(),reason,previous:prev});
  const update={...old,...change,editHistory:JSON.stringify(h.slice(-20))};
  if(native){try{if(!window.GlucoBridge.updateEvent(String(old.id),JSON.stringify(update)))return notify('Не удалось обновить запись на Android');}catch(err){return notify('Обновление записи недоступно: '+err.message)}}
  const index=app.events.findIndex(x=>String(x.id)===String(old.id));if(index<0)return;
  app.events[index]=update;persist();closeModal();render();notify('Изменение записано в историю');return true;
}
function confirmStartMeal(id){
  const old=eventById(id);if(!old||old.status!=='planned')return;
  const ts=new Date(document.getElementById('actualMealTime')?.value).getTime();
  if(!Number.isFinite(ts)||ts<946684800000||ts>Date.now()+120000)return notify('Укажите фактическое время');
  saveMealUpdate(old,{ts,status:'started'},'Подтверждено начало еды; масса пока предварительная');
}
function finishEntireMeal(id){
  const old=eventById(id);if(!old||old.status!=='started')return;
  if(!confirm('Ребёнок действительно съел всю запланированную порцию?'))return;
  saveMealUpdate(old,{status:'eaten'},'Подтверждено, что вся порция съедена');
}
function partialMeal(id){
  const meal=eventById(id);if(!meal||meal.type!=='meal'||!['started','eaten'].includes(meal.status))return;
  const items=parseItems(meal.itemsJson||meal.items),shot=linkedShotsForMeal(id).length;
  const itemRows=items.map((it,i)=>'<label class="edit-row"><span class="muted">'+esc(it.name)+'</span><input class="input v05-actual" data-index="'+i+'" type="number" min="0" max="3000" step="1" value="'+fmt(it.grams,0).replace(/\s/g,'')+'"> г</label>').join('');
  const opts=app.foods.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('');
  modal('<div class="row"><h2>Сколько съел по факту?</h2><button class="close" data-action="close">×</button></div>'+
    (shot?'<div class="banner danger">Инсулин уже введён. Если еды было меньше ожидаемого, возможна гипогликемия. Контролируйте глюкозу и действуйте по индивидуальному плану; приложение не назначает дополнительные действия.</div>':'')+
    '<div class="muted">Укажите фактическую массу каждого продукта. Можно добавить ещё один продукт, если он действительно был съеден.</div>'+itemRows+
    '<div class="h2" style="margin-top:15px">Дополнительный продукт (необязательно)</div><div class="field"><label>Выберите продукт</label><select id="extraFoodId" class="input"><option value="">Не добавлять</option>'+opts+'</select></div><div class="field"><label>Съедено дополнительно, г</label><input id="extraFoodGrams" class="input" type="number" min="1" max="3000" placeholder="0"></div>'+
    '<div class="field"><label>Комментарий</label><textarea id="actualMealComment" class="input" rows="2" placeholder="Например, оставил половину банана"></textarea></div>'+
    '<button class="btn full" data-action="saveActualMeal" data-id="'+esc(id)+'">Сохранить фактически съеденное</button>');
}
function saveActualMeal(id){
  const old=eventById(id);if(!old)return;
  const its=parseItems(old.itemsJson||old.items),updated=[];
  for(let i=0;i<its.length;i++){
    const grams=rnum(document.querySelector('.v05-actual[data-index="'+i+'"]')?.value);
    if(!Number.isFinite(grams)||grams<0||grams>3000)return notify('Проверьте фактические граммовки');
    if(grams===0)continue;
    const it=its[i],ratio=grams/Number(it.grams||0);if(!Number.isFinite(ratio))return notify('Ошибка исходной граммовки');
    updated.push({...it,grams,carbs:Number(it.carbs||0)*ratio,protein:Number(it.protein||0)*ratio,fat:Number(it.fat||0)*ratio,kcal:Number(it.kcal||0)*ratio,fiber:it.fiber!=null?Number(it.fiber)*ratio:null});
  }
  const extraId=document.getElementById('extraFoodId')?.value;
  if(extraId){const food=app.foods.find(x=>String(x.id)===extraId),grams=rnum(document.getElementById('extraFoodGrams').value);
    if(!food||!Number.isFinite(grams)||grams<=0||grams>3000)return notify('Укажите вес дополнительного продукта');
    updated.push({id:food.id,name:food.name,grams,carbs:food.carbs*grams/100,protein:food.protein*grams/100,fat:food.fat*grams/100,kcal:food.kcal*grams/100,fiber:food.fiber!=null?food.fiber*grams/100:null,source:food.source,allergens:allTags(food)});
  }
  if(allergyFlags(updated).length)return notify('Обнаружен возможный аллерген: проверьте и уберите продукт');
  const sum=sumMeal(updated),note=(document.getElementById('actualMealComment')?.value||'').trim().slice(0,500);
  if(!updated.length)return notify('Если ребёнок ничего не съел, нужна отдельная отметка о пропущенном приёме пищи. Не сохраняйте нулевую порцию как съеденную.');
  if(updated.length>40||sum.grams>5000)return notify('Слишком много продуктов/граммов');
  const planned=Number(old.grams)||0;
  if(saveMealUpdate(old,{items:updated,itemsJson:JSON.stringify(updated),name:updated.map(x=>x.name).join(', ').slice(0,180),...sum,fiber:gf011FiberTotal(updated).unknown?null:gf011FiberTotal(updated).value,status:'eaten',note:note?'Фактическая еда: '+note:(old.note||'')},'Уточнены фактически съеденные граммы и состав')&&linkedShotsForMeal(id).length&&sum.carbs<Number(old.carbs||0))alert('Записано меньше углеводов, чем планировалось, после укола. Следуйте согласованному с врачом плану на такой случай и внимательно контролируйте глюкозу.');
}

const BELARUS_2012_RANGES = [
 {min:1,max:3,group:'1–3 года',energy:[1200,1500],protein:[36,56],fat:[40,53],carbs:[175,210]},
 {min:4,max:6,group:'4–6 лет',energy:[1500,2000],protein:[49,75],fat:[50,71],carbs:[203,280]},
 {min:7,max:10,group:'7–10 лет',energy:[2100,2300],protein:[74,87],fat:[70,82],carbs:[284,322]},
 {min:11,max:13,sex:'male',group:'11–13 лет, мальчики',energy:[2400,2700],protein:[84,102],fat:[80,96],carbs:[324,378]},
 {min:11,max:13,sex:'female',group:'11–13 лет, девочки',energy:[2300,2500],protein:[81,94],fat:[77,89],carbs:[311,350]},
 {min:14,max:17,sex:'male',group:'14–17 лет, юноши',energy:[2800,3000],protein:[98,113],fat:[93,107],carbs:[378,420]},
 {min:14,max:17,sex:'female',group:'14–17 лет, девушки',energy:[2400,2600],protein:[84,98],fat:[80,92],carbs:[336,364]}
];
function belarusAgeRange(age,sex){
 const all=BELARUS_2012_RANGES.filter(r=>age>=r.min&&age<=r.max&&(r.sex===undefined||!sex||r.sex===sex));
 if(!all.length)return null;
 if(all.length===1)return all[0];
 const out={group:age+' лет, оба пола (диапазон)',min:age,max:age};
 for(const k of ['energy','protein','fat','carbs'])out[k]=[Math.min(...all.map(r=>r[k][0])),Math.max(...all.map(r=>r[k][1]))];
 return out;
}
function estimatedEnergy(profile){

 const sex=profile?.sex,activity=profile?.activity;
 if(!(a>=1&&a<=120&&w>0))return null;
 if(a<3)return {kcal:89*w-100+20,source:'IOM/DRI 2005, 13–35 мес.',isApprox:true};
 if(!Number.isFinite(h)||h<=0||!['male','female'].includes(sex)||!['sedentary','low','active','very'].includes(activity))return null;
 const idx={sedentary:0,low:1,active:2,very:3}[activity];
 let kcal;
 if(a<=18){
  const pa=(sex==='male'?[1,1.13,1.26,1.42]:[1,1.16,1.31,1.56])[idx];
  kcal=sex==='male'?(88.5-61.9*a)+pa*(26.7*w+903*h)+(a<9?20:25):(135.3-30.8*a)+pa*(10*w+934*h)+(a<9?20:25);
 }else{

<script>
/* GLUPOPAPA v0.27 — enhanced self-contained browser preview.

(function(){
'use strict';
const D=86400000, MIN=60000;
const q=(id)=>document.getElementById(id);
const toNum=x=>Number(x), finite=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x));
const v=x=>Number(x||0), round=(x,p=1)=>Number.isFinite(Number(x))?Number(Number(x).toFixed(p)):null;
const dk=t=>{const x=new Date(t);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dm=t=>new Date(t).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});
const hour=t=>new Date(t).getHours();
const cleanText=x=>esc(String(x??''));
const funNum=(n,unit='')=>finite(n)?fmt(n,2)+(unit?' '+unit:''):'—';
const isMeal=e=>e.type==='meal'&&!['planned','started'].includes(e.status);

const sum=(xs)=>xs.reduce((a,b)=>a+v(b),0);

const DEMO_SNAP={};
let demoActive=false,realSnapshot=null,weeklyMemory=[],lastReview=null;
let exportWindow='30',exportFrom='',exportTo='',exportShareConsent=false;
let selectedInsulinSlot='morning';
function getProfile(){return app.profile||{}}
function periodData(days=7,at=Date.now()){
 const start=at-days*D, end=at;
 const cgm=(app.readings||[]).filter(r=>finite(r.ts)&&finite(r.mmol)&&r.ts>=start&&r.ts<=end&&v(r.mmol)>1.5&&v(r.mmol)<35).sort((a,b)=>a.ts-b.ts);
 const events=(app.events||[]).filter(e=>finite(e.ts)&&e.ts>=start&&e.ts<=end).sort((a,b)=>a.ts-b.ts);

}
function assess(days=7){
 const p=periodData(days), readings=p.cgm,ev=p.events;
 const seen=new Set(),good=[];for(const r of readings){const k=Math.round(v(r.ts)/300000);if(!seen.has(k)){seen.add(k);good.push(r)}}
 const first=good[0]?.ts,last=good[good.length-1]?.ts;
 const coverage=round(100*good.length/(days*288),1);
 const food=ev.filter(isMeal),short=ev.filter(e=>isShot(e)&&e.insulinType==='short'),basal=ev.filter(e=>isShot(e)&&e.insulinType==='long');
 const insulin=ev.filter(isShot),allDays=[...new Set(insulin.map(e=>dk(e.ts)))];
 const dailyDoses=allDays.map(day=>({date:day,short:round(sum(short.filter(e=>dk(e.ts)===day).map(e=>e.units)),2),long:round(sum(basal.filter(e=>dk(e.ts)===day).map(e=>e.units)),2),total:round(sum(insulin.filter(e=>dk(e.ts)===day).map(e=>e.units)),2)}));
 const bins=[['Ночь · 00–06',0,6],['Утро · 06–12',6,12],['День · 12–18',12,18],['Вечер · 18–24',18,24]];
 const byTime=bins.map(([label,a,b])=>{const g=good.filter(r=>hour(r.ts)>=a&&hour(r.ts)<b);return {label,count:g.length,avg:round(g.length?sum(g.map(x=>x.mmol))/g.length:null),low:g.filter(x=>v(x.mmol)<3.9).length,high:g.filter(x=>v(x.mmol)>10).length,tir:round(g.length?100*g.filter(x=>v(x.mmol)>=3.9&&v(x.mmol)<=10).length/g.length:null)}});
 const nights=[];
 const dates=[...new Set(good.map(r=>dk(r.ts)))].sort();for(const date of dates){const all=good.filter(r=>dk(r.ts)===date&&hour(r.ts)<6);const valid=all.length>=48&&all.length<=75&&(all.at(-1).ts-all[0].ts)>=4*3600000;
 if(all.length)nights.push({date,count:all.length,valid,low:all.filter(x=>v(x.mmol)<3.9).length,high:all.filter(x=>v(x.mmol)>10).length,change:valid?round(v(all.at(-1).mmol)-v(all[0].mmol),1):null,mean:round(sum(all.map(x=>x.mmol))/all.length)});}
 const illness=ev.some(e=>e.type==='illness'||/болезн|температур|кетон|ill|sick/i.test(e.note||e.name||''))||app.ill;
 const activity=ev.some(e=>e.type==='activity'||/активност|спорт|прогулк|activity/i.test(e.note||e.name||''));
 const gaps=good.reduce((a,r,i)=>a+(i>0&&r.ts-good[i-1].ts>20*MIN?1:0),0);
 const lows=good.filter(x=>v(x.mmol)<3.9);
 const daysWithBasal=new Set(basal.map(e=>dk(e.ts))).size;
 // Ratios calculated from what WAS logged, not physiological/therapeutic ICR estimates.
 const recordedRatios={};
 for(const [key,label,startHour,endHour] of [['morning','Утро',5,11],['day','День',11,17],['evening','Вечер',17,24]]){
  const ratios=[];
  for(const meal of food){
   if(hour(meal.ts)<startHour||hour(meal.ts)>=endHour||!finite(meal.carbs)||v(meal.carbs)<=0)continue;
   const pair=short.filter(shot=>Math.abs(v(shot.ts)-v(meal.ts))<=45*MIN&&shot.doseReason==='meal');
   if(pair.length===1&&short.filter(shot=>Math.abs(v(shot.ts)-v(meal.ts))<=45*MIN).length===1){ratios.push(v(meal.carbs)/v(pair[0].units))}
  }
  ratios.sort((a,b)=>a-b);

 }
 let fiveDayAudit=null;
 try{if(typeof GFCare25!=='undefined'){
  const x=GFCare25.assess({profile:{...(app.profile||{}),timeZone:getProfile().timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone},events:app.events||[],readings:app.readings||[]},Date.now());

 }}catch(e){fiveDayAudit={status:'unavailable',error:String(e.message).slice(0,130)}}

 if(days<14)warn.push('Надёжная оценка типичных паттернов CGM обычно требует 14 суток с покрытием более 70%.');
 if(coverage<70)warn.push('Покрытие CGM менее 70% за выбранный период.');
 if(daysWithBasal<Math.min(days,5))warn.push('Записей базального инсулина меньше чем за 5 суток.');
 if(nights.filter(n=>n.valid).length<5)warn.push('Менее 5 ночей с непрерывным CGM.');
 if(lows.length)warn.push('В CGM есть значения ниже 3,9 ммоль/л; важно проверить эпизоды по индивидуальному плану.');

 if(activity)warn.push('Зарегистрирована активность: её отложенный эффект может влиять на ночную глюкозу.');
 if(gaps)warn.push('Пробелов CGM длиннее 20 минут: '+gaps+'.');
 warn.push('Нельзя отделить эффекты базального инсулина, короткого инсулина, еды, нагрузки и болезни только по ретроспективному графику.');
 return {generatedAt:Date.now(),start:p.start,end:p.end,days,cgm:good.length,coverage,gaps,evCount:ev.length,meals:food.length,short:short.length,basal:basal.length,daysWithBasal,daysWithAnyInsulin:allDays.length,dailyDoses,readings:first&&last?[first,last]:[],nights,byTime,illness,activity,lows:lows.length,mean:good.length?round(sum(good.map(x=>x.mmol))/good.length):null,tir:good.length?round(100*good.filter(x=>v(x.mmol)>=3.9&&v(x.mmol)<=10).length/good.length):null,tbr:good.length?round(100*lows.length/good.length):null,recordedRatios,fiveDayAudit,warn,kind:demoActive?'synthetic-demo':'real-user-history',medicalRecommendation:null};
}
function reviewCard(r,title='Автоанализ наблюдений'){
 if(!r)return '<div class="muted">Ещё нет анализа.</div>';
 return '<div class="card gf27-review"><div class="row"><div class="h2">'+title+'</div><span class="minipill">'+r.days+' дней</span></div>'+
 '<div class="gf27-metrics"><div><b>'+r.cgm+'</b><small>CGM, точек</small></div><div><b>'+funNum(r.coverage,'%')+'</b><small>Покрытие</small></div><div><b>'+r.daysWithBasal+'</b><small>Дней с длинным</small></div><div><b>'+r.meals+'</b><small>Приёмов пищи</small></div></div>'+
 '<div class="readout"><span>Средняя глюкоза</span><b>'+funNum(r.mean,'ммоль/л')+'</b></div><div class="readout"><span>Время в диапазоне 3,9–10</span><b>'+funNum(r.tir,'%')+'</b></div><div class="readout"><span>Ниже 3,9</span><b>'+funNum(r.tbr,'%')+'</b></div>'+
 '<div class="muted" style="margin:12px 0 4px">Сводка по частям суток — не расчёт ФЧИ.</div>'+r.byTime.map(x=>'<div class="readout"><span>'+x.label+' ('+x.count+' CGM)</span><b>'+funNum(x.avg,'ммоль/л')+'</b></div>').join('')+
 '<div class="muted" style="margin-top:12px">Соотношение записанных углеводов к введённому короткому (не УК и не рекомендуемая доза):</div>'+Object.values(r.recordedRatios||{}).map(x=>'<div class="readout"><span>'+cleanText(x.label)+' · '+x.paired+' пар</span><b>'+(x.median===null?'Мало данных':funNum(x.median,'г/ЕД')+' (факт)')+'</b></div>').join('')+
 '<div class="readout"><span>ФЧИ по чистым коррекциям</span><b>Не подтверждена</b></div>'+
 '<div class="muted">5-дневный исследовательский аудит: '+cleanText(r.fiveDayAudit?.status||'нет результата')+'; замечаний: '+(r.fiveDayAudit?.flagCount??'—')+'. Автоприменение запрещено.</div>'+
 '<details class="gf27-details"><summary>Ограничения и проверки ('+r.warn.length+')</summary><ul>'+r.warn.map(x=>'<li>'+cleanText(x)+'</li>').join('')+'</ul></details>'+
 '<div class="banner warning">Результат — ретроспективное наблюдение. Программа не изменила дозы или лечебные коэффициенты.</div></div>';
}
function weekStorageGet(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return weeklyMemory}}
function weekStorageSet(x){weeklyMemory=x.slice(0,100);try{localStorage.setItem(STORE_KEY,JSON.stringify(weeklyMemory))}catch(e){}}
function weeklyAuto(force=false){
 if(demoActive){lastReview=assess(7);lastReview.demo=true;return lastReview;}
 const previous=weekStorageGet();if(!force&&previous.length&&Date.now()-v(previous[0].generatedAt)<7*D){lastReview=previous[0];return lastReview;}
 const r=assess(7);r.automatic=!force;r.status='Для просмотра, без применения';lastReview=r;weekStorageSet([r,...previous].slice(0,52));return r;
}
function generateDemo(){
 const now=Date.now(), start=now-5*D+5*MIN, cgm=[], events=[];
 const foodNames=['Овсяная каша и яблоко','Гречка и курица','Суп, хлеб и салат','Йогурт и банан','Рис с рыбой'];
 for(let i=0;i<1440;i++){
   const ts=start+i*5*MIN,dt=new Date(ts),h=dt.getHours()+dt.getMinutes()/60,day=Math.floor((ts-start)/D);
   const mealSpike=(h,at,mag,dur)=>h>=at?mag*Math.exp(-Math.pow((h-at)/dur,2)):0;
   let level=6.5+1.1*Math.sin(2*Math.PI*h/24-.6)+.53*Math.sin(i*.23)+.21*Math.cos(i*.075)+mealSpike(h,8.1,3,1.3)+mealSpike(h,13,2.5,1.3)+mealSpike(h,19.1,2.7,1.5);
   if(day===2)level+=1.7; if(day===3&&h>=2&&h<4)level-=2.7;
   const mmol=round(Math.max(3.2,Math.min(14,level)),1),prior=i?cgm[i-1].mmol:mmol;
   const delta=mmol-prior, direction=delta>.11?'FortyFiveUp':delta<-.11?'FortyFiveDown':'Flat';
   cgm.push({ts,mmol,direction,source:'xDrip+ DEMO (генератор, не реальные данные)',isDemo:true});
 }
 const startLocal=new Date(start), midnight=new Date(startLocal.getFullYear(),startLocal.getMonth(),startLocal.getDate());
 let id=1;
 const add=e=>events.push({id:'DEMO-'+id++,demo:true,...e});
 for(let d=0;d<7;d++){
  const dayStart=midnight.getTime()+d*D;
  const dayDate=new Date(dayStart);
  const date=dk(dayStart);
  // Only events entirely contained within the five-day CGM interval.
  for(const [slot,at,units,site] of [['morning',8,3,'Живот'],['evening',20,2.5,'Бедро']]){
    const ts=dayStart+at*3600000+(d%3)*7*MIN;
    if(ts<start||ts>now)continue;
    add({type:'insulin',name:'Инъекция',insulinType:'long',insulinName:'Левемир',units,ts,site,doseReason:'basal',slot,recorded:true,note:'ДЕМО · фактическое введение'});
  }
  for(const [m,h,grams,carbs,ins] of [[0,8.17,200,38,2],[1,13,260,46,2.5],[2,19,240,39,2]]){
   const mealTs=dayStart+Math.round(h*60)*MIN;
   if(mealTs<start||mealTs>now)continue;
   const mealName=foodNames[(d+m)%foodNames.length];
   add({type:'meal',name:mealName,ts:mealTs,status:'eaten',grams,carbs,protein:round(16+m*3),fat:round(10+m*2),kcal:round(grams*1.45),fiber:round(grams*.012),itemsJson:JSON.stringify([{name:mealName,grams,carbs:100*carbs/grams,protein:100*(16+m*3)/grams,fat:100*(10+m*2)/grams,kcal:145}]),source:'ДЕМО запись факта'});
   const shotTs=mealTs-10*MIN;
   if(shotTs>start)add({type:'insulin',name:'Инъекция',ts:shotTs,insulinType:'short',insulinName:'НовоРапид',units:ins,site:(m%2?'Плечо':'Живот'),doseReason:'meal',source:'Фактическая запись · ДЕМО',note:'ДЕМО · короткий перед едой'});
  }
 }
 const illnessStart=start+2*D,illnessEnd=start+3*D;
 add({type:'illness',name:'Начало болезни',ts:illnessStart,note:'ДЕМО · условный эпизод болезни; не применять для лечения',phase:'start'});
 add({type:'illness',name:'Болезнь прошла',ts:illnessEnd,note:'ДЕМО · завершение эпизода',phase:'end'});
 add({type:'activity',name:'Прогулка',ts:start+1*D+16*3600000,note:'ДЕМО · 30 мин прогулки',durationMin:30});
 add({type:'note',name:'Наблюдение',ts:start+3*D+3*3600000,note:'ДЕМО · низкий CGM, требуется анализ причин'});
 return {readings:cgm,events:events.sort((a,b)=>a.ts-b.ts),profile:{age:7,weight:null,height:null,step:.5,allergies:'',shortInsulin:'НовоРапид',longInsulin:'Левемир',insulinPresets:{short:{name:'НовоРапид',step:.5},long:{name:'Левемир',step:.5}},gf27BasalPlan:{morning:null,evening:null,morningTime:'08:00',eveningTime:'20:00',source:'Не задан: ждём индивидуальный план врача'},coefficients:{icr:{morning:null,day:null,evening:null},isf:{morning:null,day:null,evening:null}}}};
}
function activateDemo(){
 if(native){notify('Тестовый набор доступен только в автономном HTML-просмотре, не меняет Android-дневник.');return}
 if(!demoActive)realSnapshot={events:app.events,readings:app.readings,profile:app.profile,ill:app.ill,illSince:app.illSince,mealDraft:app.mealDraft,mealDraftTime:app.mealDraftTime};

}
function leaveDemo(){if(!demoActive||!realSnapshot)return;Object.assign(app,realSnapshot);realSnapshot=null;demoActive=false;weeklyAuto(false);render();notify('Тестовая история отключена; реальные записи не изменились.');}

function statusCard(){return '<div class="gf27-demo-alert '+(demoActive?'gf27-demo-on':'')+'"><div><b>'+(demoActive?'🧪 РЕЖИМ ТЕСТА · 5 ДНЕЙ':'🔒 Просмотр реальных записей')+'</b><div class="muted">'+(demoActive?'Все значения CGM и инъекции вымышлены. Изменения не сохраняются в настоящий дневник.':'Для проверки можно включить отдельную тестовую историю.')+'</div></div><button class="btn ghost" data-action="'+(demoActive?'gf27LeaveDemo':'gf27Demo')+'">'+(demoActive?'Выход':'Демо 5 дней')+'</button></div>'}

}
function basalCard(){const plan=basalPlan(),day=basalDay();let result='<div class="card gf27-basal"><div class="row"><div><div class="h2">💉 Длинный инсулин · утро и вечер</div><div class="muted">Расписание и фактические введения — разные записи</div></div><button class="btn ghost" data-action="gf27EditBasalPlan">План</button></div>';
 for(const [slot,label,t] of [['morning','Утро',plan.morningTime],['evening','Вечер',plan.eveningTime]]){

  result+='<div class="gf27-basal-row"><div><b>'+label+' · '+cleanText(t)+'</b><div class="muted">'+cleanText(dose)+'</div>'+(actual.length?actual.map(e=>'<div class="gf27-actual">✓ '+when(e.ts)+' · '+fmt(e.units,2)+' ЕД · '+cleanText(e.site||'место не записано')+'</div>').join(''):'<div class="gf27-scheduled">○ Запланировано · введение не подтверждено</div>')+'</div><button class="btn secondary" data-action="gf27LogBasal" data-slot="'+slot+'">Записать факт</button></div>';
 }
