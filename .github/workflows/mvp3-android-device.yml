name: GlucoPapa MVP3 Android Device QA

on:
  workflow_call:
    inputs:
      api:
        required: true
        type: number
      extended:
        type: boolean
        default: false
      artifact-suffix:
        type: string
        default: ''
      image:
        type: string
        default: default
      publish-pilot-apk:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_QA_API: ${{ inputs.api }}
      ANDROID_QA_EXTENDED: ${{ inputs.extended }}
      ANDROID_QA_IMAGE: ${{ inputs.image }}
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glucopapa-android-qa"
          printf 'EVIDENCE=%s/glucopapa-android-qa\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify locked Android candidate
        run: sha256sum --check --quiet qa/mvp3-android/android-source.sha256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Add Android command-line tools to PATH
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: 'false'
      - name: Prepare SDK and KVM
        shell: bash
        run: |
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          [[ "$ANDROID_QA_IMAGE" == default || "$ANDROID_QA_IMAGE" == google_apis ]]
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' "system-images;android-$ANDROID_QA_API;$ANDROID_QA_IMAGE;x86_64" < /dev/null
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Assemble candidate
        working-directory: android-mvp3
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          assemble=(gradle --no-daemon --console=plain -Pandroid.builder.sdkDownload=false :app:assembleDebug :app:assembleFixture :app:assembleFixtureAndroidTest)
          if ! "${assemble[@]}" 2>&1 | tee "$EVIDENCE/build.log"; then
            grep -E 'Could not (resolve all artifacts|find|GET|HEAD)' "$EVIDENCE/build.log"
            sleep "$((20 + ANDROID_QA_API % 17))"
            "${assemble[@]}" --refresh-dependencies 2>&1 | tee -a "$EVIDENCE/build.log"
          fi
          gradle --no-daemon --console=plain -Pandroid.builder.sdkDownload=false -PglucopapaTestTarget=debug :app:assembleDebugAndroidTest
          python3 ../qa/mvp3-full/integrity.py --apk app/build/outputs/apk/debug/app-debug.apk | tee "$EVIDENCE/assets.json"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk | tee "$EVIDENCE/signature.log"
      - name: Check installed WebView and SQLite
        shell: bash
        run: bash qa/mvp3-android/run-on-emulator.sh
      - name: Stage the tested ordinary debug APK
        if: inputs.publish-pilot-apk
        shell: bash
        run: |
          archive="$RUNNER_TEMP/glucopapa-android-download"
          mkdir -p "$archive"
          filename=Glucopapa-V2-0.3.16-qa-debug.apk
          cp android-mvp3/app/build/outputs/apk/debug/app-debug.apk "$archive/$filename"
          cd "$archive"
          sha256sum "$filename" > SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$(cut -d ' ' -f 1 "$EVIDENCE/installed-apk.sha256")"
          sdktools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdktools/aapt" dump badging "$filename" | sed -n '1p' > package.txt
          grep -F "package: name='com.glucopapa.shell' versionCode='11' versionName='0.3.16-qa'" package.txt
          "$sdktools/apksigner" verify --verbose --print-certs "$filename" > signature.txt
      - name: Publish the tested ordinary debug APK
        if: inputs.publish-pilot-apk
        uses: actions/upload-artifact@v4
        with:
          name: Glucopapa-V2-0.3.16-qa-debug
          path: ${{ runner.temp }}/glucopapa-android-download/
          if-no-files-found: error
          retention-days: 90
      - name: Attach synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlucoPapa-MVP3-API-${{ inputs.api }}${{ inputs.artifact-suffix }}-evidence
          path: |
            ${{ runner.temp }}/glucopapa-android-qa/*.log
            ${{ runner.temp }}/glucopapa-android-qa/*.json
            ${{ runner.temp }}/glucopapa-android-qa/*.sha256
            ${{ runner.temp }}/glucopapa-android-qa/*.png
            ${{ runner.temp }}/glucopapa-android-qa/checks/result.json
            ${{ runner.temp }}/glucopapa-android-qa/checks/webview.txt
            ${{ runner.temp }}/glucopapa-android-qa/checks/ui-latest.xml
            ${{ runner.temp }}/glucopapa-android-qa/checks/*/screen.png
          if-no-files-found: warn
          retention-days: 7
