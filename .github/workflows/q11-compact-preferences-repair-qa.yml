          assert len(expected)==len(set(expected))==16
          s=s.replace(a,"a=check('integrated',(old|earlier)-{legacy}|{new}|set("+repr(expected)+"))")
          s=s.replace("'additional_case_ids':1","'additional_case_ids':17,'q11_cases':13,'restore_fence_cases':2,'epoch_cases':2,'webview_cases':2,'shell_route_cases':2,'compact_cases':1,'preference_cases':1")
          (Path(os.environ['RUNNER_TEMP'])/'q11_verify.py').write_text(s)
          PY
          python3 "$RUNNER_TEMP/q11_verify.py" | tee qa-results/q11/gate.json
          test -f qa-results/q11/crash-buffer.log
          test "$(cat qa-results/q11/runner-exit.txt)" = 0
          if grep -E 'Cmdline: org\.glukopapa\.v3\.m00|Process: org\.glukopapa\.v3\.m00' qa-results/q11/crash-buffer.log; then
            echo 'App process crash in emulator crash buffer'; exit 1
          fi
      - name: Upload isolated native QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q11-native-read-only-qa-evidence
          path: |
            qa-results/v042/
            qa-results/q11/
            q07-ci-logs/
          if-no-files-found: warn
