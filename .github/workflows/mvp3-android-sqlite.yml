name: GlucoPapa MVP3 Android SQLite QA

on:
  push:
    branches:
      - qa/mvp3-android-sqlite
      - qa/mvp3-prototype-integration
      - qa/mvp3-calculators-20261119
      - qa/mvp3-cl039-cl040-20261119
      - qa/mvp3-cl041-20261119
      - qa/mvp3-cl042-formula-recovery-20261119
      - qa/mvp3-high-analytics-20261120
      - qa/mvp3-low-20261120
      - qa/mvp3-phone-feedback-20261120
      - qa/mvp3-unified-feedback-20261120

permissions:
  contents: read

concurrency:
  group: mvp3-android-sqlite-${{ github.ref }}${{ contains(github.event.head_commit.message, '[qa-matrix]') && '-matrix' || '' }}
  cancel-in-progress: true

jobs:
  node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify assets and run synthetic Node regressions
        shell: bash
        run: |
          mkdir -p qa-evidence
          python3 qa/mvp3-full/integrity.py | tee qa-evidence/integrity.json
          node --test --test-reporter=tap qa/mvp3-full/*.test.cjs > qa-evidence/node.tap
          node --test --test-reporter=tap qa/mvp3-calculators/*.test.cjs > qa-evidence/calculators.tap
          if [[ -d qa/mvp3-cl040 ]]; then
            node --test --test-reporter=tap qa/mvp3-cl040/*.test.cjs > qa-evidence/cl040.tap
          fi
          if [[ -d qa/mvp3-cl041 ]]; then
            node --test --test-reporter=tap qa/mvp3-cl041/*.test.cjs > qa-evidence/cl041.tap
          fi
          if [[ -d qa/mvp3-cl042 ]]; then
            node --test --test-reporter=tap qa/mvp3-cl042/*.test.cjs > qa-evidence/cl042.tap
          fi
          if [[ -d qa/mvp3-high-analytics ]]; then
            python3 qa/mvp3-high-analytics/derive_high_interface.py --check
            node --test --test-reporter=tap qa/mvp3-high-analytics/*.test.cjs > qa-evidence/high-analytics.tap
          fi
          if [[ -d qa/mvp3-low ]]; then
            python3 qa/mvp3-low/derive.py --check
            node --test --test-reporter=tap qa/mvp3-low/*.test.cjs > qa-evidence/low.tap
            node qa/mvp3-low/replay.cjs > qa-evidence/low-replay.json
          fi
          if [[ -d qa/mvp3-unified ]]; then
            node --test --test-reporter=tap qa/mvp3-unified/*.test.cjs > qa-evidence/unified.tap
          fi
          if [[ -d qa/mvp3-pilot ]]; then
            node --test --test-reporter=tap qa/mvp3-pilot/*.test.cjs > qa-evidence/pilot.tap
            node qa/mvp3-pilot/replay-90d.cjs > qa-evidence/pilot-replay-90d.json
          fi
          if [[ -d qa/mvp3-feedback ]]; then
            node --test --test-reporter=tap qa/mvp3-feedback/*.test.cjs > qa-evidence/feedback.tap
          fi
          if [[ -d qa/mvp3-unified-feedback ]]; then
            python3 qa/mvp3-unified-feedback/derive_meal_interface.py --check
            node --test --test-reporter=tap qa/mvp3-unified-feedback/*.test.cjs > qa-evidence/meal-timing.tap
          fi
          node qa/mvp3-calculators/stress.cjs qa-evidence > qa-evidence/stress.log
          node qa/mvp3-calculators/physio-stress.cjs qa-evidence > qa-evidence/physio.log
          if [[ -f qa/mvp3-unified-feedback/physio-incomplete.cjs ]]; then
            node qa/mvp3-unified-feedback/physio-incomplete.cjs qa-evidence/physio-cases.jsonl > qa-evidence/physio-incomplete.json
          fi
          gzip -n qa-evidence/*-cases.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlucoPapa-MVP3-Node-evidence
          path: qa-evidence/
          retention-days: 7

  android-15:
    uses: ./.github/workflows/mvp3-android-device.yml
    with:
      api: 35
      artifact-suffix: '-core'
      publish-pilot-apk: ${{ github.ref == 'refs/heads/qa/mvp3-phone-feedback-20261120' || (github.ref == 'refs/heads/qa/mvp3-unified-feedback-20261120' && contains(github.event.head_commit.message, '[qa-apk]')) }}
      apk-version: ${{ github.ref == 'refs/heads/qa/mvp3-unified-feedback-20261120' && '0.3.18-qa' || '0.3.17-qa' }}
      apk-code: ${{ github.ref == 'refs/heads/qa/mvp3-unified-feedback-20261120' && 13 || 12 }}

  android-15-extended:
    if: github.ref != 'refs/heads/qa/mvp3-unified-feedback-20261120' || contains(github.event.head_commit.message, '[qa-apk]') || contains(github.event.head_commit.message, '[qa-matrix]')
    uses: ./.github/workflows/mvp3-android-device.yml
    with:
      api: 35
      extended: true

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.ref == 'refs/heads/qa/mvp3-unified-feedback-20261120' && !contains(github.event.head_commit.message, '[qa-apk]') && !contains(github.event.head_commit.message, '[qa-matrix]') && '[36]' || '[31,34,36]') }}
    uses: ./.github/workflows/mvp3-android-device.yml
    with:
      api: ${{ matrix.api }}
      extended: true
