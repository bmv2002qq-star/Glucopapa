name: GlucoPapa MVP3 Android SQLite QA

on:
  push:
    branches:
      - qa/mvp3-android-sqlite

permissions:
  contents: read

concurrency:
  group: mvp3-android-sqlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-15:
    uses: ./.github/workflows/mvp3-android-device.yml
    with:
      api: 35

  compatibility:
    needs: android-15
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34, 36]
    uses: ./.github/workflows/mvp3-android-device.yml
    with:
      api: ${{ matrix.api }}
