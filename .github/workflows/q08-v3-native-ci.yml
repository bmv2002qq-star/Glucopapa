name: Q08 Levemir native contracts Android 15 QA
on:
  push:
    branches:
      - 'qa/v3-q08-*'
    paths:
      - '.github/workflows/q08-v3-native-ci.yml'
      - 'qa-transfer/q08/**'
  workflow_dispatch:
concurrency:
  group: q08-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  q08-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout Q07 QA branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore SHA verified Q04 baseline and Q05 overlays
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          p=sorted(Path('qa-transfer/q04').glob('q04-part-*.b64'))
          assert len(p)==19, f'Q04 base files {len(p)}'
          b=base64.b64decode(''.join(''.join(x.read_text().split()) for x in p),validate=True)
          assert hashlib.sha256(b).hexdigest()=='4ec4fcd5c8a08cebccee728905db4d988eab35ecfa60ecf4a15d98997266e6c6', 'Q04 BASE BAD SHA'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              z.extractall('q07-ci')
          PY
          install -D qa-transfer/q04/Q04WebViewSmokeInstrumentedTest.kt q07-ci/android-app/app/src/androidTest/java/org/glukopapa/v3/m00/Q04WebViewSmokeInstrumentedTest.kt
          install -D qa-transfer/q04/test_q04_legacy_restore_host.py q07-ci/tests/test_q04_legacy_restore_host.py
          install -D qa-transfer/q04/Q04_v012_GfV3Q04MealFacts.kt q07-ci/android-app/app/src/main/java/org/glukopapa/v3/m00/GfV3Q04MealFacts.kt
          install -D qa-transfer/q04/Q04_v012_MainActivity.kt q07-ci/android-app/app/src/main/java/org/glukopapa/v3/m00/MainActivity.kt
          install -D qa-transfer/q04/Q04_v012_writer_grants_v0.12.json q07-ci/android-app/app/src/main/assets/db/writer_grants_v0.12.json
          install -D qa-transfer/q04/Q04_v012_Q04NativeDraftsInstrumentedTest.kt q07-ci/android-app/app/src/androidTest/java/org/glukopapa/v3/m00/Q04NativeDraftsInstrumentedTest.kt
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          p=sorted(Path('qa-transfer/q05').glob('q05-part-*.b64'))
          assert len(p)==5, f'Q05 overlay parts {len(p)}'
          b=base64.b64decode(''.join(''.join(x.read_text().split()) for x in p),validate=True)
          assert hashlib.sha256(b).hexdigest()=='862e3c9e566c7c7d96cd4ba68fc167c9fbdd3244db7d9eba9c73e84b28c45b0a', 'Q05 OVERRIDE HASH INVALID'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              assert len(z.namelist())==22
              z.extractall('q07-ci')
          print('Q05 OVERLAY SHA',hashlib.sha256(b).hexdigest())
          PY
          python3 - <<'PY'
          import base64,hashlib,io,zipfile
          from pathlib import Path
          parts=sorted(Path('qa-transfer/q06-safety-v012').glob('q06-part-*.b64'))
          assert len(parts)==3, f'Q06 overlay parts {len(parts)}'
          payload=base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True)
          assert hashlib.sha256(payload).hexdigest()=='8ee0c7f2576bb6bd78e326dd14df9752c63e0e0a454a0c1127133180134a4472', 'Q06_OVERLAY_SHA_MISMATCH'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert z.testzip() is None, 'Q06_OVERLAY_ZIP_BAD'
              z.extractall('q07-ci')
          print('Q06_CONTEXT_ONLY_OVERLAY_VERIFIED',hashlib.sha256(payload).hexdigest())
          PY
      - name: Apply hash-verified Q07 native-only RinFast overlay (not auto accepted)
        shell: bash
        run: |
          set -euxo pipefail
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_SOURCE_ONLY_OVERLAY_20261124.patch"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          m=json.loads(Path('qa-transfer/q07/Q07_QA_MANIFEST_20261124.json').read_text())
          assert len(m['changes'])==12
          for f in m['changes']:
              p=Path('q07-ci')/f['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==f['after_sha256'],p
          print('Q07_REPLAY_VERIFIED: 12/12 source SHA', m['status'])
          PY
      - name: Apply Q07 QA lifecycle and native integration tests
        shell: bash
        run: |
          set -euxo pipefail
          echo 'e79ecb4a069c57f77e788840c0c04a235b8811d0b62c46293835a86fc07ef466  qa-transfer/q07/Q07_ANDROID15_QA_ISOLATION_20261124.patch' | sha256sum -c -
          echo 'b2240e7ae36f9f254343179334c640717eb77df64a6706a8b065519b531d5506  qa-transfer/q07/Q07_ANDROID15_NATIVE_INTEGRATION_TESTS_20261124.patch' | sha256sum -c -
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_ANDROID15_QA_ISOLATION_20261124.patch"
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_ANDROID15_NATIVE_INTEGRATION_TESTS_20261124.patch"
          echo '26e856ce126bcaca8a57b4b858ee6e2aecb48cdd684ce5140a40d48e72b3acc0  qa-transfer/q07/Q07_ANDROID15_WEBVIEW_AND_OWNER_PATCH_20261124.patch' | sha256sum -c -
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_ANDROID15_WEBVIEW_AND_OWNER_PATCH_20261124.patch"
          echo 'd9cc724325da755196d1917c9a655b4c5d422b7c8fadf8d489bdd467dd722995  qa-transfer/q07/Q07_RINFAST_OWNER_WRITER_HARDENING_20261124.patch' | sha256sum -c -
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_RINFAST_OWNER_WRITER_HARDENING_20261124.patch"
          echo 'e8aaad3a29c4c9b584651135ac86312cd2861277074e51d15e390940ee3adb21  qa-transfer/q07/Q07_RUNTIME_EVENT_ID_AND_AUDIT_TEST_FIX_20261124.patch' | sha256sum -c -
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_RUNTIME_EVENT_ID_AND_AUDIT_TEST_FIX_20261124.patch"
      - name: Apply Q07 explicit native owner activation overlay
        shell: bash
        run: |
          set -euxo pipefail
          echo 'SHA-verified Q07 owner activation source (never auto-activate at startup)'
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_NATIVE_OWNER_ACTIVATION_v012.patch"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('qa-transfer/q07/Q07_NATIVE_OWNER_ACTIVATION_v012_MANIFEST.json').read_text())
          assert len(m['sourceSha256'])==5
          for e in m['sourceSha256']:
              p=Path('q07-ci')/e['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256'],p
          print("Q07_OWNER_ACTIVATION_SOURCE_SHA_5of5_PASS")
          PY
      - name: Check WebView v0.1.2 activation no-write contract regression
        shell: bash
        run: |
          set -euxo pipefail
          echo '4454907cfd90b88c487eb2f9217920b298a7a88d048dcb4f8078a2990cd91f09  qa-transfer/q07/Q07_v012_WEBVIEW_PENDING_NATIVE_ACTIVATION_TEST_FIX_20261124.patch' | sha256sum -c -
          patch -d q07-ci -p0 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q07/Q07_v012_WEBVIEW_PENDING_NATIVE_ACTIVATION_TEST_FIX_20261124.patch"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('qa-transfer/q07/Q07_v012_WEBVIEW_TEST_FIX_MANIFEST_20261124.json').read_text())
          p=Path('q07-ci')/manifest['testFile']
          assert p.is_file()
          assert hashlib.sha256(p.read_bytes()).hexdigest()==manifest['updatedSha256']
          print('Q07_WEBVIEW_V012_VERIFIED',manifest['finding'])
          PY
      - name: Q07 Q06 Q05 Q04 Q03 host and source regression
        shell: bash
        run: |
          set -euxo pipefail
          cd q07-ci
          mkdir -p ../q07-ci-logs
          exec > >(tee -a ../q07-ci-logs/host.log) 2>&1
          python3 tests/test_q05_schema_host.py
          python3 tests/test_q05_static_contract.py
          python3 ../qa-transfer/q06/test_q06_ci_contract.py
          python3 ../qa-transfer/q06-safety-20261124/test_q06_failclosed_static.py
          python3 tests/test_q06_q04_integration_structure.py
          python3 tests/test_q04_legacy_restore_host.py
          python3 tests/test_q04_sqlite_contract.py
          node tests/test_q04_native_adapter_contract.js
          cd tests/q03/tests
          node normalizer_node_tests.js
          node stress_q03.js
      - name: Apply SHA-verified Q08 candidate (no registry activation, no live dose calculation)
        shell: bash
        run: |
          set -euxo pipefail
          echo '48eee3cceeb7bf7c91ce88764727408df9628d89242d6b4d0dc1da864ce5bf7e  qa-transfer/q08/Q08_native_source_only_v042.patch' | sha256sum -c -
          cd q07-ci
          git apply --check "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_native_source_only_v042.patch"
          git apply "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_native_source_only_v042.patch"
      - name: Apply Q08 v043 native UI and owner confirmation overlay
        shell: bash
        run: |
          set -euo pipefail
          cat qa-transfer/q08/q08-ui-v043-part-*.patch > /tmp/q08-ui-v043.patch
          echo '4ffbe56c218265b044c48a314e90939d052770cb1d3d6b5e48bcb32edd14d3e5  /tmp/q08-ui-v043.patch' | sha256sum -c -
          patch -d q07-ci -p1 --batch --forward --dry-run -i /tmp/q08-ui-v043.patch
          patch -d q07-ci -p1 --batch --forward -i /tmp/q08-ui-v043.patch
      - name: Apply v044 indexed CGM history and verify every changed source
        shell: bash
        run: |
          set -euo pipefail
          echo '52a55c0b85b8f5269d46550c07455654d3db7a871c549e7de9197d0ed4048dbc  qa-transfer/q08/Q08_indexed_history_overlay_v044.patch' | sha256sum -c -
          patch -d q07-ci -p1 --batch --forward --dry-run -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_indexed_history_overlay_v044.patch"
          patch -d q07-ci -p1 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_indexed_history_overlay_v044.patch"
          echo '1f977c2ebed00bbf319ab2276b4d1fb902b12ed1c4a65b8870b55b9fce098360  qa-transfer/q08/Q08_v044_SOURCE_SHA.json' | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('qa-transfer/q08/Q08_v044_SOURCE_SHA.json').read_text())
          assert len(m['changes'])==13
          for x in m['changes']:
              p=Path('q07-ci')/x['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p
          print('Q08_V044_SOURCE_SHA_13of13_PASS')
          PY
      - name: Apply v045 dialog instrumentation and explicit activation lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          echo '9cfd03f45936fb99965f36c8e64cdfa591723fb305bdf71330066806899d74c6  qa-transfer/q08/Q08_v045_dialog_and_lifecycle.patch' | sha256sum -c -
          patch -d q07-ci -p1 --batch --forward --dry-run -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_v045_dialog_and_lifecycle.patch"
          patch -d q07-ci -p1 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_v045_dialog_and_lifecycle.patch"
          echo 'c3d4ea7761fc4db1ef81c2372ae09607fa73a4358281548c27b43eea14b261fe  qa-transfer/q08/Q08_v045_SOURCE_SHA.json' | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('qa-transfer/q08/Q08_v045_SOURCE_SHA.json').read_text())
          assert len(m['changes'])==13
          for x in m['changes']:
              p=Path('q07-ci')/x['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p
          print('Q08_V045_SOURCE_SHA_13of13_PASS')
          PY
      - name: Apply v046 additional actual owner queue and profile history timezone
        shell: bash
        run: |
          set -euo pipefail
          echo 'd9ec109f79cdee6604b30e942b2907ed9bd5fd2dfcd8bec56f4fb9a7c526b960  qa-transfer/q08/Q08_v046_additional_and_timezone.patch' | sha256sum -c -
          patch -d q07-ci -p1 --batch --forward --dry-run -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_v046_additional_and_timezone.patch"
          patch -d q07-ci -p1 --batch --forward -i "$GITHUB_WORKSPACE/qa-transfer/q08/Q08_v046_additional_and_timezone.patch"
          echo '74200d639cd172938df22ebf709dfc400d5feabe70e2bf60eeebc324953d53a8  qa-transfer/q08/Q08_v046_SOURCE_SHA.json' | sha256sum -c -
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('qa-transfer/q08/Q08_v046_SOURCE_SHA.json').read_text())
          assert len(m['changes'])==13
          for x in m['changes']:
              p=Path('q07-ci')/x['path']
              assert p.is_file(),p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'],p
          print('Q08_V046_SOURCE_SHA_13of13_PASS')
          PY
      - name: Q08 v042 exact UTC and transport regression (synthetic fixtures only)
        shell: bash
        run: |
          set -euo pipefail
          node --test qa-transfer/q08/v042/tests/test_review.js
      - name: Compile Android Q08 candidate and instrumented tests
        shell: bash
        run: |
          set -euxo pipefail
          cd q07-ci/android-app
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon 2>&1 | tee ../../q07-ci-logs/build.log
      - name: Enable runner KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 Q08 and baseline regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash -o pipefail -c 'cd q07-ci/android-app && gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon 2>&1 | tee ../../q07-ci-logs/emulator.log'
      - name: Verify Q08 and baseline Android case identities and results
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          echo 'c79a629a0f47dbe4c7c948167215bf1fd326a092e28e8e5a05b17c1672efa64d  qa-transfer/q08/verify_q08_android_xml_v046.py' | sha256sum -c -
          mkdir -p qa-results/q08
          python3 qa-transfer/q08/verify_q08_android_xml_v046.py q07-ci/android-app/app/build/outputs/androidTest-results/connected | tee qa-results/q08/gate.json
      - name: Upload Android Q08 APK and XML proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q08-native-ci-evidence
          path: |
            q07-ci/android-app/app/build/outputs/apk/debug/
            q07-ci/android-app/app/build/outputs/apk/androidTest/debug/
            q07-ci/android-app/app/build/outputs/androidTest-results/
            q07-ci/android-app/app/build/reports/androidTests/
          if-no-files-found: warn
      - name: Collect Q07 run-specific test results without branch push
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p qa-results/q07
          python3 - <<'PYRESULT'
          import json, os, glob, pathlib, xml.etree.ElementTree as E
          d=pathlib.Path('qa-results/q07')
          result={'run_id':os.getenv('GITHUB_RUN_ID'),'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT'),
              'sha':os.getenv('GITHUB_SHA'),'workflow':os.getenv('GITHUB_WORKFLOW'),
              'result_source':'native Android instrumentation XML, if present',
              'test_xml_files':[],'total':0,'failures':0,'errors':0,'skipped':0}
          for x in glob.glob('q07-ci/android-app/app/build/outputs/androidTest-results/connected/**/*.xml',recursive=True):
              try:
                  r=E.parse(x).getroot();count=int(r.get('tests','0'))
                  result['test_xml_files'].append({'file':os.path.basename(x),'tests':count,'failures':int(r.get('failures','0')),
                     'errors':int(r.get('errors','0')),'skipped':int(r.get('skipped','0'))})
                  for k in ('total','failures','errors','skipped'):
                      result[k]+=count if k=='total' else int(r.get(k,'0'))
              except Exception as e:result.setdefault('parse_errors',[]).append(str(e))
          for name in ('host','build','emulator'):
              f=pathlib.Path('q07-ci-logs')/(name+'.log')
              if f.exists():
                  (d/(name+'_tail.txt')).write_text('\n'.join(f.read_text(errors='replace').splitlines()[-350:]))
                  result[name+'_log_present']=True
              else:result[name+'_log_present']=False
          result['android_xml_found']=bool(result['test_xml_files'])
          gate=pathlib.Path('qa-results/q08/gate.json')
          result['gate_passed']=False
          if gate.exists():
              try:
                  proof=json.loads(gate.read_text())
                  result['gate_passed']=proof.get('gate_passed') is True
                  result['q08_proof']=proof
              except Exception as e: result['gate_error']=str(e)
          (d/'latest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PYRESULT
          # Evidence is uploaded per run below; never rewrite a shared "latest.json"
          # in the branch, which races with other parallel QA runs and can go stale.
          echo "Q07_RUN_SPECIFIC_JSON_READY"
      - name: Upload Q07 per-run JSON and trace logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q08-native-run-results
          path: |
            qa-results/q07/
            qa-results/q08/
          if-no-files-found: warn
