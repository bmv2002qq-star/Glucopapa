name: GlukoPapa V3 Q02 encrypted SQLite backup - QA only
on:
  push:
    branches:
      - qa/v3-q02-encrypted-backup-20261123
    paths:
      - .github/workflows/q02-v3-backup.yml
      - qa/v3-q02-backup/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q02-v3-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  q02-emulator-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Q01 approved baseline + Q02 native implementation and instrumented regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q02-runtime/evidence"
          python3 - <<'PY'
          import hashlib,json,base64,os,zipfile,io
          from pathlib import Path
          source=Path('qa/v3-q01-integration/archive.parts')
          manifest=json.loads((source/'MANIFEST.json').read_text('utf-8'))
          parts=[]
          for item in manifest['parts']:
              raw=(source/item['name']).read_text('ascii')
              assert hashlib.sha256(''.join(raw.split()).encode('ascii')).hexdigest()==item['sha256']
              assert hashlib.sha256(raw.encode('ascii')).hexdigest()==item['file_sha256']
              parts.append(''.join(raw.split()))
          data=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(data).hexdigest()==manifest['archive_sha256']
          assert manifest['archive_sha256']=='70bfbc23562b26010f5c75085fb7e177bd9c30aeadeea8a2605cacaf18482337'
          target=Path(os.environ['RUNNER_TEMP'])/'q02-runtime'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for info in z.infolist():
                  relative=info.filename
                  p=(target/'source'/relative).resolve()
                  assert p.is_relative_to((target/'source').resolve())
                  if not info.is_dir():
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(info))
          print('Q01_ORIGINAL_PROJECT_SHA_PASS',hashlib.sha256(data).hexdigest())
          PY
          # Separate unapproved Q01 integration adapter v0.2.1: bounded daily factors.
          # Never edit approved GFSettings/TimeGrid standalone mathematical sources.
          echo "a1dd6967908b9e42a08c0ea4896b70a6f2a7632006d5336a1ec94d46df1d331a  qa/v3-q01-emulator/overlay/GfV3SettingsTrustedAdapter.kt" | sha256sum -c -
          cp qa/v3-q01-emulator/overlay/GfV3SettingsTrustedAdapter.kt "$RUNNER_TEMP/q02-runtime/source/app/src/main/java/org/glukopapa/v3/m00/GfV3SettingsTrustedAdapter.kt"
          echo "c52a018946ad62bf92bdfedf1ad65e2750d187704db567ef51442e74e1ed221b  qa/v3-q01-emulator/overlay/settings_ui_v3.js" | sha256sum -c -
          cp qa/v3-q01-emulator/overlay/settings_ui_v3.js "$RUNNER_TEMP/q02-runtime/source/app/src/main/assets/www/q01/settings_ui_v3.js"
          cp qa/v3-q01-emulator/Q01AndroidRuntimeTest.kt "$RUNNER_TEMP/q02-runtime/source/app/src/androidTest/java/org/glukopapa/v3/m00/Q01AndroidRuntimeTest.kt" 2>/dev/null || {
            mkdir -p "$RUNNER_TEMP/q02-runtime/source/app/src/androidTest/java/org/glukopapa/v3/m00"
            cp qa/v3-q01-emulator/Q01AndroidRuntimeTest.kt "$RUNNER_TEMP/q02-runtime/source/app/src/androidTest/java/org/glukopapa/v3/m00/Q01AndroidRuntimeTest.kt"
          }
          # QA-only, Q02 source is new native service, Q01 approved mathematical cores unchanged.
          echo "6d6f688a0c3766d4a11014f0de8bc502b7fe53587f0d16b9b7cbc6035c3c462e  qa/v3-q02-backup/GfV3EncryptedSnapshot.kt" | sha256sum -c -
          cp qa/v3-q02-backup/GfV3EncryptedSnapshot.kt "$RUNNER_TEMP/q02-runtime/source/app/src/main/java/org/glukopapa/v3/m00/GfV3EncryptedSnapshot.kt"
          echo "bde9d0dc7194aed8fa1f216aac0d51d18a578893ed24293615f2fd00324e1822  qa/v3-q02-backup/Q02AndroidBackupTest.kt" | sha256sum -c -
          cp qa/v3-q02-backup/Q02AndroidBackupTest.kt "$RUNNER_TEMP/q02-runtime/source/app/src/androidTest/java/org/glukopapa/v3/m00/Q02AndroidBackupTest.kt"

          # Q02 host owner permission adapters / approved HTML presentation, SHA-locked.
          echo "b23fdd2934a017f36f134b5c142abba71eb4c074525218712dfcfc5b1340e31b  qa/v3-q02-backup/GfV3BackupOwnerUi.kt" | sha256sum -c -
          cp qa/v3-q02-backup/GfV3BackupOwnerUi.kt "$RUNNER_TEMP/q02-runtime/source/app/src/main/java/org/glukopapa/v3/m00/GfV3BackupOwnerUi.kt"
          echo "4f77e75770feedce08804c37e9c4ffd6ccd3307474ba0517469f089d02ade6ed  qa/v3-q02-backup/GfV3Q02Bridge.kt" | sha256sum -c -
          cp qa/v3-q02-backup/GfV3Q02Bridge.kt "$RUNNER_TEMP/q02-runtime/source/app/src/main/java/org/glukopapa/v3/m00/GfV3Q02Bridge.kt"
          echo "1c6bbb0a8e5676fc86186cd8e6d83ed2782f8ad2dae1230891544eece308986a  qa/v3-q02-backup/overlay/backup.html" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/q02-runtime/source/app/src/main/assets/www/q02"
          cp qa/v3-q02-backup/overlay/backup.html "$RUNNER_TEMP/q02-runtime/source/app/src/main/assets/www/q02/backup.html"
          echo "e0860115f4ebc232157e42a8578735b728650b67ec2ba3712022be2bcee1bd5b  qa/v3-q02-backup/apply_q02_ui_patch.py" | sha256sum -c -
          python3 qa/v3-q02-backup/apply_q02_ui_patch.py "$RUNNER_TEMP/q02-runtime/source"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'q02-runtime/source/app/build.gradle.kts'
          content=p.read_text('utf-8').replace('targetSdk = 35','targetSdk = 35\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"').replace('applicationIdSuffix = ".q01qa"','applicationIdSuffix = ".q02qa"').replace('versionName = "0.10-Q01-INTEGRATION-QA"','versionName = "0.11-Q02-BACKUP-QA"')
          content+='\n\ndependencies {\n    androidTestImplementation("androidx.test:core:1.6.1")\n    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n    androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")\n}\n'
          p.write_text(content,'utf-8')
          PY
      - name: Grant access to KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 SQLite encrypted backup/restore real instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash qa/v3-q02-backup/run_q02_emulator.sh
      - name: Upload Q02 QA-only test APK (NOT approved)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GlukoPapa-V3-Q02-EMULATOR-PASS-debug-apk
          path: ${{ runner.temp }}/q02-runtime/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload emulator evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlukoPapa-Q02-Android-Emulator-Runtime-QA
          path: ${{ runner.temp }}/q02-runtime/evidence/
          if-no-files-found: warn
          retention-days: 14
